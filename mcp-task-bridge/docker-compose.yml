version: "3.9"

services:
  # PostgreSQL database for multi-AI coordination and persistence
  db:
    image: postgres:16-alpine
    container_name: multi-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-ai}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Please set PGPASSWORD environment variable}
      POSTGRES_DB: ${PGDATABASE:-ai_multi}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-ai} -d ${PGDATABASE:-ai_multi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - multi-ai-network

  # Optional: Redis for caching and message queuing
  redis:
    image: redis:7-alpine
    container_name: multi-ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - multi-ai-network
    profiles:
      - full  # Only start with docker-compose --profile full up

  # Optional: LiteLLM proxy server for unified AI access
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: multi-ai-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    command: ["litellm", "--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - multi-ai-network
    profiles:
      - full  # Only start with docker-compose --profile full up
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  multi-ai-network:
    driver: bridge
    name: multi-ai-network
