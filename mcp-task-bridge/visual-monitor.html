<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1多AI并行开发监控面板</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@latest/standalone/umd/vis-network.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .project-info {
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .info-value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card h2 {
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
        }
        
        .ai-agent {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 5px solid;
        }
        
        .agent-info {
            flex: 1;
        }
        
        .agent-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .agent-role {
            color: #666;
            font-size: 0.9em;
        }
        
        .agent-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-ready {
            background: #fff3cd;
            color: #856404;
        }
        
        .phase-timeline {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
        }
        
        .phase-timeline::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, #4A90E2, #50C878, #FF6B35);
            z-index: 0;
        }
        
        .phase {
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 3px solid;
            min-width: 150px;
        }
        
        .phase.active {
            box-shadow: 0 0 20px rgba(74, 144, 226, 0.5);
        }
        
        .phase-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .phase-duration {
            font-size: 0.9em;
            color: #666;
        }
        
        .task-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .task-info {
            flex: 1;
        }
        
        .task-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .task-meta {
            font-size: 0.9em;
            color: #666;
        }
        
        .task-progress {
            width: 100px;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4A90E2, #50C878);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .dependencies-graph {
            height: 500px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .metric-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4A90E2;
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9em;
        }
        
        .risk-item {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid;
        }
        
        .risk-high {
            border-color: #dc3545;
            background: #f8d7da;
        }
        
        .risk-medium {
            border-color: #ffc107;
            background: #fff3cd;
        }
        
        .risk-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .risk-mitigation {
            font-size: 0.9em;
            color: #666;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .project-info {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 M1多AI并行开发监控面板</h1>
        <div class="project-info">
            <div class="info-item">
                <span class="info-label">项目ID</span>
                <span class="info-value">523</span>
            </div>
            <div class="info-item">
                <span class="info-label">优先级</span>
                <span class="info-value">高</span>
            </div>
            <div class="info-item">
                <span class="info-label">预计工期</span>
                <span class="info-value">7天</span>
            </div>
            <div class="info-item">
                <span class="info-label">开始日期</span>
                <span class="info-value">2025-08-24</span>
            </div>
            <div class="info-item">
                <span class="info-label">结束日期</span>
                <span class="info-value">2025-08-30</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="dashboard-grid">
            <!-- AI团队状态 -->
            <div class="card">
                <h2>🤖 AI团队状态</h2>
                <div id="ai-agents"></div>
            </div>

            <!-- 阶段进度 -->
            <div class="card">
                <h2>📊 阶段进度</h2>
                <div class="phase-timeline" id="phase-timeline"></div>
            </div>

            <!-- 任务列表 -->
            <div class="card">
                <h2>📝 任务列表</h2>
                <div class="task-list" id="task-list"></div>
            </div>

            <!-- 成功指标 -->
            <div class="card">
                <h2>🎯 成功指标</h2>
                <div class="metrics-grid" id="success-metrics"></div>
            </div>

            <!-- 依赖关系图 -->
            <div class="card full-width">
                <h2>🔗 任务依赖关系图</h2>
                <div class="dependencies-graph" id="dependencies-graph"></div>
            </div>

            <!-- 风险管理 -->
            <div class="card full-width">
                <h2>⚠️ 风险管理</h2>
                <div id="risk-management"></div>
            </div>
        </div>
    </div>

    <script>
        // 模拟实时数据（实际应用中从API获取）
        let projectData = {};

        // 加载项目数据
        async function loadProjectData() {
            try {
                const response = await fetch('./task-523-parallel-dev.json');
                projectData = await response.json();
                initializeDashboard();
            } catch (error) {
                console.error('Error loading project data:', error);
                // 如果无法加载JSON文件，使用模拟数据
                loadMockData();
                initializeDashboard();
            }
        }

        // 模拟数据
        function loadMockData() {
            projectData = {
                "ai_agents": {
                    "architect": {
                        "name": "AI-架构师",
                        "role": "Architecture AI",
                        "color": "#4A90E2",
                        "status": "active",
                        "assigned_tasks": [574, 576]
                    },
                    "database": {
                        "name": "AI-数据库专家",
                        "role": "Database AI",
                        "color": "#50C878",
                        "status": "ready",
                        "assigned_tasks": [576, 577, 578]
                    },
                    "testing": {
                        "name": "AI-测试工程师",
                        "role": "Testing AI",
                        "color": "#FF6B35",
                        "status": "ready",
                        "assigned_tasks": [579]
                    },
                    "devops": {
                        "name": "AI-DevOps工程师",
                        "role": "DevOps AI",
                        "color": "#9B59B6",
                        "status": "active",
                        "assigned_tasks": [580]
                    }
                },
                "phases": [
                    {
                        "id": "phase1",
                        "name": "基础准备阶段",
                        "duration": "2天",
                        "start_date": "2025-08-24",
                        "end_date": "2025-08-25"
                    },
                    {
                        "id": "phase2",
                        "name": "核心开发阶段",
                        "duration": "3天",
                        "start_date": "2025-08-26",
                        "end_date": "2025-08-28"
                    },
                    {
                        "id": "phase3",
                        "name": "集成测试阶段",
                        "duration": "2天",
                        "start_date": "2025-08-29",
                        "end_date": "2025-08-30"
                    }
                ],
                "tasks": [
                    {
                        "id": 574,
                        "task_id": "M1-1",
                        "title": "现状盘点与对齐准则",
                        "assignee": "ai-architect",
                        "status": "in_progress",
                        "progress": 20,
                        "phase": "phase1",
                        "dependencies": [],
                        "blocking": [576]
                    },
                    {
                        "id": 576,
                        "task_id": "M1-3",
                        "title": "Prisma 初始化与基线迁移",
                        "assignee": "ai-database",
                        "status": "todo",
                        "progress": 0,
                        "phase": "phase2",
                        "dependencies": [574],
                        "blocking": [577]
                    }
                ],
                "success_metrics": {
                    "technical": {
                        "prisma_init_success_rate": "100%",
                        "data_migration_integrity": "100%",
                        "test_coverage": "≥80%",
                        "performance_benchmark": "<200ms"
                    },
                    "efficiency": {
                        "parallel_dev_improvement": "≥50%",
                        "code_conflict_rate": "<5%",
                        "rework_rate": "<10%",
                        "on_time_delivery": "100%"
                    }
                },
                "risk_management": {
                    "technical_risks": [
                        {
                            "risk": "数据库兼容性",
                            "impact": "high",
                            "mitigation": "提前兼容性测试，准备回滚方案"
                        },
                        {
                            "risk": "性能瓶颈",
                            "impact": "medium",
                            "mitigation": "性能基准测试，索引优化"
                        }
                    ]
                },
                "dependencies_graph": {
                    "nodes": [
                        { "id": 574, "label": "M1-1: 现状盘点", "group": "phase1" },
                        { "id": 576, "label": "M1-3: Prisma初始化", "group": "phase2" }
                    ],
                    "edges": [
                        { "from": 574, "to": 576, "label": "提供设计规范" }
                    ]
                }
            };
        }

        // 初始化仪表板
        function initializeDashboard() {
            renderAIAgents();
            renderPhaseTimeline();
            renderTaskList();
            renderSuccessMetrics();
            renderDependenciesGraph();
            renderRiskManagement();
            
            // 启动实时更新
            setInterval(updateProgress, 5000);
        }

        // 渲染AI团队状态
        function renderAIAgents() {
            const container = document.getElementById('ai-agents');
            container.innerHTML = '';

            Object.entries(projectData.ai_agents || {}).forEach(([key, agent]) => {
                const agentElement = document.createElement('div');
                agentElement.className = 'ai-agent';
                agentElement.style.borderLeftColor = agent.color;

                agentElement.innerHTML = `
                    <div class="agent-info">
                        <div class="agent-name">${agent.name}</div>
                        <div class="agent-role">${agent.role}</div>
                        <div>负责任务: ${agent.assigned_tasks ? agent.assigned_tasks.length : 0} 个</div>
                    </div>
                    <div class="agent-status status-${agent.status}">${agent.status}</div>
                `;

                container.appendChild(agentElement);
            });
        }

        // 渲染阶段时间线
        function renderPhaseTimeline() {
            const container = document.getElementById('phase-timeline');
            container.innerHTML = '';

            (projectData.phases || []).forEach((phase, index) => {
                const phaseElement = document.createElement('div');
                phaseElement.className = 'phase';
                
                // 确定当前活跃阶段
                const currentDate = new Date();
                const phaseStart = new Date(phase.start_date);
                const phaseEnd = new Date(phase.end_date);
                
                if (currentDate >= phaseStart && currentDate <= phaseEnd) {
                    phaseElement.classList.add('active');
                }

                // 设置阶段颜色
                const colors = ['#4A90E2', '#50C878', '#FF6B35'];
                phaseElement.style.borderColor = colors[index % colors.length];

                phaseElement.innerHTML = `
                    <div class="phase-name">${phase.name}</div>
                    <div class="phase-duration">${phase.duration}</div>
                    <div style="font-size: 0.8em; color: #999;">${phase.start_date} ~ ${phase.end_date}</div>
                `;

                container.appendChild(phaseElement);
            });
        }

        // 渲染任务列表
        function renderTaskList() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';

            (projectData.tasks || []).forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-item';
                
                // 根据负责人设置边框颜色
                const assigneeColors = {
                    'ai-architect': '#4A90E2',
                    'ai-database': '#50C878',
                    'ai-testing': '#FF6B35',
                    'ai-devops': '#9B59B6'
                };
                
                taskElement.style.borderLeftColor = assigneeColors[task.assignee] || '#ccc';

                taskElement.innerHTML = `
                    <div class="task-info">
                        <div class="task-title">${task.task_id}: ${task.title}</div>
                        <div class="task-meta">
                            负责人: ${projectData.ai_agents[task.assignee]?.name || task.assignee} | 
                            状态: ${task.status} | 
                            阶段: ${task.phase}
                        </div>
                        <div class="task-progress">
                            <div class="progress-bar" style="width: ${task.progress || 0}%"></div>
                        </div>
                        <div style="font-size: 0.8em; color: #666;">进度: ${task.progress || 0}%</div>
                    </div>
                `;

                container.appendChild(taskElement);
            });
        }

        // 渲染成功指标
        function renderSuccessMetrics() {
            const container = document.getElementById('success-metrics');
            container.innerHTML = '';

            const metrics = projectData.success_metrics || {};
            const allMetrics = { ...metrics.technical, ...metrics.efficiency };

            Object.entries(allMetrics).forEach(([key, value]) => {
                const metricElement = document.createElement('div');
                metricElement.className = 'metric-item';

                const labelMap = {
                    'prisma_init_success_rate': 'Prisma初始化成功率',
                    'data_migration_integrity': '数据迁移完整性',
                    'test_coverage': '测试覆盖率',
                    'performance_benchmark': '性能基准',
                    'parallel_dev_improvement': '并行开发效率提升',
                    'code_conflict_rate': '代码冲突率',
                    'rework_rate': '返工率',
                    'on_time_delivery': '按时交付率'
                };

                metricElement.innerHTML = `
                    <div class="metric-value">${value}</div>
                    <div class="metric-label">${labelMap[key] || key}</div>
                `;

                container.appendChild(metricElement);
            });
        }

        // 渲染依赖关系图
        function renderDependenciesGraph() {
            const container = document.getElementById('dependencies-graph');
            
            if (!projectData.dependencies_graph) return;

            const nodes = new vis.DataSet(projectData.dependencies_graph.nodes.map(node => ({
                id: node.id,
                label: node.label,
                group: node.group,
                color: {
                    background: node.group === 'phase1' ? '#4A90E2' : 
                               node.group === 'phase2' ? '#50C878' : '#FF6B35',
                    border: '#2B7CE9'
                }
            })));

            const edges = new vis.DataSet(projectData.dependencies_graph.edges.map(edge => ({
                from: edge.from,
                to: edge.to,
                label: edge.label,
                arrows: 'to'
            })));

            const data = { nodes, edges };

            const options = {
                layout: {
                    hierarchical: {
                        direction: 'UD',
                        sortMethod: 'directed'
                    }
                },
                physics: {
                    enabled: false
                },
                nodes: {
                    shape: 'box',
                    margin: 10,
                    font: { color: 'white' }
                },
                edges: {
                    font: { align: 'middle' },
                    arrows: { to: { scaleFactor: 1.2 } }
                }
            };

            new vis.Network(container, data, options);
        }

        // 渲染风险管理
        function renderRiskManagement() {
            const container = document.getElementById('risk-management');
            container.innerHTML = '';

            const risks = projectData.risk_management || {};

            ['technical_risks', 'collaboration_risks'].forEach(riskType => {
                if (risks[riskType]) {
                    const typeTitle = document.createElement('h3');
                    typeTitle.textContent = riskType === 'technical_risks' ? '技术风险' : '协作风险';
                    typeTitle.style.marginBottom = '15px';
                    container.appendChild(typeTitle);

                    risks[riskType].forEach(risk => {
                        const riskElement = document.createElement('div');
                        riskElement.className = `risk-item risk-${risk.impact}`;

                        riskElement.innerHTML = `
                            <div class="risk-title">${risk.risk} (影响: ${risk.impact})</div>
                            <div class="risk-mitigation">缓解措施: ${risk.mitigation}</div>
                        `;

                        container.appendChild(riskElement);
                    });
                }
            });
        }

        // 模拟进度更新
        function updateProgress() {
            if (!projectData.tasks) return;

            projectData.tasks.forEach(task => {
                if (task.status === 'in_progress') {
                    task.progress = Math.min(100, task.progress + Math.random() * 10);
                    if (task.progress >= 100) {
                        task.status = 'completed';
                    }
                }
            });

            renderTaskList();
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', loadProjectData);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>并行任务执行监控 - 实时可视化</title>
    <style>
        /* 紧凑与网格布局 */
        body.compact { padding: 12px; }
        body.compact .header h1 { font-size: 1.6em; }
        body.compact .timer { font-size: 0.95em; padding: 6px 12px; }
        .tasks-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
        .task-card { padding: 14px; min-width: 300px; border-radius: 12px; box-shadow: none; }
        .progress-bar { height: 16px; }
        .task-output { font-size: 0.85em; min-height: 40px; margin-bottom: 8px; }
        .task-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 10px; border: none; border-radius: 10px; background: #2196F3; color: #fff; cursor: pointer; font-size: 12px; }
        .btn-sm.success { background: #4CAF50; }
        .select-sm { height: 28px; border-radius: 8px; border: none; padding: 0 8px; background: rgba(255,255,255,0.85); color: #333; }
        .action-result { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        .toolbar { display: flex; gap: 10px; align-items: center; justify-content: center; margin: 8px 0 16px; }
        .toolbar .btn-sm { padding: 6px 10px; border: none; border-radius: 10px; background: #9E9E9E; color: #fff; cursor: pointer; font-size: 12px; }
        .toolbar .btn-sm.success { background: #4CAF50; }
        .toolbar .btn-sm.primary { background: #2196F3; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .timer {
            font-size: 1.2em;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .tasks-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            width: 100%;
        }

        .task-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            min-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: slideUp 0.5s ease-out;
            transition: transform 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-5px);
        }

        .task-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .task-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .task-title {
            flex: 1;
        }

        .task-title h2 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .task-role {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .task-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }

        .status-completed {
            background: #4caf50;
            animation: none;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00C851, #00FF00);
            border-radius: 15px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        .task-output {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            min-height: 60px;
            margin-bottom: 15px;
            border-left: 3px solid #00C851;
        }

        .task-logs {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85em;
            font-family: monospace;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .overall-progress {
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .overall-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .overall-progress-bar {
            width: 100%;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .overall-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .completion-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-in;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .completion-message h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .task-589 { border-top: 3px solid #4CAF50; }
        .task-590 { border-top: 3px solid #2196F3; }
        .task-591 { border-top: 3px solid #9C27B0; }
        /* 汇总卡样式 */
        .summary-card { border-top: 3px solid #FFC107; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="page-title">🚀 并行任务执行监控</h1>
        <div class="timer" id="timer">运行时间: 00:00:00</div>
    </div>

    <div class="toolbar">
        <button class="btn-sm primary" id="btn-batch-docs">📄 批量创建文档</button>
        <button class="btn-sm success" id="btn-batch-inprogress">▶️ 批量状态→in_progress</button>
        <button class="btn-sm" id="btn-refresh-state">🔄 刷新状态</button>
    </div>

    <div class="tasks-container" id="tasksContainer"></div>

    <div class="overall-progress">
        <div class="overall-header">
            <h2>总体进度</h2>
        </div>
        <div class="overall-progress-bar">
            <div class="overall-progress-fill" id="overall-progress" style="width: 0%">
                <span id="overall-percent">0%</span>
            </div>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="completed-count">0/3</div>
                <div class="stat-label">已完成任务</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="parallel-rate">100%</div>
                <div class="stat-label">并行度</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time-saved">0%</div>
                <div class="stat-label">节省时间</div>
            </div>
        </div>
    </div>

    <div class="completion-message" id="completion-message">
        <h2>🎉 所有任务完成!</h2>
        <p>3个任务并行执行成功</p>
        <p>总耗时: <span id="total-time"></span></p>
        <p>节省时间: ~40%</p>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let tasks = {};
        let taskConfig = [];
        let REALTIME_OPTS = { wsUrl: null, pollUrl: null, pollIntervalMs: 2000 };

        // URL 参数
        const params = new URLSearchParams(window.location.search);
        const MCP_ENDPOINT = params.get('mcpEndpoint') || null;
        const compact = params.get('compact');
        const zoom = params.get('zoom');
        const CONFIG_URL = params.get('config');
        const AUTO_START = params.get('autoStart');
        const wsUrl = params.get('wsUrl');
        const pollUrl = params.get('pollUrl');
        const pollIntervalMs = parseInt(params.get('pollIntervalMs') || '2000', 10);
        const parentTitleParam = params.get('parentTitle');
        const parentIdParam = params.get('parentId');
        REALTIME_OPTS = { wsUrl, pollUrl, pollIntervalMs };

        if (compact === null || compact === '1' || compact === 'true') document.body.classList.add('compact');
        if (zoom) document.body.style.zoom = zoom;

        function setPageTitle(title) {
            const el = document.getElementById('page-title');
            if (el && title) {
                el.textContent = `🚀 ${title}`;
                document.title = title;
            }
        }

        if (parentTitleParam) {
            setPageTitle(parentTitleParam);
        } else if (parentIdParam && MCP_ENDPOINT) {
            // 通过 MCP 桥接查询父任务标题
            (async () => {
                try {
                    const resp = await fetch(`${MCP_ENDPOINT}/mcp/find-task`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: Number(parentIdParam) })
                    });
                    const resJson = await resp.json();
                    const title = resJson?.data?.tasks?.[0]?.title || resJson?.data?.task?.title;
                    if (title) setPageTitle(title);
                } catch (e) {
                    console.warn('获取父任务标题失败:', e);
                }
            })();
        }

        // 默认配置（等价于原页面的三个示例任务）
        function defaultConfig() {
            return [
                {
                    id: "589",
                    name: "Task #589: 数据库迁移",
                    icon: "🗄️",
                    role: "ai-golang-engineer",
                    stages: [
                        {name: "CONNECTING", duration: 1000, progress: 10, note: "连接到PostgreSQL..."},
                        {name: "DESIGNING", duration: 2000, progress: 25, note: "设计表结构..."},
                        {name: "CREATING", duration: 2000, progress: 40, note: "创建迁移脚本..."},
                        {name: "DEPLOYING", duration: 2000, progress: 60, note: "执行迁移..."},
                        {name: "VERIFYING", duration: 1500, progress: 80, note: "验证迁移结果..."},
                        {name: "COMPLETED", duration: 800, progress: 100, note: "数据库迁移完成！"}
                    ]
                },
                {
                    id: "590",
                    name: "Task #590: API开发",
                    icon: "⚙️",
                    role: "ai-golang-engineer",
                    stages: [
                        {name: "LOADING", duration: 1000, progress: 15, note: "加载接口契约..."},
                        {name: "DESIGNING", duration: 2500, progress: 30, note: "设计API端点..."},
                        {name: "MOCK_IMPL", duration: 2500, progress: 45, note: "实现Mock Repository..."},
                        {name: "SERVICE_IMPL", duration: 2500, progress: 65, note: "实现服务层..."},
                        {name: "HANDLER_IMPL", duration: 2000, progress: 85, note: "实现HTTP处理器..."},
                        {name: "COMPLETED", duration: 800, progress: 100, note: "API开发完成！"}
                    ]
                },
                {
                    id: "591",
                    name: "Task #591: 测试套件",
                    icon: "🧪",
                    role: "ai-qa",
                    stages: [
                        {name: "SETUP", duration: 2000, progress: 10, note: "安装测试依赖..."},
                        {name: "FRAMEWORK", duration: 2500, progress: 25, note: "搭建测试框架..."},
                        {name: "UNIT_TESTS", duration: 3000, progress: 40, note: "编写单元测试..."},
                        {name: "CONCURRENCY", duration: 2500, progress: 60, note: "编写并发测试..."},
                        {name: "PERFORMANCE", duration: 2000, progress: 80, note: "编写性能测试..."},
                        {name: "RUNNING", duration: 1500, progress: 95, note: "执行测试套件..."},
                        {name: "COMPLETED", duration: 600, progress: 100, note: "测试完成！覆盖率85%"}
                    ]
                }
            ];
        }

        async function loadConfig() {
            if (CONFIG_URL) {
                try {
                    const resp = await fetch(CONFIG_URL, { cache: 'no-store' });
                    taskConfig = await resp.json();
                    if (!Array.isArray(taskConfig)) taskConfig = [];
                } catch (e) {
                    console.error('加载配置失败:', e);
                    taskConfig = defaultConfig();
                }
            } else {
                taskConfig = defaultConfig();
            }
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';
            tasks = {};

            taskConfig.forEach(cfg => {
                tasks[cfg.id] = { progress: 0, status: 'INITIALIZING', output: '初始化中...' };
                const isSummary = !!cfg.summaryOf;
                const card = document.createElement('div');
                card.className = 'task-card' + (isSummary ? ' summary-card' : '');
                card.innerHTML = `
                    <div class="task-header">
                        <div class="task-icon">${cfg.icon || '📦'}</div>
                        <div class="task-title">
                            <h2>${cfg.name}</h2>
                            <div class="task-role">${isSummary ? 'Summary' : (cfg.role || 'Worker')}</div>
                        </div>
                    </div>
                    <div class="task-status" id="status-${cfg.id}">INITIALIZING</div>
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>进度</span>
                            <span id="progress-text-${cfg.id}">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-${cfg.id}" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="task-output" id="output-${cfg.id}">${isSummary ? `汇总 ${(cfg.summaryOf||[]).length} 个任务` : '初始化中...'}</div>
                    <div class="task-actions">
                        <button class="btn-sm" onclick="onCreateDocClick('${cfg.id}')">📄 创建文档</button>
                        <select class="select-sm" id="status-select-${cfg.id}">
                            <option value="todo">todo</option>
                            <option value="in_progress">in_progress</option>
                            <option value="testing">testing</option>
                            <option value="completed">completed</option>
                        </select>
                        <button class="btn-sm success" onclick="onUpdateStatusClick('${cfg.id}')">⬆️ 更新状态</button>
                    </div>
                    <div class="action-result" id="action-${cfg.id}"></div>
                    <div class="task-logs" id="logs-${cfg.id}"></div>
                `;
                container.appendChild(card);
            });

            // 绑定总控按钮
            const btnDocs = document.getElementById('btn-batch-docs');
            if (btnDocs) btnDocs.onclick = batchCreateDocs;
            const btnInprog = document.getElementById('btn-batch-inprogress');
            if (btnInprog) btnInprog.onclick = () => batchUpdateStatus('in_progress');
            const btnRefresh = document.getElementById('btn-refresh-state');
            if (btnRefresh) btnRefresh.onclick = refreshState;

            // 初始化总体完成数（不统计汇总卡）
            const nonSummaryCount = taskConfig.filter(cfg => !cfg.summaryOf).length;
            document.getElementById('completed-count').textContent = `0/${nonSummaryCount}`;
        }

        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = `运行时间: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateTaskProgress(taskId, progress, status, output) {
            if (!tasks[taskId]) tasks[taskId] = { progress: 0, status: 'INITIALIZING', output: '' };
            const s = status || tasks[taskId].status || 'RUNNING';
            const o = output || tasks[taskId].output || '';
            tasks[taskId].progress = Math.max(0, Math.min(100, progress));
            tasks[taskId].status = s;
            tasks[taskId].output = o;
            const pEl = document.getElementById(`progress-${taskId}`);
            const ptEl = document.getElementById(`progress-text-${taskId}`);
            const stEl = document.getElementById(`status-${taskId}`);
            const outEl = document.getElementById(`output-${taskId}`);
            if (pEl) pEl.style.width = `${tasks[taskId].progress}%`;
            if (ptEl) ptEl.textContent = `${Math.round(tasks[taskId].progress)}%`;
            if (stEl) stEl.textContent = s;
            if (outEl) outEl.textContent = o;
            if (tasks[taskId].progress === 100 && stEl) {
                stEl.classList.add('status-completed');
                stEl.textContent = '✅ COMPLETED';
            }
            updateOverallProgress();
        }

        function updateOverallProgress() {
            const nonSummary = taskConfig.filter(cfg => !cfg.summaryOf);
            const denom = nonSummary.length || 1;
            const total = nonSummary.reduce((sum, cfg) => sum + (tasks[cfg.id]?.progress || 0), 0);
            const totalProgress = total / denom;
            document.getElementById('overall-progress').style.width = `${totalProgress}%`;
            document.getElementById('overall-percent').textContent = `${Math.round(totalProgress)}%`;
            const completed = nonSummary.filter(cfg => (tasks[cfg.id]?.progress === 100)).length;
            document.getElementById('completed-count').textContent = `${completed}/${denom}`;
            const timeSaved = Math.min(40, Math.round(totalProgress * 0.4));
            document.getElementById('time-saved').textContent = `${timeSaved}%`;
            updateSummaryCards();
            if (completed === denom) showCompletion();
        }

        function showCompletion() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('total-time').textContent = `${minutes}分${seconds}秒`;
            document.getElementById('completion-message').style.display = 'block';
        }

        async function simulateTask(cfg) {
            if (cfg.summaryOf && Array.isArray(cfg.summaryOf)) {
                updateSummaryCards();
                return;
            }
            const stages = cfg.stages || [ {name: 'STEP1', duration: 2000, progress: 50, note: ''}, {name: 'STEP2', duration: 2000, progress: 100, note: ''} ];
            for (const st of stages) {
                updateTaskProgress(cfg.id, st.progress - 10, st.name, `执行中: ${st.note || st.name}`);
                addLog(cfg.id, `开始阶段: ${st.name}`);
                await sleep(st.duration * 0.5);
                updateTaskProgress(cfg.id, st.progress, st.name, `${st.note || st.name} 完成`);
                addLog(cfg.id, `完成阶段: ${st.name}`);
                await sleep(st.duration * 0.5);
            }
            // 结束自动置完成
            addLog(cfg.id, `全部阶段完成，更新状态为 completed`);
            try { await updateTaskStatus(cfg.id, 'completed'); } catch (_) {}
        }

        function addLog(taskId, message) {
            const el = document.getElementById(`logs-${taskId}`);
            if (!el) return;
            const row = document.createElement('div');
            row.className = 'log-entry';
            row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            el.appendChild(row);
            el.scrollTop = el.scrollHeight;
        }

        // 动作：创建文档 / 更新状态
        async function onCreateDocClick(taskId) {
            const cfg = taskConfig.find(t => String(t.id) === String(taskId));
            if (!cfg) return;
            await createTaskDoc(cfg);
        }
        async function onUpdateStatusClick(taskId) {
            const sel = document.getElementById(`status-select-${taskId}`);
            if (!sel) return;
            await updateTaskStatus(taskId, sel.value);
        }
        async function createTaskDoc(cfg) {
            const payload = { action: 'create_document', taskId: Number(cfg.id), title: `[Doc] ${cfg.name}`, projectId: 1, content: `# 任务文档\n\n- 任务ID: ${cfg.id}\n- 名称: ${cfg.name}` };
            addLog(cfg.id, `发起创建文档 (taskId=${cfg.id})`);
            const result = await tryMcpPost('/mcp/create-document', payload);
            showActionResult(cfg.id, result);
            const via = (result && result.data && result.data.via) ? result.data.via : result.via;
            if (result.ok) addLog(cfg.id, `创建文档成功（via: ${via}）`); else addLog(cfg.id, `创建文档失败（via: ${via}）：${result.error || 'unknown'}`);
        }
        async function updateTaskStatus(taskId, status) {
            const payload = { action: 'update_task', id: Number(taskId), updates: { status } };
            addLog(taskId, `更新状态为 ${status}`);
            const result = await tryMcpPost('/mcp/update-task', payload);
            showActionResult(taskId, result);
            const via = (result && result.data && result.data.via) ? result.data.via : result.via;
            if (result.ok) addLog(taskId, `状态已更新为 ${status}（via: ${via}）`); else addLog(taskId, `状态更新失败（via: ${via}）：${result.error || 'unknown'}`);
        }
        async function tryMcpPost(path, payload) {
            try {
                if (MCP_ENDPOINT) {
                    const resp = await fetch(MCP_ENDPOINT + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json().catch(()=>({ ok:true }));
                    return { ok: true, via: 'http', data };
                }
                await copyToClipboard(JSON.stringify(payload, null, 2));
                return { ok: true, via: 'clipboard' };
            } catch (e) {
                try { await copyToClipboard(JSON.stringify(payload, null, 2)); } catch(_) {}
                return { ok: false, via: MCP_ENDPOINT ? 'http' : 'clipboard', error: String(e) };
            }
        }
        function showActionResult(taskId, result) {
            const el = document.getElementById(`action-${taskId}`);
            if (!el) return;
            if (result.ok) { el.style.color = '#C8E6C9'; el.textContent = result.via === 'http' ? '✅ 已通过 MCP 接口完成' : '✅ 已复制 JSON 载荷'; }
            else { el.style.color = '#FFCDD2'; el.textContent = `❌ 操作失败：${result.error || ''}`; }
        }
        async function copyToClipboard(text) {
            if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
            const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
        }

        // 汇总卡刷新
        function updateSummaryCards() {
            const summaries = taskConfig.filter(cfg => cfg.summaryOf && Array.isArray(cfg.summaryOf));
            summaries.forEach(cfg => {
                const ids = cfg.summaryOf.map(String);
                const denom = ids.length || 1;
                const avg = ids.reduce((sum, id) => sum + (tasks[id]?.progress || 0), 0) / denom;
                tasks[cfg.id].progress = Math.round(avg);
                const allCompleted = ids.every(id => (tasks[id]?.progress === 100));
                const status = allCompleted ? '✅ COMPLETED' : 'AGGREGATED';
                const pEl = document.getElementById(`progress-${cfg.id}`);
                const ptEl = document.getElementById(`progress-text-${cfg.id}`);
                const stEl = document.getElementById(`status-${cfg.id}`);
                const outEl = document.getElementById(`output-${cfg.id}`);
                if (pEl) pEl.style.width = `${tasks[cfg.id].progress}%`;
                if (ptEl) ptEl.textContent = `${tasks[cfg.id].progress}%`;
                if (stEl) stEl.textContent = status;
                if (allCompleted && stEl) stEl.classList.add('status-completed');
                if (outEl) outEl.textContent = `汇总 ${ids.length} 个任务，平均进度 ${tasks[cfg.id].progress}%`;
            });
        }

        // 依赖与启动延迟
        async function runTaskWithDependencies(cfg) {
            if (cfg.summaryOf && Array.isArray(cfg.summaryOf)) {
                updateSummaryCards();
                return; // 汇总卡不执行模拟
            }
            if (Array.isArray(cfg.dependsOn) && cfg.dependsOn.length > 0) {
                updateTaskProgress(cfg.id, 0, 'WAITING_DEPS', '等待依赖完成...');
                await waitForDependencies(cfg.dependsOn);
            }
            const delay = parseInt(cfg.startDelayMs || 0, 10);
            if (!Number.isNaN(delay) && delay > 0) {
                updateTaskProgress(cfg.id, 0, 'DELAYED_START', `延迟启动 ${delay}ms...`);
                await sleep(delay);
            }
            simulateTask(cfg);
        }

        async function waitForDependencies(depIds) {
            const ids = (depIds || []).map(String);
            const unmet = () => ids.filter(id => !tasks[id] || tasks[id].progress !== 100);
            return new Promise(resolve => {
                const check = () => { if (unmet().length === 0) { clearInterval(iv); resolve(); } };
                const iv = setInterval(check, 300);
                check();
            });
        }

        function connectWebSocket() {
            if (!REALTIME_OPTS.wsUrl) return;
            try {
                const ws = new WebSocket(REALTIME_OPTS.wsUrl);
                ws.onopen = () => console.log('WebSocket connected');
                ws.onmessage = (evt) => {
                    try {
                        const data = JSON.parse(evt.data);
                        const apply = (u) => {
                            if (!u || !u.id || typeof u.progress !== 'number') return;
                            updateTaskProgress(u.id, u.progress, u.status, u.output);
                        };
                        if (Array.isArray(data)) data.forEach(apply); else apply(data);
                    } catch (e) {
                        console.error('WS message parse error', e);
                    }
                };
                ws.onclose = () => console.log('WebSocket closed');
                ws.onerror = (e) => console.error('WebSocket error', e);
            } catch (e) {
                console.error('Failed to connect WebSocket:', e);
            }
        }

        function startPolling() {
            if (!REALTIME_OPTS.pollUrl) return;
            const interval = REALTIME_OPTS.pollIntervalMs || 2000;
            const apply = (u) => {
                if (!u || !u.id || typeof u.progress !== 'number') return;
                updateTaskProgress(u.id, u.progress, u.status, u.output);
            };
            setInterval(async () => {
                try {
                    const resp = await fetch(REALTIME_OPTS.pollUrl, { cache: 'no-store' });
                    const data = await resp.json();
                    if (Array.isArray(data)) data.forEach(apply); else apply(data);
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, interval);
        }

        // 批量与刷新
        async function batchCreateDocs() {
            const nonSummary = taskConfig.filter(cfg => !cfg.summaryOf);
            for (const cfg of nonSummary) { try { await createTaskDoc(cfg); } catch(_) {} }
        }
        async function batchUpdateStatus(status) {
            const nonSummary = taskConfig.filter(cfg => !cfg.summaryOf);
            for (const cfg of nonSummary) { try { await updateTaskStatus(cfg.id, status); } catch(_) {} }
        }
        async function refreshState() {
            if (!MCP_ENDPOINT) return;
            try {
                const resp = await fetch(MCP_ENDPOINT + '/mcp/state', { cache: 'no-store' });
                const data = await resp.json();
                const map = data?.tasks || {};
                Object.keys(map).forEach(id => {
                    const t = map[id];
                    if (tasks[id]) {
                        addLog(id, `外部状态: ${t.status || 'unknown'}`);
                    }
                });
            } catch (e) {
                console.warn('刷新状态失败:', e);
            }
        }

        async function startMonitoring() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            const isRealtime = !!(REALTIME_OPTS.wsUrl || REALTIME_OPTS.pollUrl);
            if (isRealtime) {
                if (REALTIME_OPTS.wsUrl) connectWebSocket();
                if (REALTIME_OPTS.pollUrl) startPolling();
                return;
            }
            taskConfig.forEach(cfg => runTaskWithDependencies(cfg));
            // 自动化驱动（不对汇总卡执行）
            setTimeout(() => batchCreateDocs(), 200);
            setTimeout(() => batchUpdateStatus('in_progress'), 600);
        }

        // 启动入口
        (async function init() {
            await loadConfig();
            renderTasks();
            if (AUTO_START === '1' || AUTO_START === 'true') {
                startMonitoring();
            }
        })();
    </script>
</body>
