unclassified:
  location:
    url: "http://localhost:8080/"

jenkins:
  mode: EXCLUSIVE
  numExecutors: 0
  systemMessage: |
    Managed by JCasC. Docker Cloud connected at tcp://dind:2375
    Use labels: "docker" (basic) or "docker-cli" (with Docker CLI)
  remotingSecurity:
    enabled: true
  clouds:
    - docker:
        name: "docker"
        disabled: false
        dockerApi:
          dockerHost:
            uri: "tcp://dind:2375"
        templates:
          - labelString: "docker"
            remoteFs: "/home/jenkins/agent"
            instanceCapStr: "10"
            pullStrategy: PULL_LATEST
            connector:
              dockerComputerJNLPConnector:
                user: "jenkins"
                jenkinsUrl: "http://jenkins:8080/"
            dockerTemplateBase:
              image: "jenkins/inbound-agent:alpine-jdk17"

