<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通用并行任务监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .config-panel {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }

        .config-panel h3 {
            margin-bottom: 15px;
        }

        .config-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .config-input::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .config-button {
            padding: 10px 30px;
            background: #4CAF50;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        .config-button:hover {
            background: #45a049;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .timer {
            font-size: 1.2em;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

        .tasks-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            width: 100%;
        }

        .task-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            min-width: 380px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: slideUp 0.5s ease-out;
            transition: transform 0.3s ease;
        }

        .task-card:hover {
            transform: translateY(-5px);
        }

        .task-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .task-icon {
            font-size: 2em;
            margin-right: 15px;
        }

        .task-title {
            flex: 1;
        }

        .task-title h2 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .task-role {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .task-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.2);
            animation: pulse 2s infinite;
        }

        .status-completed {
            background: #4caf50;
            animation: none;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00C851, #00FF00);
            border-radius: 15px;
            transition: width 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        .task-output {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            min-height: 60px;
            margin-bottom: 15px;
            border-left: 3px solid #00C851;
        }

        .overall-progress {
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .overall-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .overall-progress-bar {
            width: 100%;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .overall-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2em;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .completion-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-in;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .mode-badge {
            position: absolute;
            right: 0;
            top: 0;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .completion-message h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .preset-buttons {
            margin-top: 10px;
        }

        .preset-button {
            padding: 8px 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            cursor: pointer;
            margin-right: 10px;
        }

        .preset-button:hover {
            background: rgba(255,255,255,0.3);
        }
        /* 紧凑模式样式 */
        body.compact {
            padding: 12px;
        }
        body.compact .header h1 { font-size: 1.6em; }
        body.compact .timer { font-size: 0.95em; padding: 6px 12px; }
        body.compact .config-panel { padding: 12px; border-radius: 12px; max-width: 1000px; }
        body.compact .tasks-container { gap: 12px; }
        body.compact .task-card { padding: 14px; min-width: 300px; border-radius: 12px; box-shadow: none; }
        body.compact .task-title h2 { font-size: 1.05em; }
        body.compact .task-role { font-size: 0.8em; }
        body.compact .progress-bar { height: 16px; }
        body.compact .task-output { font-size: 0.8em; min-height: 40px; margin-bottom: 8px; }
        body.compact .overall-progress { padding: 14px; border-radius: 12px; }
        .tasks-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-items: start; }

        /* 动作栏 */
        .task-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .btn-sm { padding: 6px 10px; border: none; border-radius: 10px; background: #2196F3; color: #fff; cursor: pointer; font-size: 12px; }
        .btn-sm.secondary { background: #607D8B; }
        .btn-sm.success { background: #4CAF50; }
        .select-sm { height: 28px; border-radius: 8px; border: none; padding: 0 8px; background: rgba(255,255,255,0.85); color: #333; }
        .action-result { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        .task-logs { max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 8px; font-size: 12px; font-family: monospace; margin-top: 8px; }
        .log-entry { margin-bottom: 4px; border-bottom: 1px dotted rgba(255,255,255,0.15); padding-bottom: 2px; }

        /* 汇总卡样式强调 */
        .summary-card { border-top: 3px solid #FFC107; }

    </style>
</head>
<body>
    <!-- 配置面板 -->
    <div class="config-panel" id="configPanel">
        <h3>🛠️ 配置并行任务</h3>
        <textarea class="config-input" id="taskConfig" rows="10" placeholder='输入JSON格式的任务配置，例如:
[
  {
    "id": "001",
    "name": "数据库设计",
    "icon": "🗄️",
    "role": "DBA",
    "stages": [
      {"name": "分析需求", "duration": 2000, "progress": 30},
      {"name": "设计架构", "duration": 3000, "progress": 60},
      {"name": "实现", "duration": 2000, "progress": 100}
    ]
  }
]'></textarea>
        
        <div class="preset-buttons">
            <button class="preset-button" onclick="loadPreset('backend')">后端开发示例</button>
            <button class="preset-button" onclick="loadPreset('frontend')">前端开发示例</button>
            <button class="preset-button" onclick="loadPreset('fullstack')">全栈开发示例</button>
        </div>
        
        <div style="margin-top: 15px;">
            <button class="config-button" onclick="startMonitoring()">开始监控</button>
            <button class="config-button" style="background: #f44336;" onclick="resetConfig()">重置</button>
        </div>
    </div>

    <div class="header">
        <h1>🚀 通用并行任务监控系统</h1>
        <div class="timer" id="timer">运行时间: 00:00:00</div>
        <div class="mode-badge" id="modeBadge">模式: 未初始化</div>
    </div>

    <div class="tasks-container" id="tasksContainer"></div>

    <div class="overall-progress">
        <div class="overall-header">
            <h2>总体进度</h2>
        </div>
        <div class="overall-progress-bar">
            <div class="overall-progress-fill" id="overall-progress" style="width: 0%">
                <span id="overall-percent">0%</span>
            </div>
        </div>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="completed-count">0/0</div>
                <div class="stat-label">已完成任务</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="parallel-rate">100%</div>
                <div class="stat-label">并行度</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="time-saved">0%</div>
                <div class="stat-label">节省时间</div>
            </div>
        </div>
    </div>

    <div class="completion-message" id="completion-message">
        <h2>🎉 所有任务完成!</h2>
        <p><span id="task-count"></span>个任务并行执行成功</p>
        <p>总耗时: <span id="total-time"></span></p>
        <p>节省时间: <span id="saved-time"></span></p>
    </div>

    <script>
        // 预设配置
        const PRESETS = {
            backend: [
                {
                    id: "001",
                    name: "数据库设计",
                    icon: "🗄️",
                    role: "Database Architect",
                    stages: [
                        {name: "需求分析", duration: 2000, progress: 20},
                        {name: "表结构设计", duration: 3000, progress: 50},
                        {name: "索引优化", duration: 2000, progress: 75},
                        {name: "部署验证", duration: 1500, progress: 100}
                    ]
                },
                {
                    id: "002",
                    name: "API开发",
                    icon: "⚙️",
                    role: "Backend Developer",
                    stages: [
                        {name: "接口设计", duration: 2500, progress: 25},
                        {name: "业务逻辑", duration: 4000, progress: 60},
                        {name: "数据集成", duration: 2000, progress: 85},
                        {name: "测试部署", duration: 1500, progress: 100}
                    ]
                },
                {
                    id: "003",
                    name: "缓存层",
                    icon: "⚡",
                    role: "DevOps Engineer",
                    stages: [
                        {name: "Redis配置", duration: 2000, progress: 30},
                        {name: "缓存策略", duration: 3000, progress: 65},
                        {name: "性能测试", duration: 2500, progress: 100}
                    ]
                }
            ],
            frontend: [
                {
                    id: "001",
                    name: "UI设计",
                    icon: "🎨",
                    role: "UI Designer",
                    stages: [
                        {name: "原型设计", duration: 3000, progress: 35},
                        {name: "组件库", duration: 3500, progress: 70},
                        {name: "响应式布局", duration: 2000, progress: 100}
                    ]
                },
                {
                    id: "002",
                    name: "React开发",
                    icon: "⚛️",
                    role: "Frontend Developer",
                    stages: [
                        {name: "组件开发", duration: 4000, progress: 40},
                        {name: "状态管理", duration: 3000, progress: 75},
                        {name: "路由配置", duration: 2000, progress: 100}
                    ]
                },
                {
                    id: "003",
                    name: "样式系统",
                    icon: "💅",
                    role: "CSS Specialist",
                    stages: [
                        {name: "主题设计", duration: 2500, progress: 45},
                        {name: "动画效果", duration: 3000, progress: 80},
                        {name: "优化打包", duration: 1500, progress: 100}
                    ]
                }
            ],
            fullstack: [
                {
                    id: "001",
                    name: "前端开发",
                    icon: "🎨",
                    role: "Frontend Team",
                    stages: [
                        {name: "Vue3组件", duration: 3500, progress: 30},
                        {name: "Vuex状态", duration: 2500, progress: 60},
                        {name: "API集成", duration: 2000, progress: 85},
                        {name: "UI测试", duration: 1500, progress: 100}
                    ]
                },
                {
                    id: "002",
                    name: "后端服务",
                    icon: "🚀",
                    role: "Backend Team",
                    stages: [
                        {name: "Go服务", duration: 3000, progress: 25},
                        {name: "gRPC接口", duration: 3500, progress: 55},
                        {name: "数据库层", duration: 2500, progress: 80},
                        {name: "单元测试", duration: 2000, progress: 100}
                    ]
                },
                {
                    id: "003",
                    name: "基础设施",
                    icon: "☁️",
                    role: "DevOps Team",
                    stages: [
                        {name: "Docker化", duration: 2000, progress: 35},
                        {name: "K8s部署", duration: 3500, progress: 70},
                        {name: "监控告警", duration: 2500, progress: 100}
                    ]
                },
                {
                    id: "004",
                    name: "质量保证",
                    icon: "✅",
                    role: "QA Team",
                    stages: [
                        {name: "测试计划", duration: 2000, progress: 30},
                        {name: "自动化测试", duration: 4000, progress: 65},
                        {name: "性能测试", duration: 3000, progress: 90},
                        {name: "验收测试", duration: 1500, progress: 100}
                    ]
                }
            ]
        };

        let startTime = null;
        let timerInterval = null;
        let tasks = {};
        let taskConfig = [];
        let REALTIME_OPTS = { wsUrl: null, pollUrl: null, pollIntervalMs: 2000 };

        // 加载预设
        function loadPreset(type) {
            document.getElementById('taskConfig').value = JSON.stringify(PRESETS[type], null, 2);
        }

        // 开始监控
        function startMonitoring() {
            const configText = document.getElementById('taskConfig').value;
            if (!configText) {
                alert('请输入任务配置！');
                return;
            }

            try {
                taskConfig = JSON.parse(configText);
                if (!Array.isArray(taskConfig) || taskConfig.length === 0) {
                    throw new Error('配置必须是非空数组');
                }
            } catch (e) {
                alert('配置格式错误: ' + e.message);
                return;
            }

            // 隐藏配置面板
            document.getElementById('configPanel').style.display = 'none';
            
            // 初始化任务
            initializeTasks();
            
            // 开始计时
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            
            // 实时模式优先：如果提供 wsUrl 或 pollUrl，则不执行本地模拟
            const isRealtime = !!(REALTIME_OPTS.wsUrl || REALTIME_OPTS.pollUrl);
            const badge = document.getElementById('modeBadge');
            if (isRealtime) {
                if (badge) badge.textContent = REALTIME_OPTS.wsUrl ? '模式: 实时 WS' : '模式: 实时 轮询';
                if (REALTIME_OPTS.wsUrl) connectWebSocket();
                if (REALTIME_OPTS.pollUrl) startPolling();
                return;
            } else {
                if (badge) badge.textContent = '模式: 本地模拟';
            }

            // 并行执行所有任务（支持依赖）
            taskConfig.forEach(task => {
                runTaskWithDependencies(task);
            });

            // 自动化驱动：为每个非汇总任务创建文档并设置状态为 in_progress
            autoDriveTasks();
        }

        // 初始化任务显示
        function initializeTasks() {
            const container = document.getElementById('tasksContainer');
            container.innerHTML = '';

            taskConfig.forEach(config => {
                tasks[config.id] = { progress: 0, status: 'INITIALIZING', output: '初始化中...' };
                
                const taskCard = document.createElement('div');
                const isSummary = !!config.summaryOf;
                taskCard.className = 'task-card' + (isSummary ? ' summary-card' : '');
                taskCard.innerHTML = `
                    <div class="task-header">
                        <div class="task-icon">${config.icon || '📦'}</div>
                        <div class="task-title">
                            <h2>${config.name}</h2>
                            <div class="task-role">${isSummary ? 'Summary' : (config.role || 'Worker')}</div>
                        </div>
                    </div>
                    <div class="task-status" id="status-${config.id}">INITIALIZING</div>
                    <div class="progress-container">
                        <div class="progress-label">
                            <span>进度</span>
                            <span id="progress-text-${config.id}">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-${config.id}" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="task-output" id="output-${config.id}">${isSummary ? `汇总 ${config.summaryOf?.length || 0} 个任务` : '初始化中...'}</div>
                    <div class="task-actions">
                        <button class="btn-sm" onclick="onCreateDocClick('${config.id}')">📄 创建文档</button>
                        <select class="select-sm" id="status-select-${config.id}">
                            <option value="todo">todo</option>
                            <option value="in_progress">in_progress</option>
                            <option value="testing">testing</option>
                            <option value="completed">completed</option>
                            <option value="blocked">blocked</option>
                            <option value="on_hold">on_hold</option>
                            <option value="suspended">suspended</option>
                            <option value="draft">draft</option>
                            <option value="planning">planning</option>
                            <option value="cancelled">cancelled</option>
                            <option value="archived">archived</option>
                        </select>
                        <button class="btn-sm success" onclick="onUpdateStatusClick('${config.id}')">⬆️ 更新状态</button>
                    </div>
                    <div class="action-result" id="action-${config.id}"></div>
                    <div class="task-logs" id="logs-${config.id}"></div>
                `;
                container.appendChild(taskCard);
            });

            const nonSummaryTotal = taskConfig.filter(cfg => !cfg.summaryOf).length;
            document.getElementById('completed-count').textContent = `0/${nonSummaryTotal}`;
        }

        // 更新计时器
        function updateTimer() {
            if (!startTime) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            document.getElementById('timer').textContent = 
                `运行时间: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 更新任务进度
        function updateTaskProgress(taskId, progress, status, output) {
            // 建立默认对象，保证实时模式下字段存在
            if (!tasks[taskId]) {
                tasks[taskId] = { progress: 0, status: 'INITIALIZING', output: '' };
            }
            const s = status || tasks[taskId].status || 'RUNNING';
            const o = output || tasks[taskId].output || '';

            tasks[taskId].progress = Math.max(0, Math.min(100, progress));
            tasks[taskId].status = s;
            tasks[taskId].output = o;
            
            const pEl = document.getElementById(`progress-${taskId}`);
            const ptEl = document.getElementById(`progress-text-${taskId}`);
            const stEl = document.getElementById(`status-${taskId}`);
            const outEl = document.getElementById(`output-${taskId}`);
            if (pEl) pEl.style.width = `${tasks[taskId].progress}%`;
            if (ptEl) ptEl.textContent = `${Math.round(tasks[taskId].progress)}%`;
            if (stEl) stEl.textContent = s;
            if (outEl) outEl.textContent = o;
            
            if (tasks[taskId].progress === 100) {
                if (stEl) stEl.classList.add('status-completed');
                if (stEl) stEl.textContent = '✅ COMPLETED';
            }
            
            updateOverallProgress();
        }

        // 更新总体进度
        function updateOverallProgress() {
            // 总体进度仅统计非汇总任务
            const nonSummary = taskConfig.filter(cfg => !cfg.summaryOf);
            const denom = nonSummary.length || 1;
            const totalProgress = nonSummary.reduce((sum, cfg) => sum + (tasks[cfg.id]?.progress || 0), 0) / denom;
            document.getElementById('overall-progress').style.width = `${totalProgress}%`;
            document.getElementById('overall-percent').textContent = `${Math.round(totalProgress)}%`;
            
            const completed = nonSummary.filter(cfg => (tasks[cfg.id]?.progress === 100)).length;
            document.getElementById('completed-count').textContent = `${completed}/${denom}`;
            
            const timeSaved = Math.min(40, Math.round(totalProgress * 0.4));
            document.getElementById('time-saved').textContent = `${timeSaved}%`;
            
            // 更新汇总卡片
            updateSummaryCards();
            
            if (completed === denom) {
                showCompletion();
            }
        }

        // 显示完成消息
        function showCompletion() {
            clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('task-count').textContent = Object.keys(tasks).length;
            document.getElementById('total-time').textContent = `${minutes}分${seconds}秒`;
            document.getElementById('saved-time').textContent = `~${Math.round(Object.keys(tasks).length * 10)}%`;
            document.getElementById('completion-message').style.display = 'block';
        }

        // 新增: 依赖与实时模式支持
        async function runTaskWithDependencies(config) {
            // 等待依赖全部完成
            if (Array.isArray(config.dependsOn) && config.dependsOn.length > 0) {
                updateTaskProgress(config.id, 0, 'WAITING_DEPS', '等待依赖完成...');
                await waitForDependencies(config.dependsOn);
            }
            // 启动延迟
            const delay = parseInt(config.startDelayMs || 0, 10);
            if (delay > 0) {
                updateTaskProgress(config.id, 0, 'DELAYED_START', `延迟启动 ${delay}ms...`);
                await sleep(delay);
            }
            // 开始模拟执行
            simulateTask(config);
        }

        async function waitForDependencies(depIds) {
            const unmet = () => depIds.filter(id => !tasks[id] || tasks[id].progress !== 100);
            return new Promise(resolve => {
                const check = () => {
                    if (unmet().length === 0) {
                        clearInterval(interval);
                        resolve();
                    }
                };
                const interval = setInterval(check, 300);
                check();
            });
        }

        function connectWebSocket() {
            if (!REALTIME_OPTS.wsUrl) return;
            try {
                const ws = new WebSocket(REALTIME_OPTS.wsUrl);
                ws.onopen = () => console.log('WebSocket connected');
                ws.onmessage = (evt) => {
                    try {
                        const data = JSON.parse(evt.data);
                        const apply = (u) => {
                            if (!u || !u.id || typeof u.progress !== 'number') return;
                            updateTaskProgress(u.id, u.progress, u.status, u.output);
                        };
                        if (Array.isArray(data)) data.forEach(apply); else apply(data);
                    } catch (e) {
                        console.error('WS message parse error', e);
                    }
                };
                ws.onclose = () => console.log('WebSocket closed');
                ws.onerror = (e) => console.error('WebSocket error', e);
            } catch (e) {
                console.error('Failed to connect WebSocket:', e);
            }
        }

        function startPolling() {
            if (!REALTIME_OPTS.pollUrl) return;
            const interval = REALTIME_OPTS.pollIntervalMs || 2000;
            const apply = (u) => {
                if (!u || !u.id || typeof u.progress !== 'number') return;
                updateTaskProgress(u.id, u.progress, u.status, u.output);
            };
            setInterval(async () => {
                try {
                    const resp = await fetch(REALTIME_OPTS.pollUrl, { cache: 'no-store' });
                    const data = await resp.json();
                    if (Array.isArray(data)) data.forEach(apply); else apply(data);
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, interval);
        }

        // 模拟任务执行
        async function simulateTask(config) {
            // 汇总卡片不参与模拟
            if (config.summaryOf && Array.isArray(config.summaryOf)) {
                updateSummaryCards();
                return;
            }

            const stages = config.stages || [
                {name: "默认阶段1", duration: 3000, progress: 50},
                {name: "默认阶段2", duration: 3000, progress: 100}
            ];

            for (const stage of stages) {
                updateTaskProgress(config.id, stage.progress - 10, stage.name.toUpperCase(), `执行中: ${stage.name}`);
                addLog(config.id, `开始阶段: ${stage.name}`);
                await sleep(stage.duration * 0.5);
                updateTaskProgress(config.id, stage.progress, stage.name.toUpperCase(), `${stage.name} 完成`);
                addLog(config.id, `完成阶段: ${stage.name}`);
                await sleep(stage.duration * 0.5);
            }

            // 阶段完成后自动设为 completed
            addLog(config.id, `全部阶段完成，更新状态为 completed`);
            try { await updateTaskStatus(config.id, 'completed'); } catch (_) {}
        }

        // 汇总卡刷新
        function updateSummaryCards() {
            const summaries = taskConfig.filter(cfg => cfg.summaryOf && Array.isArray(cfg.summaryOf));
            summaries.forEach(cfg => {
                const ids = cfg.summaryOf;
                const denom = ids.length || 1;
                const avg = ids.reduce((sum, id) => sum + (tasks[id]?.progress || 0), 0) / denom;
                tasks[cfg.id].progress = Math.round(avg);
                const allCompleted = ids.every(id => (tasks[id]?.progress === 100));
                const status = allCompleted ? '✅ COMPLETED' : 'AGGREGATED';
                document.getElementById(`progress-${cfg.id}`).style.width = `${tasks[cfg.id].progress}%`;
                document.getElementById(`progress-text-${cfg.id}`).textContent = `${tasks[cfg.id].progress}%`;
                document.getElementById(`status-${cfg.id}`).textContent = status;
                if (allCompleted) {
                    document.getElementById(`status-${cfg.id}`).classList.add('status-completed');
                }
                document.getElementById(`output-${cfg.id}`).textContent = `汇总 ${ids.length} 个任务，平均进度 ${tasks[cfg.id].progress}%`;
            });
        }

        // 记录日志
        function addLog(taskId, message) {
            const scroller = document.getElementById(`logs-${taskId}`);
            if (!scroller) return;
            const row = document.createElement('div');
            row.className = 'log-entry';
            row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            scroller.appendChild(row);
            scroller.scrollTop = scroller.scrollHeight;
        }

        // 操作：创建任务文档
        async function createTaskDoc(config) {
            const payload = {
                action: 'create_document',
                taskId: Number(config.id),
                title: `[Doc] ${config.name}`,
                projectId: 1,
                content: `# 任务文档\n\n- 任务ID: ${config.id}\n- 任务名称: ${config.name}\n- 角色: ${config.role || 'Worker'}\n- 偏好: Docker Postgres, Jenkins Docker agent, 默认指派 ai-pm\n\n## 阶段\n${(config.stages||[]).map((s,i)=>`${i+1}. ${s.name} (progress: ${s.progress}%)`).join('\n')}\n\n> 本文档由可视化监控页面生成。`
            };
            addLog(config.id, `发起创建文档 (taskId=${config.id})`);
            const result = await tryMcpPost('/mcp/create-document', payload);
            showActionResult(config.id, result);
            const serverVia = (result && result.data && result.data.via) ? result.data.via : result.via;
            if (result.ok) {
                addLog(config.id, `创建文档成功（via: ${serverVia}）`);
            } else {
                addLog(config.id, `创建文档失败（via: ${serverVia}）：${result.error || 'unknown'}`);
            }
        }

        function onCreateDocClick(taskId) {
            const cfg = taskConfig.find(t => String(t.id) === String(taskId));
            if (!cfg) return;
            createTaskDoc(cfg);
        }

        // 操作：更新任务状态
        async function updateTaskStatus(taskId, status) {
            const payload = {
                action: 'update_task',
                id: Number(taskId),
                updates: { status }
            };
            addLog(taskId, `更新状态为 ${status}`);
            const result = await tryMcpPost('/mcp/update-task', payload);
            showActionResult(taskId, result);
            const serverVia = (result && result.data && result.data.via) ? result.data.via : result.via;
            if (result.ok) {
                addLog(taskId, `状态已更新为 ${status}（via: ${serverVia}）`);
            } else {
                addLog(taskId, `状态更新失败（via: ${serverVia}）：${result.error || 'unknown'}`);
            }
        }

        function onUpdateStatusClick(taskId) {
            const sel = document.getElementById(`status-select-${taskId}`);
            if (!sel) return;
            updateTaskStatus(taskId, sel.value);
        }

        // 自动化：为每个任务创建文档并置为 in_progress
        async function autoDriveTasks() {
            const nonSummary = taskConfig.filter(t => !t.summaryOf);
            for (const cfg of nonSummary) {
                // 随机延迟，模拟并发
                const jitter = Math.floor(Math.random() * 400);
                setTimeout(async () => {
                    try { await createTaskDoc(cfg); } catch (_) {}
                }, 200 + jitter);
                setTimeout(async () => {
                    try { await updateTaskStatus(cfg.id, 'in_progress'); } catch (_) {}
                }, 400 + jitter);
            }
        }

        // MCP 调用或回退为复制 JSON
        async function tryMcpPost(path, payload) {
            const endpoint = window.MCP_ENDPOINT;
            try {
                if (endpoint) {
                    const resp = await fetch(endpoint + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json().catch(()=>({ ok:true }));
                    return { ok: true, via: 'http', data };
                }
                // 无 endpoint 时，复制 JSON
                await copyToClipboard(JSON.stringify(payload, null, 2));
                return { ok: true, via: 'clipboard', note: '已复制 JSON 到剪贴板' };
            } catch (e) {
                try { await copyToClipboard(JSON.stringify(payload, null, 2)); } catch (_) {}
                return { ok: false, via: endpoint ? 'http' : 'clipboard', error: String(e) };
            }
        }

        function showActionResult(taskId, result) {
            const el = document.getElementById(`action-${taskId}`);
            if (!el) return;
            if (result.ok) {
                el.style.color = '#C8E6C9';
                el.textContent = result.via === 'http' ? '✅ 已通过 MCP 接口完成' : '✅ 已复制 JSON 载荷，粘贴到终端执行';
            } else {
                el.style.color = '#FFCDD2';
                el.textContent = `❌ 操作失败（已回退为复制）：${result.error || ''}`;
            }
        }

        // 复制到剪贴板（回退方案）
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
            } finally {
                document.body.removeChild(ta);
            }
        }

        // 辅助函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 重置配置
        function resetConfig() {
            clearInterval(timerInterval);
            document.getElementById('configPanel').style.display = 'block';
            document.getElementById('tasksContainer').innerHTML = '';
            document.getElementById('taskConfig').value = '';
            tasks = {};
            taskConfig = [];
            startTime = null;
            document.getElementById('timer').textContent = '运行时间: 00:00:00';
            document.getElementById('completion-message').style.display = 'none';
            updateOverallProgress();
        }

        // 初始加载：支持 URL 参数 ?preset=xxx 或 ?config=xxx.json &autoStart=1 &compact=1 &mcpEndpoint=http://...
        window.onload = async function() {
            const params = new URLSearchParams(window.location.search);
            const preset = params.get('preset');
            const configUrl = params.get('config');
            const autoStart = params.get('autoStart');
            // 新增：实时参数
            const wsUrl = params.get('wsUrl');
            const pollUrl = params.get('pollUrl');
            const pollIntervalMs = parseInt(params.get('pollIntervalMs') || '2000', 10);
            REALTIME_OPTS = { wsUrl, pollUrl, pollIntervalMs };
            const compact = params.get('compact');
            const mcpEndpoint = params.get('mcpEndpoint');
            const parentTitleParam = params.get('parentTitle');
            const parentIdParam = params.get('parentId');
            const zoom = params.get('zoom');

            function setPageTitle(title) {
                const el = document.getElementById('page-title');
                if (el && title) {
                    el.textContent = `🚀 ${title}`;
                    document.title = title;
                }
            }

            if (mcpEndpoint) {
                window.MCP_ENDPOINT = mcpEndpoint;
            }

            if (compact === null || compact === '1' || compact === 'true') {
                document.body.classList.add('compact');
            }
            if (zoom) {
                document.body.style.zoom = zoom;
            }

            // 优先设置标题：URL parentTitle
            if (parentTitleParam) {
                setPageTitle(parentTitleParam);
            } else if (parentIdParam && window.MCP_ENDPOINT) {
                // 通过 MCP 桥接查询父任务标题
                try {
                    const resp = await fetch(`${window.MCP_ENDPOINT}/mcp/find-task`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: Number(parentIdParam) })
                    });
                    const resJson = await resp.json();
                    const title = resJson?.data?.tasks?.[0]?.title || resJson?.data?.task?.title;
                    if (title) setPageTitle(title);
                } catch (e) {
                    console.warn('获取父任务标题失败:', e);
                }
            }

            // 优先使用 preset 作为默认回落
            if (preset && PRESETS[preset]) {
                document.getElementById('taskConfig').value = JSON.stringify(PRESETS[preset], null, 2);
            } else {
                // 默认示例
                loadPreset('backend');
            }

            // 通过 URL ?config= 指定外部 JSON 配置
            if (configUrl) {
                try {
                    const resp = await fetch(configUrl, { cache: 'no-store' });
                    const data = await resp.json();
                    document.getElementById('taskConfig').value = JSON.stringify(data, null, 2);
                } catch (e) {
                    console.error('加载配置失败:', e);
                }
            }

            // 自动开始
            if (autoStart === '1' || autoStart === 'true') {
                startMonitoring();
            }
        };

    </script>
</body>
</html>
