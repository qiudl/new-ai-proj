# version: '3.8'  # Version is now optional in newer Docker Compose

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: main_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-test_user} -d ${POSTGRES_DB:-main_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Go Backend API
  backend:
    image: golang:1.24-alpine
    container_name: go_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env.docker
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: main_db
      DB_SOURCE: postgresql://test_user:test_password@db:5432/main_db?sslmode=disable
    volumes:
      - ./backend:/app:delegated
      - go_mod_cache:/go/pkg/mod
      - ./backend/docs:/app/docs:rw
    working_dir: /app
    command: sh -c "go mod download && go run main.go"
    ports:
      - "8081:8080"  # 映射到8081端口避免与本地Go后端(8080)冲突
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # React Frontend - 测试环境配置
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development

    container_name: react_frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8081/api/v1
      - REACT_APP_API_BASE_URL=http://localhost:8081/api/v1
      - REACT_APP_ENV=staging
      - REACT_APP_ENVIRONMENT=staging
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=3000
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=3001
      - WDS_SOCKET_PATH=/ws
      - GENERATE_SOURCEMAP=false
      - TSC_COMPILE_ON_ERROR=true
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Jenkins (Dockerized)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    ports:
      - "8181:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped


volumes:
  postgres_data:
  go_mod_cache:
  frontend_node_modules:
  jenkins_home:

