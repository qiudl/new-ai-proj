<!DOCTYPE html>
<html>
<head>
    <title>测试任务编辑</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h2>测试任务编辑功能</h2>
    <div id="result"></div>
    
    <script>
        async function testTaskEdit() {
            const resultDiv = document.getElementById('result');
            
            try {
                // 1. 首先登录获取token
                console.log('1. 登录...');
                const loginResponse = await axios.post('/api/v1/auth/login', {
                    username: 'admin',
                    password: 'password123'
                });
                
                console.log('登录响应:', loginResponse.data);
                const token = loginResponse.data.data.token;
                
                if (!token) {
                    throw new Error('登录失败，无法获取token');
                }
                
                // 2. 设置axios的默认headers
                axios.defaults.headers.common['Authorization'] = `Bearer ${token}`;
                
                // 3. 获取任务64的详情
                console.log('2. 获取任务详情...');
                const taskResponse = await axios.get('/api/v1/projects/1/tasks/64');
                console.log('任务详情:', taskResponse.data);
                
                // 4. 更新任务
                console.log('3. 更新任务...');
                const updateData = {
                    title: '前端测试任务编辑 - ' + new Date().toLocaleTimeString(),
                    description: '这是通过前端测试脚本更新的任务',
                    status: 'in_progress'
                };
                
                console.log('更新数据:', updateData);
                
                const updateResponse = await axios.put('/api/v1/projects/1/tasks/64', updateData);
                console.log('更新响应:', updateResponse.data);
                
                resultDiv.innerHTML = `
                    <h3>✅ 测试成功</h3>
                    <p><strong>任务更新成功:</strong></p>
                    <pre>${JSON.stringify(updateResponse.data, null, 2)}</pre>
                `;
                
            } catch (error) {
                console.error('测试失败:', error);
                resultDiv.innerHTML = `
                    <h3>❌ 测试失败</h3>
                    <p><strong>错误信息:</strong> ${error.message}</p>
                    <p><strong>响应状态:</strong> ${error.response?.status}</p>
                    <p><strong>响应数据:</strong></p>
                    <pre>${JSON.stringify(error.response?.data, null, 2)}</pre>
                `;
            }
        }
        
        // 页面加载后自动执行测试
        window.onload = testTaskEdit;
    </script>
</body>
</html>
