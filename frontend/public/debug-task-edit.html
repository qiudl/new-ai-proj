<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务编辑调试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background-color: #1890ff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background-color: #40a9ff;
        }
        button:disabled {
            background-color: #f5f5f5;
            color: #bfbfbf;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 4px;
        }
        .success {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .info {
            background-color: #f0f9ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        .logs {
            background-color: #fafafa;
            border: 1px solid #d9d9d9;
            padding: 12px;
            border-radius: 4px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .step {
            margin: 10px 0;
            padding: 8px;
            background-color: #f8f9fa;
            border-left: 3px solid #1890ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 任务编辑调试工具</h1>
        <p>这个页面用于调试任务编辑保存失败的问题</p>
        
        <div class="step">
            <h3>步骤 1: 登录获取Token</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" value="admin" />
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" value="password123" />
            </div>
            <button onclick="login()">登录</button>
        </div>

        <div class="step">
            <h3>步骤 2: 选择任务进行编辑</h3>
            <div class="form-group">
                <label>项目ID</label>
                <input type="number" id="projectId" value="1" />
            </div>
            <div class="form-group">
                <label>任务ID</label>
                <input type="number" id="taskId" value="64" />
            </div>
            <button onclick="loadTask()" disabled id="loadTaskBtn">加载任务</button>
        </div>

        <div class="step">
            <h3>步骤 3: 编辑任务信息</h3>
            <div class="form-group">
                <label>任务标题</label>
                <input type="text" id="taskTitle" />
            </div>
            <div class="form-group">
                <label>任务描述</label>
                <textarea id="taskDescription" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>任务状态</label>
                <select id="taskStatus">
                    <option value="todo">待办</option>
                    <option value="in_progress">进行中</option>
                    <option value="completed">已完成</option>
                    <option value="cancelled">已取消</option>
                </select>
            </div>
            <button onclick="saveTask()" disabled id="saveTaskBtn">保存任务</button>
        </div>

        <div class="step">
            <h3>调试日志</h3>
            <div class="logs" id="logs"></div>
            <button onclick="clearLogs()">清空日志</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        let token = null;
        let currentTask = null;

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logElement = document.getElementById('logs');
            const logEntry = `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            logElement.textContent += logEntry;
            logElement.scrollTop = logElement.scrollHeight;
            
            console.log(`[TaskEditDebug] ${message}`);
        }

        function clearLogs() {
            document.getElementById('logs').textContent = '';
        }

        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            log(`尝试登录用户: ${username}`);
            
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                log(`登录响应: ${JSON.stringify(data)}`);
                
                if (data.success && data.data.token) {
                    token = data.data.token;
                    log('登录成功，已获取token');
                    document.getElementById('loadTaskBtn').disabled = false;
                    showResult('✅ 登录成功', 'success');
                } else {
                    throw new Error(data.error?.message || '登录失败');
                }
            } catch (error) {
                log(`登录失败: ${error.message}`, 'error');
                showResult(`❌ 登录失败: ${error.message}`, 'error');
            }
        }

        async function loadTask() {
            if (!token) {
                showResult('请先登录', 'error');
                return;
            }
            
            const projectId = document.getElementById('projectId').value;
            const taskId = document.getElementById('taskId').value;
            
            log(`加载任务: 项目${projectId}, 任务${taskId}`);
            
            try {
                const response = await fetch(`/api/v1/projects/${projectId}/tasks/${taskId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                log(`任务加载响应: ${JSON.stringify(data)}`);
                
                if (data.success && data.data) {
                    currentTask = data.data;
                    
                    // 填充表单
                    document.getElementById('taskTitle').value = currentTask.title || '';
                    document.getElementById('taskDescription').value = currentTask.description || '';
                    document.getElementById('taskStatus').value = currentTask.status || 'todo';
                    
                    document.getElementById('saveTaskBtn').disabled = false;
                    
                    log('任务加载成功，表单已填充');
                    showResult('✅ 任务加载成功', 'success');
                } else {
                    throw new Error(data.error?.message || '任务加载失败');
                }
            } catch (error) {
                log(`任务加载失败: ${error.message}`, 'error');
                showResult(`❌ 任务加载失败: ${error.message}`, 'error');
            }
        }

        async function saveTask() {
            if (!token || !currentTask) {
                showResult('请先登录并加载任务', 'error');
                return;
            }
            
            const projectId = document.getElementById('projectId').value;
            const taskId = document.getElementById('taskId').value;
            
            const updateData = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDescription').value,
                status: document.getElementById('taskStatus').value
            };
            
            log(`保存任务数据: ${JSON.stringify(updateData)}`);
            
            try {
                // 模拟前端TaskService的调用
                log('🌐 发送PUT请求到后端...');
                
                const response = await fetch(`/api/v1/projects/${projectId}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                log(`HTTP响应状态: ${response.status}`);
                log(`HTTP响应头: ${JSON.stringify(Object.fromEntries(response.headers.entries()))}`);
                
                const responseText = await response.text();
                log(`HTTP响应原始内容: ${responseText}`);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    throw new Error(`响应解析失败: ${parseError.message}, 原始响应: ${responseText}`);
                }
                
                log(`解析后的响应数据: ${JSON.stringify(data)}`);
                
                if (data.success) {
                    currentTask = data.data;
                    log('✅ 任务保存成功');
                    showResult('✅ 任务保存成功！', 'success');
                    
                    // 重新加载任务以验证保存结果
                    setTimeout(loadTask, 1000);
                } else {
                    throw new Error(data.error?.message || '保存失败');
                }
            } catch (error) {
                log(`任务保存失败: ${error.message}`, 'error');
                showResult(`❌ 任务保存失败: ${error.message}`, 'error');
            }
        }

        // 页面加载完成后的初始化
        window.onload = function() {
            log('调试页面已加载');
            showResult('请先登录以开始调试', 'info');
        };
    </script>
</body>
</html>
