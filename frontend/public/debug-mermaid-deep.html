<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid深度调试工具</title>
    <style>
        body { 
            font-family: monospace; 
            padding: 20px; 
            background: #1e1e1e; 
            color: #d4d4d4; 
        }
        .debug-section { 
            margin: 20px 0; 
            padding: 15px; 
            border: 1px solid #404040; 
            border-radius: 5px; 
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .info { color: #2196F3; }
        pre { 
            background: #2d2d2d; 
            padding: 10px; 
            border-radius: 3px; 
            overflow-x: auto; 
        }
        .test-diagram {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #005a9e; }
    </style>
</head>
<body>
    <h1>🔍 Mermaid深度调试工具</h1>
    
    <div class="debug-section">
        <h2>🧪 环境检测</h2>
        <div id="environment-check">正在检测...</div>
    </div>

    <div class="debug-section">
        <h2>📚 Mermaid库状态</h2>
        <div id="mermaid-status">正在检测...</div>
        <button onclick="recheckMermaid()">重新检测Mermaid</button>
        <button onclick="reinitializeMermaid()">重新初始化Mermaid</button>
    </div>

    <div class="debug-section">
        <h2>🎨 渲染测试</h2>
        <button onclick="testSimpleRender()">测试简单渲染</button>
        <button onclick="testComplexRender()">测试复杂渲染</button>
        <button onclick="clearResults()">清空结果</button>
        <div id="render-results"></div>
    </div>

    <div class="debug-section">
        <h2>📊 测试图表</h2>
        <h3>简单流程图：</h3>
        <div class="test-diagram" id="simple-test"></div>
        
        <h3>复杂流程图：</h3>
        <div class="test-diagram" id="complex-test"></div>
    </div>

    <div class="debug-section">
        <h2>🔧 系统模拟测试</h2>
        <p>模拟React.StrictMode双重执行：</p>
        <button onclick="simulateStrictMode()">模拟StrictMode</button>
        <div id="strictmode-results"></div>
    </div>

    <script src="https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js"></script>
    <script>
        let debugLog = [];
        let renderingState = {
            isRendering: false,
            timeout: null
        };

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = `[${timestamp}] ${message}`;
            debugLog.push(entry);
            
            console.log(`%c${entry}`, 
                type === 'error' ? 'color: #f44336' :
                type === 'success' ? 'color: #4CAF50' :
                type === 'warning' ? 'color: #ff9800' : 
                'color: #2196F3'
            );
        }

        // 环境检测
        function checkEnvironment() {
            const envDiv = document.getElementById('environment-check');
            let html = '<pre>';
            
            html += `User Agent: ${navigator.userAgent}\n`;
            html += `Current URL: ${window.location.href}\n`;
            html += `StrictMode模拟: 支持\n`;
            html += `CDN连接: ${navigator.onLine ? '在线' : '离线'}\n`;
            
            html += '</pre>';
            envDiv.innerHTML = html;
            log('环境检测完成');
        }

        // Mermaid状态检测
        function checkMermaidStatus() {
            const statusDiv = document.getElementById('mermaid-status');
            let html = '<pre>';
            
            try {
                if (typeof window.mermaid === 'undefined') {
                    html += '<span class="error">❌ Mermaid库未加载</span>\n';
                    log('Mermaid库未加载', 'error');
                } else {
                    html += '<span class="success">✅ Mermaid库已加载</span>\n';
                    html += `版本: ${window.mermaid.version || '未知'}\n`;
                    
                    // 检查关键方法
                    const methods = ['initialize', 'render', 'parse'];
                    methods.forEach(method => {
                        if (typeof window.mermaid[method] === 'function') {
                            html += `<span class="success">✅ ${method}方法可用</span>\n`;
                        } else {
                            html += `<span class="error">❌ ${method}方法不可用</span>\n`;
                        }
                    });
                    
                    log('Mermaid库检测完成', 'success');
                }
            } catch (error) {
                html += `<span class="error">❌ 检测出错: ${error.message}</span>\n`;
                log(`Mermaid检测出错: ${error.message}`, 'error');
            }
            
            html += '</pre>';
            statusDiv.innerHTML = html;
        }

        // 重新检测Mermaid
        function recheckMermaid() {
            checkMermaidStatus();
        }

        // 重新初始化Mermaid
        async function reinitializeMermaid() {
            log('开始重新初始化Mermaid');
            try {
                if (window.mermaid) {
                    await window.mermaid.initialize({
                        startOnLoad: false,
                        theme: 'default',
                        securityLevel: 'loose',
                        htmlLabels: true
                    });
                    log('Mermaid重新初始化成功', 'success');
                    checkMermaidStatus();
                } else {
                    log('Mermaid库不可用，无法初始化', 'error');
                }
            } catch (error) {
                log(`Mermaid初始化失败: ${error.message}`, 'error');
            }
        }

        // 模拟React.StrictMode行为
        function simulateStrictMode() {
            const resultsDiv = document.getElementById('strictmode-results');
            let html = '<pre>';
            
            log('🔄 开始模拟React.StrictMode双重执行');
            
            // 第一次执行
            log('第一次执行: 设置renderingState.isRendering = true');
            renderingState.isRendering = true;
            html += '第一次执行: renderingState.isRendering = true\n';
            
            // 模拟延迟
            setTimeout(() => {
                // 第二次执行 - 模拟StrictMode
                log('🔄 第二次执行开始（模拟StrictMode）');
                html += '第二次执行开始（模拟StrictMode）\n';
                
                if (renderingState.isRendering) {
                    log('⚠️ 检测到renderingState.isRendering为true，这会导致退出');
                    html += '⚠️ 检测到renderingState.isRendering为true\n';
                    html += '❌ 在真实系统中，这里会执行return，导致永远不渲染\n';
                    
                    // 应用我们的修复
                    log('✅ 应用修复：重置渲染状态');
                    renderingState.isRendering = false;
                    if (renderingState.timeout) {
                        clearTimeout(renderingState.timeout);
                        renderingState.timeout = null;
                    }
                    html += '✅ 修复应用：重置renderingState，清理定时器\n';
                    html += '✅ 现在可以正常继续渲染流程\n';
                } else {
                    html += '✅ renderingState为false，可以正常执行\n';
                }
                
                html += '</pre>';
                resultsDiv.innerHTML = html;
                log('StrictMode模拟测试完成', 'success');
            }, 100);
        }

        // 简单渲染测试
        async function testSimpleRender() {
            const resultsDiv = document.getElementById('render-results');
            log('开始简单渲染测试');
            
            try {
                const diagram = 'graph TD; A-->B; B-->C;';
                const result = await window.mermaid.render('simple-test-id', diagram);
                
                document.getElementById('simple-test').innerHTML = result.svg;
                resultsDiv.innerHTML += '<p class="success">✅ 简单渲染测试成功</p>';
                log('简单渲染测试成功', 'success');
            } catch (error) {
                resultsDiv.innerHTML += `<p class="error">❌ 简单渲染测试失败: ${error.message}</p>`;
                log(`简单渲染测试失败: ${error.message}`, 'error');
            }
        }

        // 复杂渲染测试
        async function testComplexRender() {
            const resultsDiv = document.getElementById('render-results');
            log('开始复杂渲染测试');
            
            try {
                const diagram = `
                    flowchart TD
                        A[开始] --> B{判断条件}
                        B -->|是| C[执行操作1]
                        B -->|否| D[执行操作2]
                        C --> E[结束]
                        D --> E
                        style A fill:#f9f,stroke:#333,stroke-width:2px
                        style E fill:#bbf,stroke:#333,stroke-width:2px
                `;
                
                const result = await window.mermaid.render('complex-test-id', diagram);
                
                document.getElementById('complex-test').innerHTML = result.svg;
                resultsDiv.innerHTML += '<p class="success">✅ 复杂渲染测试成功</p>';
                log('复杂渲染测试成功', 'success');
            } catch (error) {
                resultsDiv.innerHTML += `<p class="error">❌ 复杂渲染测试失败: ${error.message}</p>`;
                log(`复杂渲染测试失败: ${error.message}`, 'error');
            }
        }

        // 清空结果
        function clearResults() {
            document.getElementById('render-results').innerHTML = '';
            document.getElementById('simple-test').innerHTML = '';
            document.getElementById('complex-test').innerHTML = '';
            log('测试结果已清空');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', async function() {
            log('🚀 Mermaid深度调试工具启动');
            
            checkEnvironment();
            
            // 等待Mermaid库加载
            if (window.mermaid) {
                log('Mermaid库已可用，开始初始化');
                await reinitializeMermaid();
            } else {
                log('等待Mermaid库加载...', 'warning');
                setTimeout(checkMermaidStatus, 1000);
            }
        });

        // 全局错误监听
        window.addEventListener('error', function(event) {
            log(`全局错误: ${event.message}`, 'error');
        });

        // 未处理的Promise拒绝监听
        window.addEventListener('unhandledrejection', function(event) {
            log(`未处理的Promise拒绝: ${event.reason}`, 'error');
        });
    </script>
</body>
</html>
