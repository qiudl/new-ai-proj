<!DOCTYPE html>
<html>
<head>
    <title>前端API配置调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .config { background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        .test-result { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>前端API配置调试</h1>
    
    <h2>环境变量检查</h2>
    <div id="envConfig"></div>
    
    <h2>当前Token状态</h2>
    <div id="tokenStatus"></div>
    
    <h2>API测试</h2>
    <button onclick="testUserAPI()">测试用户API</button>
    <button onclick="testProjectAPI()">测试项目API</button>
    <button onclick="testTaskAPI()">测试任务API</button>
    <button onclick="setTestToken()">设置测试Token</button>
    
    <div id="testResults"></div>

    <script>
        // 检查环境变量和配置
        function checkEnvConfig() {
            const config = {
                'REACT_APP_API_URL': process.env.REACT_APP_API_URL || '未设置',
                'REACT_APP_API_BASE_URL': process.env.REACT_APP_API_BASE_URL || '未设置',
                'NODE_ENV': process.env.NODE_ENV || '未设置',
                'REACT_APP_ENV': process.env.REACT_APP_ENV || '未设置'
            };
            
            // 检查当前页面位置
            const currentURL = window.location.href;
            const baseURL = window.location.origin;
            
            let html = '<div class="config"><strong>当前页面信息:</strong><br/>';
            html += `当前URL: ${currentURL}<br/>`;
            html += `Base URL: ${baseURL}<br/>`;
            html += '</div>';
            
            html += '<div class="config"><strong>环境变量:</strong><br/>';
            for (const [key, value] of Object.entries(config)) {
                html += `${key}: ${value}<br/>`;
            }
            html += '</div>';
            
            // 推断实际API URL
            const apiURL = process.env.REACT_APP_API_URL || 
                           (baseURL.includes('localhost:3000') ? 'http://localhost:8080/api/v1' : '/api/v1');
            
            html += `<div class="config"><strong>推断的API URL:</strong><br/>${apiURL}</div>`;
            
            document.getElementById('envConfig').innerHTML = html;
            return apiURL;
        }
        
        // 检查token状态
        function checkTokenStatus() {
            const token = localStorage.getItem('token');
            const statusDiv = document.getElementById('tokenStatus');
            
            if (token) {
                statusDiv.innerHTML = `
                    <div class="success">✅ Token已存在</div>
                    <div class="config">Token: ${token.substring(0, 50)}...</div>
                `;
            } else {
                statusDiv.innerHTML = '<div class="error">❌ 没有Token</div>';
            }
        }
        
        // 设置测试token
        function setTestToken() {
            const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwidXNlcl90eXBlIjoiYWRtaW4iLCJleHAiOjE3NTM2Mzc3NDAsImlhdCI6MTc1MzYzNDE0MCwibmJmIjoxNzUzNjM0MTQwLCJzdWIiOiJhZG1pbiJ9.qsqAth_OZSQxWW7Vseu5RUK8YJU-6LF-Iv0NdzdUo3o';
            localStorage.setItem('token', token);
            alert('测试Token已设置');
            checkTokenStatus();
        }
        
        // 通用API测试函数
        async function testAPICall(endpoint, description, method = 'GET', body = null) {
            const apiURL = checkEnvConfig().replace('/api/v1', '');
            const token = localStorage.getItem('token');
            
            if (!token) {
                return {
                    description,
                    status: 'ERROR',
                    error: '没有Token，请先设置Token'
                };
            }
            
            try {
                const url = `${apiURL}/api/v1${endpoint}`;
                console.log(`测试API: ${method} ${url}`);
                
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                };
                
                if (body) {
                    options.body = JSON.stringify(body);
                }
                
                const response = await fetch(url, options);
                const data = await response.json();
                
                return {
                    description,
                    url,
                    status: response.status,
                    success: response.ok,
                    data: JSON.stringify(data, null, 2)
                };
            } catch (error) {
                return {
                    description,
                    status: 'ERROR',
                    error: error.message
                };
            }
        }
        
        // 测试用户API
        async function testUserAPI() {
            const result = await testAPICall('/users/profile', '用户API');
            displayResult(result);
        }
        
        // 测试项目API
        async function testProjectAPI() {
            const result = await testAPICall('/projects/39', '项目API');
            displayResult(result);
        }
        
        // 测试任务API
        async function testTaskAPI() {
            const result = await testAPICall('/projects/39/tasks/46', '任务更新API', 'PUT', {
                title: '前端测试任务',
                description: '从前端调试页面发起的测试'
            });
            displayResult(result);
        }
        
        // 显示测试结果
        function displayResult(result) {
            const resultsDiv = document.getElementById('testResults');
            const status = result.success ? '✅' : '❌';
            
            const html = `
                <div class="test-result">
                    <strong>${status} ${result.description}</strong><br/>
                    ${result.url ? `URL: ${result.url}<br/>` : ''}
                    状态: ${result.status}<br/>
                    ${result.error ? `错误: ${result.error}<br/>` : ''}
                    ${result.data ? `<details><summary>响应数据</summary><pre>${result.data}</pre></details>` : ''}
                </div>
            `;
            
            resultsDiv.innerHTML = html + resultsDiv.innerHTML;
        }
        
        // 页面加载时检查
        checkEnvConfig();
        checkTokenStatus();
    </script>
</body>
</html>
