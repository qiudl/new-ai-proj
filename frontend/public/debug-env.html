<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境变量调试页面</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f5f5f5; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
        }
        .env-item { 
            margin: 10px 0; 
            padding: 10px; 
            background: #f8f9fa; 
            border-left: 4px solid #007bff; 
            border-radius: 4px;
        }
        .value { 
            font-weight: bold; 
            color: #dc3545; 
        }
        .undefined { 
            color: #6c757d; 
            font-style: italic; 
        }
        .logic { 
            background: #e9ecef; 
            padding: 15px; 
            border-radius: 5px; 
            margin: 10px 0;
        }
        .result { 
            font-size: 18px; 
            font-weight: bold; 
            padding: 15px; 
            border-radius: 5px; 
            text-align: center;
        }
        .dev-env { background: #d4edda; border: 2px solid #28a745; }
        .test-env { background: #cce5f0; border: 2px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 React环境变量调试</h1>
        <p>此页面将显示React应用中实际的环境变量值</p>
        <hr>

        <div class="env-item">
            <strong>REACT_APP_ENV:</strong> 
            <span class="value" id="env-1">检测中...</span>
        </div>

        <div class="env-item">
            <strong>REACT_APP_ENVIRONMENT:</strong> 
            <span class="value" id="env-2">检测中...</span>
        </div>

        <div class="env-item">
            <strong>REACT_APP_LOCAL_DEV:</strong> 
            <span class="value" id="env-3">检测中...</span>
        </div>

        <div class="env-item">
            <strong>NODE_ENV:</strong> 
            <span class="value" id="env-4">检测中...</span>
        </div>

        <div class="logic">
            <h3>🧮 Layout.tsx 逻辑分析</h3>
            <div id="logic-analysis">分析中...</div>
        </div>

        <div id="result" class="result">
            计算结果中...
        </div>

        <div class="logic">
            <h3>📋 所有process.env变量</h3>
            <div id="all-env">扫描中...</div>
        </div>
    </div>

    <script>
        // 注意：这个页面是静态HTML，无法直接访问React的process.env
        // 我们需要通过其他方式获取信息
        
        function updateEnvDisplay() {
            // 由于这是静态页面，无法直接访问React的process.env
            // 显示说明信息
            document.getElementById('env-1').innerHTML = '❌ 无法直接访问 (需要React应用)';
            document.getElementById('env-2').innerHTML = '❌ 无法直接访问 (需要React应用)';
            document.getElementById('env-3').innerHTML = '❌ 无法直接访问 (需要React应用)';
            document.getElementById('env-4').innerHTML = '❌ 无法直接访问 (需要React应用)';
            
            document.getElementById('logic-analysis').innerHTML = `
                <p><strong>说明：</strong>此静态页面无法直接访问React应用的环境变量。</p>
                <p><strong>需要：</strong>在React组件中添加调试代码来输出环境变量值。</p>
            `;
            
            document.getElementById('result').innerHTML = '需要在React应用中调试';
            document.getElementById('result').className = 'result dev-env';
            
            document.getElementById('all-env').innerHTML = '此页面无法访问React的process.env对象';
        }

        updateEnvDisplay();
        
        // 提供JavaScript接口供父页面调用
        window.debugEnvInfo = function(envVars) {
            if (envVars) {
                document.getElementById('env-1').innerHTML = envVars.REACT_APP_ENV || '<span class="undefined">undefined</span>';
                document.getElementById('env-2').innerHTML = envVars.REACT_APP_ENVIRONMENT || '<span class="undefined">undefined</span>';
                document.getElementById('env-3').innerHTML = envVars.REACT_APP_LOCAL_DEV || '<span class="undefined">undefined</span>';
                document.getElementById('env-4').innerHTML = envVars.NODE_ENV || '<span class="undefined">undefined</span>';
                
                // 分析逻辑
                const env1 = envVars.REACT_APP_ENV;
                const env2 = envVars.REACT_APP_ENVIRONMENT;
                const localDev = envVars.REACT_APP_LOCAL_DEV;
                
                let analysis = '';
                let result = '';
                let resultClass = '';
                
                // 条件1: LOCAL_DEV === 'true'
                if (localDev === 'true') {
                    analysis += '<p>✅ <strong>条件1匹配:</strong> REACT_APP_LOCAL_DEV === "true" → 显示"开发环境"</p>';
                    result = '🟢 开发环境';
                    resultClass = 'result dev-env';
                } 
                // 条件2: ENV === 'development' && ENVIRONMENT === 'development' && LOCAL_DEV !== 'true'
                else if (env1 === 'development' && env2 === 'development' && localDev !== 'true') {
                    analysis += '<p>✅ <strong>条件2匹配:</strong> REACT_APP_ENV === "development" && REACT_APP_ENVIRONMENT === "development" && REACT_APP_LOCAL_DEV !== "true" → 显示"测试版本"</p>';
                    result = '🔵 测试版本';
                    resultClass = 'result test-env';
                } else {
                    analysis += '<p>❌ <strong>无条件匹配</strong></p>';
                    analysis += '<p>检查:</p>';
                    analysis += '<ul>';
                    analysis += '<li>条件1: REACT_APP_LOCAL_DEV === "true" → ' + (localDev === 'true' ? '✅' : '❌') + ' (' + localDev + ')</li>';
                    analysis += '<li>条件2a: REACT_APP_ENV === "development" → ' + (env1 === 'development' ? '✅' : '❌') + ' (' + env1 + ')</li>';
                    analysis += '<li>条件2b: REACT_APP_ENVIRONMENT === "development" → ' + (env2 === 'development' ? '✅' : '❌') + ' (' + env2 + ')</li>';
                    analysis += '<li>条件2c: REACT_APP_LOCAL_DEV !== "true" → ' + (localDev !== 'true' ? '✅' : '❌') + ' (' + localDev + ')</li>';
                    analysis += '</ul>';
                    result = '❌ 无标志显示';
                    resultClass = 'result';
                }
                
                document.getElementById('logic-analysis').innerHTML = analysis;
                document.getElementById('result').innerHTML = result;
                document.getElementById('result').className = resultClass;
                
                // 显示所有环境变量
                let allEnvHtml = '<pre>';
                for (let key in envVars) {
                    if (key.startsWith('REACT_APP_') || key === 'NODE_ENV') {
                        allEnvHtml += key + ': ' + (envVars[key] || 'undefined') + '\n';
                    }
                }
                allEnvHtml += '</pre>';
                document.getElementById('all-env').innerHTML = allEnvHtml;
            }
        };
    </script>
</body>
</html>
