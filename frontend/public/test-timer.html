<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时器功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { border: 1px solid #ddd; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .status { font-weight: bold; margin: 10px 0; }
        .log { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 定时器功能测试页面</h1>
        
        <div class="test-section">
            <h2>1. 认证状态检查</h2>
            <div class="status" id="authStatus">检查中...</div>
            <button onclick="checkAuth()">检查认证</button>
            <button onclick="login()">登录</button>
            <div id="authLog" class="log"></div>
        </div>

        <div class="test-section">
            <h2>2. API连接测试</h2>
            <div class="status" id="apiStatus">未测试</div>
            <button onclick="testAPI()">测试API连接</button>
            <div id="apiLog" class="log"></div>
        </div>

        <div class="test-section">
            <h2>3. 定时器功能测试</h2>
            <div class="status" id="timerStatus">未测试</div>
            <button onclick="testTimer()">测试定时器</button>
            <button onclick="getCurrentTimer()">获取当前状态</button>
            <button onclick="startMonitoring()">开始监控</button>
            <button onclick="stopMonitoring()">停止监控</button>
            <div id="timerLog" class="log"></div>
        </div>

        <div class="test-section">
            <h2>4. 前端组件检查</h2>
            <div class="status" id="componentStatus">未检查</div>
            <button onclick="checkComponents()">检查组件</button>
            <div id="componentLog" class="log"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        let authToken = localStorage.getItem('token');
        let monitoringInterval = null;
        
        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const colorClass = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            element.innerHTML += `[${timestamp}] <span class="${colorClass}">${message}</span>\n`;
        }

        function updateStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const colorClass = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            element.innerHTML = `<span class="${colorClass}">${message}</span>`;
        }

        // 检查认证状态
        function checkAuth() {
            const token = localStorage.getItem('token');
            if (token) {
                updateStatus('authStatus', '✅ 已找到认证token', 'success');
                log('authLog', `找到token: ${token.substring(0, 50)}...`, 'success');
            } else {
                updateStatus('authStatus', '❌ 未找到认证token', 'error');
                log('authLog', '本地存储中没有token，需要先登录', 'warning');
            }
        }

        // 登录
        async function login() {
            try {
                log('authLog', '正在尝试登录...', 'info');
                
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'password123' })
                });

                const data = await response.json();
                log('authLog', `登录响应: ${JSON.stringify(data, null, 2)}`, 'info');

                if (data.success && data.data && data.data.token) {
                    authToken = data.data.token;
                    localStorage.setItem('token', authToken);
                    updateStatus('authStatus', '✅ 登录成功', 'success');
                    log('authLog', '登录成功，token已保存', 'success');
                } else {
                    updateStatus('authStatus', '❌ 登录失败', 'error');
                    log('authLog', '登录失败：响应格式异常', 'error');
                }
            } catch (error) {
                updateStatus('authStatus', '❌ 登录错误', 'error');
                log('authLog', `登录错误: ${error.message}`, 'error');
            }
        }

        // 测试API连接
        async function testAPI() {
            if (!authToken) {
                updateStatus('apiStatus', '❌ 需要先登录', 'error');
                log('apiLog', '请先登录获取token', 'warning');
                return;
            }

            try {
                log('apiLog', '测试任务列表API...', 'info');
                
                const response = await fetch(`${API_BASE}/tasks?limit=3`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                log('apiLog', `API响应状态: ${response.status}`, 'info');
                
                if (response.ok && data.success) {
                    updateStatus('apiStatus', '✅ API连接正常', 'success');
                    log('apiLog', `成功获取 ${data.data.data.length} 个任务`, 'success');
                    log('apiLog', `任务示例: ${JSON.stringify(data.data.data[0], null, 2)}`, 'info');
                } else {
                    updateStatus('apiStatus', '❌ API响应异常', 'error');
                    log('apiLog', `API错误: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                updateStatus('apiStatus', '❌ API连接失败', 'error');
                log('apiLog', `API连接错误: ${error.message}`, 'error');
            }
        }

        // 获取当前定时器状态
        async function getCurrentTimer() {
            if (!authToken) {
                log('timerLog', '请先登录获取token', 'warning');
                return;
            }

            try {
                log('timerLog', '获取当前定时器状态...', 'info');
                
                const response = await fetch(`${API_BASE}/timer/current`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                const data = await response.json();
                
                if (response.ok) {
                    log('timerLog', `定时器状态: ${JSON.stringify(data, null, 2)}`, 'info');
                    if (data.is_running) {
                        updateStatus('timerStatus', `✅ 定时器运行中: ${data.formatted_time}`, 'success');
                    } else {
                        updateStatus('timerStatus', '⏹️ 定时器未运行', 'info');
                    }
                } else {
                    log('timerLog', `获取状态失败: ${JSON.stringify(data, null, 2)}`, 'error');
                }
            } catch (error) {
                log('timerLog', `获取状态错误: ${error.message}`, 'error');
            }
        }

        // 测试定时器功能
        async function testTimer() {
            if (!authToken) {
                updateStatus('timerStatus', '❌ 需要先登录', 'error');
                log('timerLog', '请先登录获取token', 'warning');
                return;
            }

            try {
                // 先获取任务列表
                log('timerLog', '1. 获取任务列表...', 'info');
                const tasksResponse = await fetch(`${API_BASE}/tasks?limit=5`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const tasksData = await tasksResponse.json();
                
                if (!tasksData.success || !tasksData.data.data.length) {
                    updateStatus('timerStatus', '❌ 无可用任务', 'error');
                    log('timerLog', '没有找到可用的任务', 'error');
                    return;
                }

                const firstTask = tasksData.data.data[0];
                log('timerLog', `选择任务: ${firstTask.title} (ID: ${firstTask.id})`, 'info');

                // 启动定时器
                log('timerLog', '2. 启动定时器...', 'info');
                const startResponse = await fetch(`${API_BASE}/timer/start`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ task_id: firstTask.id })
                });

                const startData = await startResponse.json();
                log('timerLog', `启动响应: ${JSON.stringify(startData, null, 2)}`, 'info');

                if (startResponse.ok && startData.status === 'running') {
                    updateStatus('timerStatus', '✅ 定时器启动成功', 'success');
                    log('timerLog', '定时器已启动，等待2秒后检查状态...', 'success');

                    // 等待2秒后检查状态
                    setTimeout(async () => {
                        await getCurrentTimer();
                        
                        // 再等待1秒后停止
                        setTimeout(async () => {
                            log('timerLog', '3. 停止定时器...', 'info');
                            const stopResponse = await fetch(`${API_BASE}/timer/stop`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${authToken}` }
                            });
                            const stopData = await stopResponse.json();
                            log('timerLog', `停止响应: ${JSON.stringify(stopData, null, 2)}`, 'info');
                            
                            if (stopResponse.ok) {
                                updateStatus('timerStatus', '✅ 定时器测试完成', 'success');
                                log('timerLog', '定时器功能测试完成！', 'success');
                            }
                        }, 1000);
                    }, 2000);
                } else {
                    updateStatus('timerStatus', '❌ 定时器启动失败', 'error');
                    log('timerLog', '定时器启动失败', 'error');
                }
            } catch (error) {
                updateStatus('timerStatus', '❌ 定时器测试错误', 'error');
                log('timerLog', `定时器测试错误: ${error.message}`, 'error');
            }
        }

        // 开始定时器状态监控
        function startMonitoring() {
            if (monitoringInterval) {
                log('timerLog', '监控已在运行中', 'warning');
                return;
            }

            if (!authToken) {
                log('timerLog', '请先登录获取token', 'warning');
                return;
            }

            log('timerLog', '🔄 开始定时器状态监控 (每2秒更新)', 'info');
            updateStatus('timerStatus', '🔄 监控中...', 'info');

            monitoringInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/timer/current`, {
                        headers: { 'Authorization': `Bearer ${authToken}` }
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const timestamp = new Date().toLocaleTimeString();
                        
                        if (data.is_running) {
                            updateStatus('timerStatus', 
                                `✅ 运行中: ${data.formatted_time} | 任务: ${data.task_title || '未知'}`, 
                                'success');
                            log('timerLog', 
                                `[${timestamp}] 运行中 - 时间: ${data.formatted_time}, 任务ID: ${data.task_id}, 已运行: ${data.elapsed_seconds}秒`, 
                                'success');
                        } else {
                            updateStatus('timerStatus', `⏹️ 未运行 (监控中)`, 'info');
                            log('timerLog', `[${timestamp}] 定时器未运行`, 'info');
                        }
                    } else {
                        log('timerLog', `监控请求失败: ${response.status}`, 'error');
                    }
                } catch (error) {
                    log('timerLog', `监控错误: ${error.message}`, 'error');
                }
            }, 2000);
        }

        // 停止定时器状态监控
        function stopMonitoring() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
                log('timerLog', '⏹️ 已停止监控', 'warning');
                updateStatus('timerStatus', '⏹️ 监控已停止', 'warning');
            } else {
                log('timerLog', '监控未在运行', 'info');
            }
        }

        // 检查前端组件
        function checkComponents() {
            log('componentLog', '检查前端环境...', 'info');
            
            // 检查页面类型
            log('componentLog', '📄 当前页面: 独立测试页面 (非React应用)', 'info');
            
            // 检查是否能访问React应用
            const isInReactApp = window.location.pathname !== '/test-timer.html';
            if (isInReactApp) {
                if (typeof window.React !== 'undefined') {
                    log('componentLog', '✅ React已加载', 'success');
                } else {
                    log('componentLog', '❌ React未加载', 'error');
                }
            } else {
                log('componentLog', '⚠️ 这是独立测试页面，不包含React组件', 'warning');
                log('componentLog', '💡 要测试React组件，请访问主应用: http://localhost:3000/', 'info');
            }

            // 检查本地存储
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                log('componentLog', '✅ localStorage可用', 'success');
            } catch (e) {
                log('componentLog', '❌ localStorage不可用', 'error');
            }

            // 检查fetch API
            if (typeof fetch !== 'undefined') {
                log('componentLog', '✅ Fetch API可用', 'success');
            } else {
                log('componentLog', '❌ Fetch API不可用', 'error');
            }

            // 检查浏览器信息
            log('componentLog', `🌐 浏览器: ${navigator.userAgent.split(' ').slice(-2).join(' ')}`, 'info');
            log('componentLog', `📍 当前地址: ${window.location.href}`, 'info');
            
            // 检查到主应用的连通性
            log('componentLog', '检查到主应用的连通性...', 'info');
            fetch('/')
                .then(response => {
                    if (response.ok) {
                        log('componentLog', '✅ 主应用可访问', 'success');
                    } else {
                        log('componentLog', '❌ 主应用访问异常', 'error');
                    }
                })
                .catch(error => {
                    log('componentLog', `❌ 主应用连接失败: ${error.message}`, 'error');
                });
            
            updateStatus('componentStatus', '✅ 环境检查完成', 'success');
        }

        // 页面加载完成后自动检查认证状态
        window.onload = function() {
            checkAuth();
        };

        // 页面关闭时清理监控
        window.onbeforeunload = function() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
            }
        };
    </script>
</body>
</html>
