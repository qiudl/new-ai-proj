<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="description" content="AI Project Management Platform - Smart project and task management with AI-powered bulk import" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>AI Project Management Platform</title>
    
    <!-- PDF导出功能依赖 -->
    <script src="https://unpkg.com/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>
    
    <!-- Mermaid图表渲染库 -->
    <script src="https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- 开发环境调试工具 -->
    <script>
      // 只在开发环境加载调试工具
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        const script = document.createElement('script');
        script.src = '/debug-timer.js';
        script.onload = function() {
          console.log('🔧 定时器调试工具已加载');
        };
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
