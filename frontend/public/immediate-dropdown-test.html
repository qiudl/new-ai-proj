<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>立即验证批量操作修复</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 { 
            color: #722ed1; 
            text-align: center; 
            margin-bottom: 30px;
        }
        .test-button {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        .test-button:hover {
            background: linear-gradient(135deg, #389e0d 0%, #237804 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(82, 196, 26, 0.4);
        }
        .link-btn {
            display: inline-block;
            padding: 15px 30px;
            background: #1890ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .link-btn:hover {
            background: #40a9ff;
            color: white;
        }
        .result-section {
            background: #f0f9ff;
            border: 2px solid #91d5ff;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        .result-section.show {
            display: block;
        }
        .success {
            background: #f6ffed;
            border-color: #b7eb8f;
        }
        .error {
            background: #fff2f0;
            border-color: #ffccc7;
        }
        .status-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .status-success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
        }
        .status-error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
        }
        .status-warning {
            background: #fffbe6;
            border: 1px solid #fff566;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 立即验证批量操作修复</h1>
        
        <p style="text-align: center; font-size: 16px; margin: 20px 0;">
            点击下方按钮自动测试批量操作Dropdown是否已修复
        </p>
        
        <a href="http://localhost/projects/1" target="_blank" class="link-btn" style="display: block; text-align: center; margin: 20px auto; width: fit-content;">
            🎯 打开项目页面
        </a>
        
        <button class="test-button" onclick="runImmediateTest()">
            🔧 立即运行修复验证测试
        </button>
        
        <div id="resultSection" class="result-section">
            <h3>🧪 测试结果</h3>
            <div id="testResults"></div>
        </div>
    </div>

    <script>
        function runImmediateTest() {
            const resultSection = document.getElementById('resultSection');
            const testResults = document.getElementById('testResults');
            
            resultSection.classList.add('show');
            testResults.innerHTML = '<div class="status-item">🔄 正在运行测试...</div>';
            
            // 打开项目页面进行测试
            const projectWindow = window.open('http://localhost/projects/1', 'projectTest');
            
            // 等待页面加载后运行测试
            setTimeout(() => {
                try {
                    const testScript = `
                        console.log('🔧 === 立即验证批量操作修复 ===');
                        
                        // 自动选择任务
                        const checkbox = document.querySelector('.ant-table-selection-column .ant-checkbox-input');
                        if (checkbox && !checkbox.checked) {
                            console.log('📝 选择任务...');
                            checkbox.click();
                        }
                        
                        // 等待React状态更新
                        setTimeout(() => {
                            // 查找批量操作按钮
                            const batchButton = Array.from(document.querySelectorAll('button')).find(btn => 
                                btn.textContent && btn.textContent.trim() === '批量操作'
                            );
                            
                            if (batchButton) {
                                console.log('✅ 找到批量操作按钮');
                                console.log('按钮文本:', batchButton.textContent);
                                console.log('按钮尺寸:', batchButton.offsetWidth + 'x' + batchButton.offsetHeight + 'px');
                                
                                // 测试点击功能
                                batchButton.click();
                                
                                setTimeout(() => {
                                    const dropdownMenu = document.querySelector('.ant-dropdown:not(.ant-dropdown-hidden)');
                                    if (dropdownMenu) {
                                        const menuItems = dropdownMenu.querySelectorAll('.ant-dropdown-menu-item');
                                        console.log('✅ 下拉菜单出现，包含', menuItems.length, '个菜单项');
                                        
                                        // 关闭菜单
                                        document.body.click();
                                        
                                        // 报告成功
                                        window.parent.postMessage({
                                            type: 'testResult',
                                            success: true,
                                            message: '批量操作按钮修复成功！',
                                            buttonText: batchButton.textContent,
                                            buttonSize: batchButton.offsetWidth + 'x' + batchButton.offsetHeight + 'px',
                                            menuItems: menuItems.length
                                        }, '*');
                                        
                                    } else {
                                        console.log('❌ 下拉菜单未出现');
                                        window.parent.postMessage({
                                            type: 'testResult',
                                            success: false,
                                            message: '按钮存在但下拉菜单无法打开'
                                        }, '*');
                                    }
                                }, 500);
                                
                            } else {
                                console.log('❌ 未找到批量操作按钮');
                                
                                // 检查是否还有分离的按钮
                                const separateButtons = Array.from(document.querySelectorAll('button')).filter(btn => {
                                    const text = btn.textContent || '';
                                    return text.includes('批量更新状态') || text.includes('批量设置优先级') || text.includes('批量删除');
                                });
                                
                                window.parent.postMessage({
                                    type: 'testResult',
                                    success: false,
                                    message: '仍然显示为分离的按钮',
                                    separateButtons: separateButtons.map(btn => btn.textContent)
                                }, '*');
                            }
                        }, 2000);
                    `;
                    
                    // 在新窗口中执行测试脚本
                    projectWindow.eval(testScript);
                    
                } catch (error) {
                    testResults.innerHTML = `
                        <div class="status-item status-error">❌ 测试执行出错: ${error.message}</div>
                    `;
                }
            }, 3000);
        }
        
        // 监听来自测试窗口的消息
        window.addEventListener('message', function(event) {
            if (event.data.type === 'testResult') {
                const testResults = document.getElementById('testResults');
                const resultSection = document.getElementById('resultSection');
                
                if (event.data.success) {
                    resultSection.className = 'result-section show success';
                    testResults.innerHTML = `
                        <div class="status-item status-success">✅ ${event.data.message}</div>
                        <div class="status-item">📏 按钮尺寸: ${event.data.buttonSize}</div>
                        <div class="status-item">📋 菜单项数量: ${event.data.menuItems}</div>
                        <div class="status-item">🎉 修复成功！批量操作按钮正常工作</div>
                    `;
                } else {
                    resultSection.className = 'result-section show error';
                    testResults.innerHTML = `
                        <div class="status-item status-error">❌ ${event.data.message}</div>
                        ${event.data.separateButtons ? 
                            '<div class="status-item status-warning">🔍 发现的分离按钮: ' + event.data.separateButtons.join(', ') + '</div>' : 
                            ''
                        }
                        <div class="status-item status-error">💥 修复未生效，需要进一步调试</div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
