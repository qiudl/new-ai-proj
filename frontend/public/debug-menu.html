<!DOCTYPE html>
<html>
<head>
    <title>菜单调试工具</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; }
    </style>
</head>
<body>
    <h1>需求管理菜单调试</h1>
    <div id="result"></div>

    <script>
        const result = document.getElementById('result');

        // 检查localStorage中的用户信息
        const token = localStorage.getItem('token');
        const currentUser = localStorage.getItem('currentUser');

        let html = '<h2>1. Token状态</h2>';
        if (token) {
            html += '<p class="success">✅ Token存在</p>';
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                html += '<pre>' + JSON.stringify(payload, null, 2) + '</pre>';
            } catch (e) {
                html += '<p class="error">❌ Token解析失败</p>';
            }
        } else {
            html += '<p class="error">❌ 未登录，请先登录</p>';
        }

        html += '<h2>2. 当前用户信息</h2>';
        if (currentUser) {
            try {
                const user = JSON.parse(currentUser);
                html += '<pre>' + JSON.stringify(user, null, 2) + '</pre>';
                html += '<p>用户类型: ' + user.user_type + '</p>';
                html += '<p>角色: ' + user.role + '</p>';
            } catch (e) {
                html += '<p class="error">❌ 用户信息解析失败</p>';
            }
        } else {
            html += '<p class="error">❌ 无用户信息</p>';
        }

        html += '<h2>3. 需求管理菜单配置</h2>';
        html += '<pre>路径: /requirements\n配置: UserType.BOTH (所有用户可见)\n位置: 项目客户 > 需求管理</pre>';

        html += '<h2>4. 建议操作</h2>';
        html += '<ol>';
        html += '<li>确认已登录（用户名: admin）</li>';
        html += '<li>硬刷新页面: Cmd+Shift+R (Mac) 或 Ctrl+Shift+R (Windows)</li>';
        html += '<li>清除浏览器缓存</li>';
        html += '<li>检查控制台(F12)是否有JavaScript错误</li>';
        html += '</ol>';

        result.innerHTML = html;
    </script>
</body>
</html>
