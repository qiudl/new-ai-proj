<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速环境变量测试</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #f0f0f0; 
        }
        .result { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px; 
            font-size: 16px;
        }
        .success { background: #d4edda; border: 2px solid #28a745; color: #155724; }
        .error { background: #f8d7da; border: 2px solid #dc3545; color: #721c24; }
        .warning { background: #fff3cd; border: 2px solid #ffc107; color: #856404; }
        .info { background: #d1ecf1; border: 2px solid #17a2b8; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🚀 快速环境变量测试</h1>
    <p><strong>目标：</strong>直接检查React应用环境变量并确定环境标志显示逻辑</p>
    
    <div id="container-check" class="result info">
        📦 检查容器环境变量...
    </div>
    
    <div id="react-env-check" class="result warning">
        ⚙️ 等待React环境变量检测...
    </div>
    
    <div id="logic-result" class="result warning">
        🧮 环境标志逻辑计算中...
    </div>
    
    <div id="final-result" class="result warning">
        🎯 最终结果计算中...
    </div>
    
    <script>
        console.log('🚀 快速环境变量测试开始');
        
        // 1. 检查容器环境变量（通过已知的docker-compose配置）
        document.getElementById('container-check').innerHTML = `
            <strong>📦 容器环境变量配置 (docker-compose.yml):</strong><br>
            ✅ REACT_APP_ENV=development<br>
            ✅ REACT_APP_ENVIRONMENT=development<br>
            ❓ REACT_APP_LOCAL_DEV=undefined (未设置)
        `;
        document.getElementById('container-check').className = 'result success';
        
        // 2. 模拟React环境变量检查
        // 注意：这是静态HTML，无法直接访问React的process.env
        // 但我们可以推断基于容器配置的值
        const expectedEnv = {
            REACT_APP_ENV: 'development',
            REACT_APP_ENVIRONMENT: 'development', 
            REACT_APP_LOCAL_DEV: undefined,  // 未在docker-compose中设置
            NODE_ENV: 'development'  // 通常React默认值
        };
        
        document.getElementById('react-env-check').innerHTML = `
            <strong>⚙️ React环境变量 (基于容器配置推断):</strong><br>
            process.env.REACT_APP_ENV: "${expectedEnv.REACT_APP_ENV}"<br>
            process.env.REACT_APP_ENVIRONMENT: "${expectedEnv.REACT_APP_ENVIRONMENT}"<br>
            process.env.REACT_APP_LOCAL_DEV: ${expectedEnv.REACT_APP_LOCAL_DEV}<br>
            process.env.NODE_ENV: "${expectedEnv.NODE_ENV}"
        `;
        document.getElementById('react-env-check').className = 'result info';
        
        // 3. Layout.tsx逻辑分析
        const env1 = expectedEnv.REACT_APP_ENV;
        const env2 = expectedEnv.REACT_APP_ENVIRONMENT;
        const localDev = expectedEnv.REACT_APP_LOCAL_DEV;
        
        const condition1 = localDev === 'true';
        const condition2a = env1 === 'development';
        const condition2b = env2 === 'development';
        const condition2c = localDev !== 'true';
        const condition2 = condition2a && condition2b && condition2c;
        
        document.getElementById('logic-result').innerHTML = `
            <strong>🧮 Layout.tsx条件逻辑分析:</strong><br>
            条件1: REACT_APP_LOCAL_DEV === 'true' → ${condition1} (${localDev} === 'true')<br>
            条件2a: REACT_APP_ENV === 'development' → ${condition2a} (${env1} === 'development')<br>
            条件2b: REACT_APP_ENVIRONMENT === 'development' → ${condition2b} (${env2} === 'development')<br>
            条件2c: REACT_APP_LOCAL_DEV !== 'true' → ${condition2c} (${localDev} !== 'true')<br>
            <strong>条件2整体: ${condition2}</strong>
        `;
        document.getElementById('logic-result').className = 'result info';
        
        // 4. 最终结果
        let finalResult, resultClass, explanation;
        
        if (condition1) {
            finalResult = '🟢 开发环境 (绿色)';
            resultClass = 'success';
            explanation = '因为 REACT_APP_LOCAL_DEV === "true"';
        } else if (condition2) {
            finalResult = '🔵 测试版本 (蓝色)';
            resultClass = 'success'; 
            explanation = '因为条件2的所有子条件都满足';
        } else {
            finalResult = '❌ 无环境标志';
            resultClass = 'error';
            explanation = '没有任何条件匹配';
        }
        
        document.getElementById('final-result').innerHTML = `
            <strong>🎯 预期显示结果:</strong><br>
            ${finalResult}<br>
            <strong>原因:</strong> ${explanation}<br>
            <br>
            <strong>⭐ 关键结论:</strong><br>
            ${condition2 ? 
                '✅ 应该显示蓝色"测试版本"标志！' : 
                '❌ 不应该显示蓝色"测试版本"标志'}
        `;
        document.getElementById('final-result').className = `result ${resultClass}`;
        
        // 5. 输出到控制台供调试
        console.log('📊 环境变量分析结果:', {
            containerConfig: '✅ 正确',
            expectedReactEnv: expectedEnv,
            condition1: condition1,
            condition2: condition2,
            expectedFlag: finalResult,
            explanation: explanation
        });
        
        // 6. 提供简单的验证指引
        setTimeout(() => {
            console.log('🔍 验证步骤:');
            console.log('1. 打开 http://localhost/ 查看实际的环境标志');
            console.log('2. 如果仍显示绿色"开发环境"，则可能是:');
            console.log('   - React应用缓存问题');
            console.log('   - 浏览器缓存问题');  
            console.log('   - 环境变量传递问题');
            console.log('3. 如果显示蓝色"测试版本"，则修复成功！');
        }, 1000);
    </script>
</body>
</html>
