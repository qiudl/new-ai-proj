<!DOCTYPE html>
<html>
<head>
    <title>定时器状态检查</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .info { color: #007bff; }
        button { margin: 5px; padding: 8px 15px; }
        pre { background: #f8f9fa; padding: 10px; }
    </style>
</head>
<body>
    <h1>🔍 定时器状态检查</h1>
    
    <div class="section">
        <h3>当前修复状态</h3>
        <button onclick="checkStatus()">🔄 检查状态</button>
        <div id="status"></div>
    </div>

    <div class="section">
        <h3>问题诊断</h3>
        <button onclick="diagnoseIssues()">🩺 诊断问题</button>
        <div id="diagnosis"></div>
    </div>

    <script>
        function checkStatus() {
            const status = document.getElementById('status');
            let output = '<h4>检查结果:</h4>';
            
            // 1. localStorage状态
            const saved = localStorage.getItem('globalTimerState');
            if (saved) {
                const state = JSON.parse(saved);
                output += `<div class="success">✅ localStorage: 正常</div>`;
                output += `<div>• 运行状态: ${state.isRunning ? '运行中' : '已停止'}</div>`;
                output += `<div>• 任务: ${state.taskTitle || '无'}</div>`;
                output += `<div>• 时间: ${state.formattedTime || '00:00:00'}</div>`;
            } else {
                output += `<div class="error">❌ localStorage: 无数据</div>`;
            }
            
            // 2. 组件元素检查
            const timerCard = document.querySelector('.timer-card');
            const floatingTimer = document.querySelector('.floating-timer');
            
            output += `<div class="${timerCard ? 'success' : 'error'}">
                ${timerCard ? '✅' : '❌'} TimerCard组件: ${timerCard ? '存在' : '不存在'}
            </div>`;
            
            output += `<div class="${floatingTimer ? 'success' : 'info'}">
                ${floatingTimer ? '✅' : 'ℹ️'} FloatingTimer组件: ${floatingTimer ? '存在' : '不存在(正常，未运行时不显示)'}
            </div>`;
            
            // 3. 检查是否有强制显示的组件
            const forcedTimer = document.querySelector('.floating-timer-forced');
            if (forcedTimer) {
                output += `<div class="error">❌ 发现强制显示组件: 需要移除</div>`;
            } else {
                output += `<div class="success">✅ 无强制显示组件: 正常</div>`;
            }
            
            status.innerHTML = output;
        }
        
        function diagnoseIssues() {
            const diagnosis = document.getElementById('diagnosis');
            let output = '<h4>问题诊断:</h4>';
            
            const saved = localStorage.getItem('globalTimerState');
            if (!saved) {
                output += `<div class="error">❌ 问题: 没有定时器状态数据</div>`;
                output += `<div class="info">建议: 在任务页面启动一个定时器</div>`;
                diagnosis.innerHTML = output;
                return;
            }
            
            const state = JSON.parse(saved);
            
            if (!state.isRunning) {
                output += `<div class="info">ℹ️ 状态: 定时器未运行</div>`;
                output += `<div class="info">建议: 启动定时器测试功能</div>`;
            } else {
                output += `<div class="success">✅ 状态: 定时器正在运行</div>`;
                
                if (!state.taskTitle) {
                    output += `<div class="error">❌ 问题: 缺少任务标题</div>`;
                }
                
                if (!state.formattedTime) {
                    output += `<div class="error">❌ 问题: 缺少格式化时间</div>`;
                }
                
                // 检查时间是否在更新
                setTimeout(() => {
                    const newSaved = localStorage.getItem('globalTimerState');
                    if (newSaved) {
                        const newState = JSON.parse(newSaved);
                        if (newState.formattedTime !== state.formattedTime) {
                            output += `<div class="success">✅ 计时器正在更新</div>`;
                        } else {
                            output += `<div class="error">❌ 问题: 计时器可能未更新</div>`;
                        }
                        diagnosis.innerHTML = output;
                    }
                }, 2000);
            }
            
            diagnosis.innerHTML = output;
        }
        
        // 页面加载时自动检查
        window.onload = function() {
            checkStatus();
            setTimeout(diagnoseIssues, 500);
        };
    </script>
</body>
</html>
