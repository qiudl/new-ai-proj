<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>版本历史API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { border-color: #28a745; background-color: #d4edda; }
        .error { border-color: #dc3545; background-color: #f8d7da; }
        .loading { border-color: #ffc107; background-color: #fff3cd; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-info { background-color: #17a2b8; color: white; }
    </style>
</head>
<body>
    <h1>📚 文档版本历史 API 测试</h1>
    <p>这个测试页面验证版本历史 API 的集成是否正常工作。</p>
    
    <div class="test-controls">
        <button class="btn-primary" onclick="testVersionHistory()">测试版本历史列表</button>
        <button class="btn-success" onclick="testSpecificVersion(2)">测试获取版本2</button>
        <button class="btn-info" onclick="testCurrentVersion(3)">测试获取当前版本</button>
        <button class="btn-primary" onclick="runAllTests()">运行所有测试</button>
    </div>

    <div id="test-results"></div>

    <script>
        const API_BASE = 'http://localhost:8081/api/v1';
        const TEST_TOKEN = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwidXNlcl90eXBlIjoic3lzdGVtIiwic3ViIjoiYWRtaW4iLCJleHAiOjE3NTg2MTQzMDMsIm5iZiI6MTc1ODAwOTUwMywiaWF0IjoxNzU4MDA5NTAzLCJqdGkiOiI0MzM2ODBhNjcxZmQ5YWNlOTg0ZjVmY2FkYzlkYjUyOCJ9._lRD6FtfMO26urm2eUR8AsrEpOBjobOss6LHj0HvTA0';

        // 测试配置
        const TEST_PROJECT_ID = 1;
        const TEST_TASK_ID = 1805;
        const TEST_DOCUMENT_ID = 1089;

        function addTestResult(testName, success, data, error = null) {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${success ? 'success' : 'error'}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            resultDiv.innerHTML = `
                <h3>${success ? '✅' : '❌'} ${testName}</h3>
                <p><strong>时间:</strong> ${timestamp}</p>
                ${error ? `<p><strong>错误:</strong> ${error}</p>` : ''}
                <details>
                    <summary>响应数据</summary>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </details>
            `;
            
            resultsDiv.appendChild(resultDiv);
        }

        function addLoadingResult(testName) {
            const resultsDiv = document.getElementById('test-results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-result loading';
            resultDiv.id = `loading-${testName.replace(/\s+/g, '-')}`;
            resultDiv.innerHTML = `<h3>⏳ ${testName} - 执行中...</h3>`;
            resultsDiv.appendChild(resultDiv);
        }

        function removeLoadingResult(testName) {
            const loadingDiv = document.getElementById(`loading-${testName.replace(/\s+/g, '-')}`);
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        async function apiCall(endpoint, method = 'GET') {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method,
                headers: {
                    'Authorization': `Bearer ${TEST_TOKEN}`,
                    'Content-Type': 'application/json'
                }
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            return await response.json();
        }

        async function testVersionHistory() {
            const testName = '获取版本历史列表';
            addLoadingResult(testName);
            
            try {
                const endpoint = `/projects/${TEST_PROJECT_ID}/tasks/${TEST_TASK_ID}/documents/${TEST_DOCUMENT_ID}/versions`;
                const result = await apiCall(endpoint);
                
                removeLoadingResult(testName);
                
                // 验证响应结构
                const isValid = result.success && 
                               result.data && 
                               Array.isArray(result.data.versions) &&
                               result.data.stats &&
                               result.data.stats.total_versions > 0;
                
                if (isValid) {
                    const versionsCount = result.data.versions.length;
                    const stats = result.data.stats;
                    addTestResult(
                        `${testName} (${versionsCount}个版本)`, 
                        true, 
                        {
                            versions_count: versionsCount,
                            current_version: stats.current_version,
                            total_versions: stats.total_versions,
                            sample_version: result.data.versions[0]
                        }
                    );
                } else {
                    addTestResult(testName, false, result, '响应结构验证失败');
                }
                
            } catch (error) {
                removeLoadingResult(testName);
                addTestResult(testName, false, null, error.message);
            }
        }

        async function testSpecificVersion(versionNumber) {
            const testName = `获取版本${versionNumber}详情`;
            addLoadingResult(testName);
            
            try {
                const endpoint = `/projects/${TEST_PROJECT_ID}/tasks/${TEST_TASK_ID}/documents/${TEST_DOCUMENT_ID}/versions/${versionNumber}`;
                const result = await apiCall(endpoint);
                
                removeLoadingResult(testName);
                
                // 验证响应结构
                const isValid = result.success && 
                               result.data && 
                               result.data.version_number === versionNumber &&
                               result.data.title &&
                               result.data.changes_summary;
                
                if (isValid) {
                    addTestResult(
                        `${testName} - "${result.data.title}"`, 
                        true, 
                        {
                            version_number: result.data.version_number,
                            title: result.data.title,
                            changes_summary: result.data.changes_summary,
                            is_current: result.data.is_current,
                            created_by_name: result.data.created_by_name,
                            created_at: result.data.created_at
                        }
                    );
                } else {
                    addTestResult(testName, false, result, '响应结构验证失败');
                }
                
            } catch (error) {
                removeLoadingResult(testName);
                addTestResult(testName, false, null, error.message);
            }
        }

        async function testCurrentVersion(versionNumber) {
            const testName = `验证当前版本${versionNumber}`;
            addLoadingResult(testName);
            
            try {
                const endpoint = `/projects/${TEST_PROJECT_ID}/tasks/${TEST_TASK_ID}/documents/${TEST_DOCUMENT_ID}/versions/${versionNumber}`;
                const result = await apiCall(endpoint);
                
                removeLoadingResult(testName);
                
                // 验证是否为当前版本
                const isCurrentVersion = result.success && 
                                       result.data && 
                                       result.data.is_current === true;
                
                if (isCurrentVersion) {
                    addTestResult(
                        `${testName} ✅ 是当前版本`, 
                        true, 
                        {
                            version_number: result.data.version_number,
                            title: result.data.title,
                            is_current: result.data.is_current
                        }
                    );
                } else {
                    addTestResult(
                        testName, 
                        false, 
                        result, 
                        result.data ? `is_current = ${result.data.is_current}` : '响应无效'
                    );
                }
                
            } catch (error) {
                removeLoadingResult(testName);
                addTestResult(testName, false, null, error.message);
            }
        }

        async function runAllTests() {
            // 清除之前的结果
            document.getElementById('test-results').innerHTML = '';
            
            console.log('🚀 开始运行所有版本历史API测试...');
            
            // 按顺序运行测试
            await testVersionHistory();
            await new Promise(resolve => setTimeout(resolve, 500)); // 短暂延迟
            
            await testSpecificVersion(2);
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testCurrentVersion(3);
            
            console.log('✅ 所有测试完成！');
        }

        // 页面加载完成后的初始化
        window.onload = function() {
            console.log('📋 版本历史API测试页面加载完成');
            console.log('🔧 测试配置:', {
                api_base: API_BASE,
                project_id: TEST_PROJECT_ID,
                task_id: TEST_TASK_ID,
                document_id: TEST_DOCUMENT_ID
            });
        };
    </script>
</body>
</html>
