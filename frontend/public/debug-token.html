<!DOCTYPE html>
<html>
<head>
    <title>JWT Token Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .token { word-break: break-all; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>JWT Token Debug Tool</h1>
    
    <h2>当前Token状态</h2>
    <div id="tokenStatus"></div>
    
    <h2>生成测试Token</h2>
    <button onclick="generateTestToken()">生成并设置测试Token</button>
    <button onclick="clearToken()">清除Token</button>
    
    <h2>测试API调用</h2>
    <button onclick="testProjectAPI()">测试项目API</button>
    <button onclick="testCompanyAPI()">测试企业API</button>
    
    <div id="apiResults"></div>

    <script>
        // 检查当前token状态
        function checkTokenStatus() {
            const token = localStorage.getItem('token');
            const statusDiv = document.getElementById('tokenStatus');
            
            if (token) {
                statusDiv.innerHTML = `
                    <div class="success">✅ Token已存在</div>
                    <div class="token">Token: ${token}</div>
                `;
            } else {
                statusDiv.innerHTML = '<div class="error">❌ 没有Token</div>';
            }
        }
        
        // 生成测试token
        function generateTestToken() {
            const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ1c2VybmFtZSI6ImFkbWluIiwicm9sZSI6ImFkbWluIiwidXNlcl90eXBlIjoiYWRtaW4iLCJleHAiOjE3NTM2Mzc3NDAsImlhdCI6MTc1MzYzNDE0MCwibmJmIjoxNzUzNjM0MTQwLCJzdWIiOiJhZG1pbiJ9.qsqAth_OZSQxWW7Vseu5RUK8YJU-6LF-Iv0NdzdUo3o';
            localStorage.setItem('token', token);
            alert('测试Token已设置');
            checkTokenStatus();
        }
        
        // 清除token
        function clearToken() {
            localStorage.removeItem('token');
            alert('Token已清除');
            checkTokenStatus();
        }
        
        // 测试项目API
        async function testProjectAPI() {
            const resultsDiv = document.getElementById('apiResults');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultsDiv.innerHTML = '<div class="error">请先设置Token</div>';
                return;
            }
            
            try {
                resultsDiv.innerHTML = '<div>测试项目API中...</div>';
                
                const response = await fetch('/api/v1/projects/34', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <h3>项目API结果</h3>
                    <div>状态码: ${response.status}</div>
                    <div class="token">响应: ${JSON.stringify(data, null, 2)}</div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
            }
        }
        
        // 测试企业API
        async function testCompanyAPI() {
            const resultsDiv = document.getElementById('apiResults');
            const token = localStorage.getItem('token');
            
            if (!token) {
                resultsDiv.innerHTML = '<div class="error">请先设置Token</div>';
                return;
            }
            
            try {
                resultsDiv.innerHTML = '<div>测试企业API中...</div>';
                
                const response = await fetch('/api/v1/companies/8', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <h3>企业API结果</h3>
                    <div>状态码: ${response.status}</div>
                    <div class="token">响应: ${JSON.stringify(data, null, 2)}</div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">错误: ${error.message}</div>`;
            }
        }
        
        // 页面加载时检查状态
        checkTokenStatus();
    </script>
</body>
</html>
