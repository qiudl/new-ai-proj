name: Frontend CI - Single Test

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  workNotesService-single-test:
    name: Run workNotesService.test.ts (react-scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run single test file
        env:
          CI: true
        run: |
          npm test -- --watchAll=false src/services/__tests__/workNotesService.test.ts