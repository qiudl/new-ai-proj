version: '3.8'
services:
  db:
    image: postgres:15
    container_name: ai_tasks_pg
    environment:
      - POSTGRES_USER=ai
      - POSTGRES_PASSWORD=ai
      - POSTGRES_DB=ai_tasks
    ports:
      - '5433:5432'
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ai -d ai_tasks' ]
      interval: 3s
      timeout: 5s
      retries: 10
volumes:
  db_data: {}

