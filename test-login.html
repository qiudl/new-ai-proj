<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>
<body>
    <h1>Login Test</h1>
    <div>
        <label>Username: <input type="text" id="username" value="dev_user_1"></label><br><br>
        <button onclick="testDevQuickLogin()">Dev Quick Login (No Password Required)</button>
        <button onclick="openAPIKeyDetail()">Open API Key Detail Page</button>
    </div>
    <div id="result"></div>
    
    <script>
        async function testDevQuickLogin() {
            const username = document.getElementById('username').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('http://localhost:8081/api/v1/auth/dev-quick-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username
                    })
                });
                
                const data = await response.json();
                console.log('Dev quick login response:', data);
                
                if (response.ok && data.data && data.data.token) {
                    localStorage.setItem('token', data.data.token);
                    resultDiv.innerHTML = `
                        <h3>Dev Quick Login Successful!</h3>
                        <p>Token saved to localStorage</p>
                        <p>You can now access the API Key detail page</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>Login Failed</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `<h3>Error: ${error.message}</h3>`;
            }
        }
        
        function openAPIKeyDetail() {
            window.open('http://localhost:3001/api-keys/8', '_blank');
        }
    </script>
</body>
</html>
