<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务统计卡片布局测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        
        .stats-container {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            flex: 1;
            min-height: 100px;
        }
        
        .stat-label {
            color: #8c8c8c;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .stat-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #722ed1;
            transition: width 0.3s ease;
        }
        
        .completion-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        
        .completion-rate {
            font-size: 12px;
            color: #722ed1;
            font-weight: bold;
        }
        
        .task-number {
            display: flex;
            align-items: center;
        }
        
        .before-after {
            display: flex;
            gap: 32px;
            margin-bottom: 32px;
        }
        
        .before-after h3 {
            margin-bottom: 16px;
            color: #333;
        }
        
        .comparison-section {
            flex: 1;
        }
        
        .old-layout .stat-card {
            min-height: 120px;
        }
        
        .old-layout .stat-value {
            margin-bottom: 8px;
        }
        
        .old-layout .completion-separate {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>任务统计卡片布局优化</h1>
    
    <div class="before-after">
        <div class="comparison-section">
            <h3>🔴 修改前 - 占用4行</h3>
            <div class="stats-container old-layout">
                <div class="stat-card">
                    <div class="stat-label">任务总数</div>
                    <div class="stat-value" style="color: #1890ff;">
                        <span class="stat-icon">📊</span>30
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" style="color: #52c41a;">
                        <span class="stat-icon">✅</span>8
                    </div>
                    <div class="completion-separate">
                        <div class="stat-label">完成率</div>
                        <div style="font-size: 24px; font-weight: bold; color: #722ed1; margin-bottom: 8px;">27%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 27%;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">进行中</div>
                    <div class="stat-value" style="color: #fa8c16;">
                        <span class="stat-icon">🔄</span>6
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">适期任务</div>
                    <div class="stat-value" style="color: #13c2c2;">
                        <span class="stat-icon">📅</span>0
                    </div>
                </div>
            </div>
        </div>
        
        <div class="comparison-section">
            <h3>✅ 修改后 - 压缩到2行</h3>
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-label">任务总数</div>
                    <div class="stat-value" style="color: #1890ff;">
                        <span class="stat-icon">📊</span>30
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">已完成</div>
                    <div class="task-number">
                        <span class="stat-icon">✅</span>
                        <span style="font-size: 24px; font-weight: bold; color: #52c41a;">8</span>
                    </div>
                    <div class="completion-info">
                        <span class="completion-rate">完成率 27%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 27%;"></div>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">进行中</div>
                    <div class="stat-value" style="color: #fa8c16;">
                        <span class="stat-icon">🔄</span>6
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-label">适期任务</div>
                    <div class="stat-value" style="color: #13c2c2;">
                        <span class="stat-icon">📅</span>0
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div style="background: white; padding: 20px; border-radius: 8px; margin-top: 20px;">
        <h3>优化说明</h3>
        <ul>
            <li><strong>空间节约</strong>：已完成卡片从4行压缩到2行，节约50%垂直空间</li>
            <li><strong>信息整合</strong>：完成率和进度条合并到已完成卡片中，避免重复信息</li>
            <li><strong>视觉统一</strong>：所有卡片高度保持一致，布局更整齐</li>
            <li><strong>重点突出</strong>：已完成数字仍然保持醒目，完成率作为辅助信息显示</li>
        </ul>
    </div>
</body>
</html>
