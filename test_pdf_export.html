<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF导出测试</title>
    <script src="https://unpkg.com/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .test-content {
            border: 1px solid #e8e8e8;
            padding: 20px;
            border-radius: 8px;
            background: #fafafa;
            margin: 20px 0;
        }
        .pdf-content {
            background: white;
            padding: 20px;
            border-radius: 4px;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #40a9ff;
        }
        .log {
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>📄 PDF导出功能测试</h1>
    
    <div class="test-content">
        <h3>🔍 问题诊断</h3>
        <p>测试不同的PDF导出方式，定位空白PDF的原因</p>
        
        <div>
            <button onclick="checkLibrary()">检查html2pdf库</button>
            <button onclick="testSimplePdf()">测试简单内容PDF</button>
            <button onclick="testMarkdownPdf()">测试Markdown转换PDF</button>
            <button onclick="testComplexPdf()">测试复杂内容PDF</button>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <div class="pdf-content" id="test-content">
        <div class="document-header">
            <h1>测试文档</h1>
            <div class="document-meta">
                测试时间: <span id="current-time"></span>
            </div>
        </div>
        <div class="document-content">
            <h2>这是一个测试标题</h2>
            <p>这是一段测试文本内容，用来验证PDF导出是否正常工作。</p>
            
            <h3>Markdown语法测试</h3>
            <p><strong>粗体文本</strong> 和 <em>斜体文本</em></p>
            
            <pre style="background: #f6f8fa; padding: 16px; border-radius: 6px;">
// 这是代码块
function test() {
    console.log('Hello PDF!');
}
            </pre>
            
            <ul>
                <li>列表项目 1</li>
                <li>列表项目 2</li>
                <li>列表项目 3</li>
            </ul>
            
            <blockquote style="border-left: 4px solid #1890ff; margin: 16px 0; padding: 8px 16px; background: #f9f9f9;">
                这是一个引用块内容
            </blockquote>
        </div>
    </div>

    <script>
        // 更新时间
        document.getElementById('current-time').textContent = new Date().toLocaleString('zh-CN');
        
        // 日志输出函数
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[PDF Test] ${message}`);
        }
        
        // 检查html2pdf库是否正确加载
        function checkLibrary() {
            log('检查html2pdf库...');
            
            if (typeof window.html2pdf === 'undefined') {
                log('❌ html2pdf库未加载');
                return;
            }
            
            log('✅ html2pdf库已加载');
            log(`版本信息: ${typeof window.html2pdf}`);
            
            // 检查依赖库
            if (typeof window.jsPDF === 'undefined') {
                log('⚠️  jsPDF可能未正确加载');
            } else {
                log('✅ jsPDF依赖正常');
            }
            
            if (typeof window.html2canvas === 'undefined') {
                log('⚠️  html2canvas可能未正确加载');
            } else {
                log('✅ html2canvas依赖正常');
            }
        }
        
        // 测试简单内容PDF导出
        async function testSimplePdf() {
            log('开始测试简单内容PDF导出...');
            
            try {
                const element = document.createElement('div');
                element.innerHTML = '<h1>简单测试</h1><p>这是一个简单的测试内容。</p>';
                element.style.padding = '20px';
                element.style.backgroundColor = '#ffffff';
                
                const opt = {
                    margin: 10,
                    filename: 'simple-test.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                await window.html2pdf().set(opt).from(element).save();
                log('✅ 简单内容PDF导出成功');
                
            } catch (error) {
                log(`❌ 简单内容PDF导出失败: ${error.message}`);
                console.error('Simple PDF test error:', error);
            }
        }
        
        // 测试现有内容的PDF导出
        async function testComplexPdf() {
            log('开始测试复杂内容PDF导出...');
            
            try {
                const content = document.getElementById('test-content');
                if (!content) {
                    log('❌ 未找到测试内容元素');
                    return;
                }
                
                log(`内容元素大小: ${content.offsetWidth}x${content.offsetHeight}`);
                log(`内容文本长度: ${content.textContent.length}`);
                
                const opt = {
                    margin: [15, 15, 15, 15],
                    filename: 'complex-test.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#ffffff',
                        logging: true,
                        width: 794,
                        height: null
                    },
                    jsPDF: { 
                        unit: 'mm', 
                        format: 'a4', 
                        orientation: 'portrait'
                    }
                };
                
                log('开始生成PDF...');
                await window.html2pdf().set(opt).from(content).save();
                log('✅ 复杂内容PDF导出成功');
                
            } catch (error) {
                log(`❌ 复杂内容PDF导出失败: ${error.message}`);
                console.error('Complex PDF test error:', error);
            }
        }
        
        // 测试Markdown转换和PDF导出
        async function testMarkdownPdf() {
            log('开始测试Markdown转换PDF导出...');
            
            try {
                // 模拟Markdown内容
                const markdownContent = `
# 测试文档标题

## 功能介绍
这是一个**Markdown**转换测试文档。

### 支持的语法
- *斜体文本*
- **粗体文本** 
- \`行内代码\`

#### 代码块示例
\`\`\`javascript
function testFunction() {
    console.log('Hello, Markdown PDF!');
}
\`\`\`

> 这是一个引用块

#### 列表测试
1. 第一项
2. 第二项
3. 第三项
                `;
                
                // 简单的Markdown到HTML转换
                let html = markdownContent
                    .replace(/^### (.*$)/gm, '<h3>$1</h3>')
                    .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                    .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/\`([^\`]+)\`/g, '<code style="background: #f1f3f4; padding: 2px 4px;">$1</code>')
                    .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre style="background: #f6f8fa; padding: 16px; border-radius: 6px;"><code>$2</code></pre>')
                    .replace(/^> (.*$)/gm, '<blockquote style="border-left: 4px solid #1890ff; margin: 16px 0; padding: 8px 16px; background: #f9f9f9;">$1</blockquote>')
                    .replace(/^\d+\. (.*$)/gm, '<li>$1</li>')
                    .replace(/^- (.*$)/gm, '<li>$1</li>')
                    .replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul style="padding-left: 24px;">$1</ul>')
                    .replace(/\n/g, '<br>');
                
                log(`转换后的HTML长度: ${html.length}`);
                
                // 创建临时元素
                const element = document.createElement('div');
                element.innerHTML = html;
                element.style.padding = '20px';
                element.style.backgroundColor = '#ffffff';
                element.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
                element.style.lineHeight = '1.6';
                
                // 临时添加到DOM以便渲染
                element.style.position = 'absolute';
                element.style.left = '-9999px';
                element.style.top = '-9999px';
                element.style.width = '794px';
                document.body.appendChild(element);
                
                const opt = {
                    margin: [15, 15, 15, 15],
                    filename: 'markdown-test.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        backgroundColor: '#ffffff',
                        logging: true
                    },
                    jsPDF: { 
                        unit: 'mm', 
                        format: 'a4', 
                        orientation: 'portrait'
                    }
                };
                
                log('开始生成Markdown PDF...');
                await window.html2pdf().set(opt).from(element).save();
                log('✅ Markdown内容PDF导出成功');
                
                // 清理临时元素
                document.body.removeChild(element);
                
            } catch (error) {
                log(`❌ Markdown内容PDF导出失败: ${error.message}`);
                console.error('Markdown PDF test error:', error);
            }
        }
        
        // 页面加载完成后自动检查库
        window.addEventListener('load', function() {
            setTimeout(() => {
                log('页面加载完成，开始检查环境...');
                checkLibrary();
            }, 1000);
        });
    </script>
</body>
</html>
