<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Test</h1>
    <button onclick="testAPI()">Test Document API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            
            try {
                const token = localStorage.getItem('token');
                console.log('Token:', token);
                
                const response = await fetch('/api/v1/projects/39/tasks/50/document', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = '<h3>Success!</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<h3>Error: ' + response.status + '</h3><p>' + response.statusText + '</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<h3>Error!</h3><p>' + error.message + '</p>';
            }
        }
        
        // 检查token
        window.onload = function() {
            const token = localStorage.getItem('token');
            console.log('Current token:', token);
        }
    </script>
</body>
</html>
