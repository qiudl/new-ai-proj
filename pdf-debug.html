<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF导出调试</title>
    
    <!-- 加载html2pdf库 -->
    <script src="https://unpkg.com/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fff;
        }
        
        .test-content {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        
        .btn:hover {
            background: #40a9ff;
        }
        
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🐛 PDF导出调试工具</h1>
    
    <div class="test-content">
        <h2>测试内容</h2>
        <p>这是一个简单的PDF导出测试。</p>
        <p><strong>加粗文本</strong> 和 <em>斜体文本</em></p>
        <ul>
            <li>列表项 1</li>
            <li>列表项 2</li>
            <li>列表项 3</li>
        </ul>
    </div>
    
    <button class="btn" onclick="testBasicPDF()">🔧 测试基础PDF导出</button>
    <button class="btn" onclick="testWithContent()">📄 测试带内容PDF导出</button>
    <button class="btn" onclick="clearLog()">🗑️ 清空日志</button>
    
    <div class="log" id="logContainer"></div>

    <script>
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logContainer = document.getElementById('logContainer');
            const prefix = type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️';
            logContainer.textContent += `[${timestamp}] ${prefix} ${message}\n`;
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[PDF Debug] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('logContainer').textContent = '';
        }
        
        async function testBasicPDF() {
            log('开始基础PDF导出测试...');
            
            try {
                // 检查html2pdf库
                if (typeof html2pdf === 'undefined') {
                    throw new Error('html2pdf库未加载');
                }
                log('html2pdf库检查通过', 'success');
                
                // 创建简单的测试元素
                const testElement = document.createElement('div');
                testElement.innerHTML = `
                    <div style="padding: 20px; background: white; font-family: Arial, sans-serif;">
                        <h1 style="color: #333;">PDF导出测试</h1>
                        <p>这是一个简单的测试内容。</p>
                        <p>测试时间: ${new Date().toLocaleString()}</p>
                    </div>
                `;
                
                // 设置元素样式
                testElement.style.position = 'absolute';
                testElement.style.top = '-9999px';
                testElement.style.left = '0';
                testElement.style.width = '600px';
                testElement.style.backgroundColor = '#ffffff';
                
                // 添加到DOM
                document.body.appendChild(testElement);
                log('测试元素已创建并添加到DOM');
                
                // 等待渲染
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 基础配置
                const opt = {
                    margin: 1,
                    filename: 'basic-test.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 1,
                        logging: true,
                        backgroundColor: '#ffffff',
                        useCORS: true
                    },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                
                log('开始生成PDF...');
                await html2pdf().set(opt).from(testElement).save();
                log('基础PDF导出成功！', 'success');
                
                // 清理
                document.body.removeChild(testElement);
                log('清理测试元素完成');
                
            } catch (error) {
                log(`基础PDF导出失败: ${error.message}`, 'error');
            }
        }
        
        async function testWithContent() {
            log('开始内容PDF导出测试...');
            
            try {
                const testContent = `
                    <h1>任务文档测试</h1>
                    <h2>基本内容</h2>
                    <p>这是一个包含多种内容的测试文档。</p>
                    
                    <h3>文本样式测试</h3>
                    <p><strong>加粗文本</strong> 和 <em>斜体文本</em></p>
                    <p><code>行内代码</code> 样式测试</p>
                    
                    <h3>列表测试</h3>
                    <ul>
                        <li>第一项</li>
                        <li>第二项</li>
                        <li>第三项</li>
                    </ul>
                    
                    <h3>代码块测试</h3>
                    <pre style="background: #f6f8fa; padding: 10px; border-radius: 4px;">
function test() {
    console.log("Hello World!");
}</pre>
                    
                    <p>导出时间: ${new Date().toLocaleString()}</p>
                `;
                
                // 创建PDF元素
                const pdfElement = document.createElement('div');
                pdfElement.innerHTML = `
                    <div style="
                        padding: 30px;
                        background: white;
                        font-family: Arial, sans-serif;
                        color: #333;
                        line-height: 1.6;
                        max-width: 100%;
                        word-wrap: break-word;
                    ">
                        ${testContent}
                    </div>
                `;
                
                // 设置样式
                pdfElement.style.position = 'absolute';
                pdfElement.style.top = '-9999px';
                pdfElement.style.left = '0';
                pdfElement.style.width = '800px';
                pdfElement.style.backgroundColor = '#ffffff';
                pdfElement.style.visibility = 'hidden';
                
                // 添加到DOM
                document.body.appendChild(pdfElement);
                log('内容元素已创建并添加到DOM');
                
                // 等待渲染
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // 检查元素状态
                log(`元素状态: 宽度=${pdfElement.offsetWidth}, 高度=${pdfElement.offsetHeight}, 内容长度=${pdfElement.innerHTML.length}`);
                
                // PDF配置
                const opt = {
                    margin: 1,
                    filename: 'content-test.pdf',
                    image: { type: 'jpeg', quality: 0.92 },
                    html2canvas: { 
                        scale: 1,
                        backgroundColor: '#ffffff',
                        logging: true,
                        useCORS: true,
                        allowTaint: true,
                        width: 800,
                        height: null
                    },
                    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                
                log('开始生成内容PDF...');
                await html2pdf().set(opt).from(pdfElement).save();
                log('内容PDF导出成功！', 'success');
                
                // 清理
                document.body.removeChild(pdfElement);
                log('清理完成');
                
            } catch (error) {
                log(`内容PDF导出失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('PDF导出调试工具加载完成');
            log('点击按钮开始测试 PDF 导出功能');
        });
    </script>
</body>
</html>
