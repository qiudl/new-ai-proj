version: "1.0"
name: 用户验证规则集
description: 用于用户注册和更新的验证规则配置
settings:
    enable_caching: true
    enable_warnings: true
    fail_fast: false
    max_concurrency: 4
    max_errors: 10
    strict_mode: true
rules:
    - id: user_required_fields
      name: 用户必填字段
      type: required
      description: 验证用户基础必填字段
      priority: 100
      enabled: true
      params:
        fields:
            - username
            - email
            - password
      tags:
        - basic
        - required
    - id: username_length
      name: 用户名长度验证
      type: length
      description: 用户名必须在3-20字符之间
      priority: 90
      enabled: true
      params:
        field: username
        max: 20
        min: 3
      tags:
        - basic
        - username
    - id: username_format
      name: 用户名格式验证
      type: regex
      description: 用户名只能包含字母、数字和下划线
      priority: 85
      enabled: true
      params:
        field: username
        pattern: ^[a-zA-Z0-9_]+$
      tags:
        - basic
        - username
        - format
    - id: email_format
      name: 邮箱格式验证
      type: email
      description: 验证邮箱地址格式
      priority: 95
      enabled: true
      params:
        field: email
      tags:
        - basic
        - email
    - id: password_complexity
      name: 密码复杂度验证
      type: and
      description: 密码必须满足所有复杂度要求
      priority: 80
      enabled: true
      tags:
        - password
        - security
      children:
        - id: password_length
          name: 密码长度
          type: length
          params:
            field: password
            max: 50
            min: 8
        - id: password_uppercase
          name: 密码大写字母
          type: regex
          params:
            field: password
            pattern: '[A-Z]'
        - id: password_lowercase
          name: 密码小写字母
          type: regex
          params:
            field: password
            pattern: '[a-z]'
        - id: password_digit
          name: 密码数字
          type: regex
          params:
            field: password
            pattern: '[0-9]'
    - id: age_range
      name: 年龄范围验证
      type: range
      description: 用户年龄必须在13-120之间
      priority: 70
      enabled: true
      params:
        field: age
        max: 120
        min: 13
      tags:
        - basic
        - age
    - id: user_status_enum
      name: 用户状态验证
      type: enum
      description: 用户状态必须是有效值
      priority: 60
      enabled: true
      params:
        field: status
        values:
            - active
            - inactive
            - pending
            - suspended
      tags:
        - basic
        - status
    - id: admin_permission_check
      name: 管理员权限验证
      type: conditional
      description: 如果用户是管理员，需要额外验证权限
      priority: 50
      enabled: true
      tags:
        - conditional
        - admin
      conditions:
        - type: equals
          field: role
          value: admin
      children:
        - id: admin_permissions_required
          name: 管理员权限必填
          type: required
          params:
            fields:
                - permissions
                - admin_level
    - id: premium_user_validation
      name: Premium用户验证
      type: conditional
      description: Premium用户需要额外验证
      priority: 45
      enabled: true
      tags:
        - conditional
        - premium
      conditions:
        - type: equals
          field: account_type
          value: premium
      children:
        - id: premium_info_required
          name: Premium用户信息
          type: and
          children:
            - id: premium_phone
              name: Premium手机号
              type: required
              params:
                fields:
                    - phone
            - id: premium_phone_format
              name: 手机号格式
              type: regex
              params:
                field: phone
                pattern: ^\d{11}$
    - id: username_uniqueness
      name: 用户名唯一性验证
      type: async
      description: 检查用户名是否已被使用
      priority: 30
      enabled: true
      tags:
        - async
        - uniqueness
      async:
        timeout: 5s
        retries: 2
        retry_delay: 1s
        table: users
        field: username
    - id: email_uniqueness
      name: 邮箱唯一性验证
      type: async
      description: 检查邮箱是否已被注册
      priority: 25
      enabled: true
      tags:
        - async
        - uniqueness
      async:
        timeout: 3s
        retries: 1
        retry_delay: 500ms
        table: users
        field: email
    - id: username_not_reserved
      name: 用户名非保留验证
      type: not
      description: 用户名不能是系统保留词
      priority: 75
      enabled: true
      tags:
        - security
        - reserved
      children:
        - id: reserved_usernames
          name: 保留用户名列表
          type: enum
          params:
            field: username
            values:
                - admin
                - root
                - administrator
                - system
                - api
                - www
                - ftp
                - mail
    - id: contact_info_validation
      name: 联系方式验证
      type: or
      description: 用户必须提供邮箱或手机号之一
      priority: 65
      enabled: true
      tags:
        - contact
        - flexible
      children:
        - id: email_contact
          name: 邮箱联系方式
          type: and
          children:
            - id: email_exists
              name: 邮箱字段存在
              type: required
              params:
                fields:
                    - email
            - id: email_valid
              name: 邮箱格式有效
              type: email
              params:
                field: email
        - id: phone_contact
          name: 手机联系方式
          type: and
          children:
            - id: phone_exists
              name: 手机字段存在
              type: required
              params:
                fields:
                    - phone
            - id: phone_valid
              name: 手机格式有效
              type: regex
              params:
                field: phone
                pattern: ^\d{11}$
    - id: birthdate_validation
      name: 出生日期验证
      type: date
      description: 验证出生日期格式和合理性
      priority: 55
      params:
        after: "1900-01-01"
        before: "2010-01-01"
        field: birthdate
        format: "2006-01-02"
      tags:
        - date
        - optional
pipelines:
    - id: user_registration_pipeline
      name: 用户注册验证管道
      description: 用户注册时的完整验证流程
      stages:
        - id: basic_validation_stage
          name: 基础验证阶段
          description: 验证基础必填字段和格式
          order: 1
          rule_ids:
            - user_required_fields
            - username_length
            - username_format
            - email_format
            - age_range
        - id: security_validation_stage
          name: 安全验证阶段
          description: 验证密码复杂度和安全规则
          order: 2
          rule_ids:
            - password_complexity
            - username_not_reserved
          dependencies:
            - basic_validation_stage
        - id: business_validation_stage
          name: 业务规则验证阶段
          description: 验证业务逻辑规则
          order: 3
          rule_ids:
            - user_status_enum
            - contact_info_validation
            - admin_permission_check
            - premium_user_validation
          dependencies:
            - security_validation_stage
        - id: async_validation_stage
          name: 异步验证阶段
          description: 执行异步验证（唯一性检查等）
          order: 4
          rule_ids:
            - username_uniqueness
            - email_uniqueness
          dependencies:
            - business_validation_stage
          timeout: 10s
    - id: user_update_pipeline
      name: 用户更新验证管道
      description: 用户信息更新时的验证流程
      stages:
        - id: update_basic_validation
          name: 更新基础验证
          description: 验证更新字段的基本规则
          order: 1
          rule_ids:
            - username_length
            - username_format
            - email_format
            - age_range
        - id: update_advanced_validation
          name: 更新高级验证
          description: 条件验证和唯一性检查
          order: 2
          rule_ids:
            - admin_permission_check
            - premium_user_validation
            - username_uniqueness
            - email_uniqueness
          dependencies:
            - update_basic_validation
