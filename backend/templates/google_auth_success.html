<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google日历连接成功</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            margin: 20px;
        }
        .success-icon {
            width: 80px;
            height: 80px;
            background: #52c41a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
            color: white;
        }
        h1 {
            color: #262626;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }
        .message {
            color: #595959;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .calendar-info {
            background: #f6f8fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .calendar-count {
            font-size: 24px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 8px;
        }
        .calendar-label {
            color: #8c8c8c;
            font-size: 14px;
        }
        .close-button {
            background: #1890ff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .close-button:hover {
            background: #40a9ff;
        }
        .google-logo {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">
            ✓
        </div>
        
        <h1>
            <svg class="google-logo" viewBox="0 0 24 24">
                <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google日历连接成功！
        </h1>
        
        <div class="message">
            {{.Message}}
        </div>
        
        <div class="calendar-info">
            <div class="calendar-count">{{.CalendarCount}}</div>
            <div class="calendar-label">个日历已授权访问</div>
        </div>
        
        <p class="message">
            您现在可以在AI项目管理平台中同步任务到Google日历，享受更便捷的时间管理体验。
        </p>
        
        <button class="close-button" onclick="closeWindow()">
            返回应用
        </button>
    </div>

    <script>
        function closeWindow() {
            // 尝试关闭窗口，如果不能关闭则重定向到主页
            try {
                window.close();
            } catch (e) {
                window.location.href = '/';
            }
            
            // 给父窗口发送消息（如果在弹窗中打开）
            if (window.opener) {
                window.opener.postMessage({
                    type: 'GOOGLE_AUTH_SUCCESS',
                    data: {
                        calendarCount: {{.CalendarCount}},
                        message: '{{.Message}}'
                    }
                }, '*');
                window.close();
            }
        }

        // 页面加载完成后自动关闭（可选）
        setTimeout(() => {
            // 5秒后自动提示用户
            const button = document.querySelector('.close-button');
            button.style.animation = 'pulse 1s infinite';
        }, 5000);
    </script>

    <style>
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</body>
</html>
