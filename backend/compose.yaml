services:
  db:
    image: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}postgres:16
    container_name: ai-db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-main_db}
    ports:
      - "55432:5432"  # Map container 5432 to host 55432 to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-main_db} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    image: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}postgres:16
    container_name: ai-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
      DB_USER: ${DB_USER:-user}
      DB_NAME: ${DB_NAME:-main_db}
      MIGRATION_MODE: ${MIGRATION_MODE:-core}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -lc
      - |
        set -euo pipefail
        export PGPASSWORD=${DB_PASSWORD:-password}
        # wait for db readiness
        until psql -h db -U "${DB_USER:-user}" -d "${DB_NAME:-main_db}" -c 'SELECT 1' >/dev/null 2>&1; do
          echo "Waiting for db..."; sleep 1; done
        # preflight: extensions and minimal users table for FKs used by some migrations
        psql -v ON_ERROR_STOP=1 -h db -U "${DB_USER:-user}" -d "${DB_NAME:-main_db}" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        psql -v ON_ERROR_STOP=1 -h db -U "${DB_USER:-user}" -d "${DB_NAME:-main_db}" -c "CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY, username VARCHAR(255));"
        # apply migrations in sorted order (robust to empty set) - escape $ to avoid Compose var-substitution
        MODE="${MIGRATION_MODE:-core}"
        if [ "$$MODE" = "core" ]; then
          # Core migrations needed for timers only
          CORE_LIST="004_create_core_entities.sql 004b_alter_users_base.sql 005a_add_tasks_parent_hierarchy.sql 006_unified_timer_system.sql 022_task_descendants_indexes.sql 025_timer_family_mutex.sql 073_create_okr_progress_logs.sql"
          for name in $$CORE_LIST; do
            f="/migrations/$$name"
            if [ -f "$$f" ]; then
              echo "Applying $$f (core)";
              psql -v ON_ERROR_STOP=1 -h db -U "${DB_USER:-user}" -d "${DB_NAME:-main_db}" -f "$$f";
            else
              echo "[warn] Core migration not found: $$f"
            fi
          done
        else
          FILES="$(find /migrations -maxdepth 1 -type f -name '*.sql' | sort)"
          if [ -z "$$FILES" ]; then
            echo "No SQL migrations found under /migrations"
          else
            for f in $$FILES; do
              name=$(basename "$$f")
              case "$$name" in 
                004_enhance_projects.sql)
                  echo "Skipping $$name (conflicts with fixed variant)";;
                005_document_management_system.sql)
                  echo "Skipping $$name (conflicts with redesigned document system)";;
                *)
                  echo "Applying $$f";
                  psql -v ON_ERROR_STOP=1 -h db -U "${DB_USER:-user}" -d "${DB_NAME:-main_db}" -f "$$f";;
              esac
            done
          fi
        fi

  backend:
    build:
      context: .
      target: production
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}
    container_name: ai-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    restart: unless-stopped

  prisma:
    image: ${REGISTRY_PREFIX:-mirror.gcr.io/library/}node:20-alpine
    container_name: ai-prisma
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DB_SOURCE:-postgresql://user:password@db:5432/main_db?sslmode=disable}
    volumes:
      - .:/app
    command:
      - sh
      - -lc
      - |
        set -e
        # keep container alive; do not install full deps here
        tail -f /dev/null

volumes:
  db_data: {}
