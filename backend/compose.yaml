version: "3.9"
services:
  db:
    image: postgres:16
    container_name: ai-db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-main_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-main_db} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    container_name: ai-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
      DB_USER: ${DB_USER:-user}
      DB_NAME: ${DB_NAME:-main_db}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        set -o pipefail
        for f in /migrations/*.sql; do
          if [ -f "$f" ]; then
            echo "Applying $f";
            psql -h db -U "$DB_USER" -d "$DB_NAME" -f "$f";
          fi
        done

  backend:
    build:
      context: .
      target: production
    container_name: ai-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data: {}

