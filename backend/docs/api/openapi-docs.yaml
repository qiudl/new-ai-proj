openapi: 3.0.3
info:
  title: AI项目管理平台 - 文档管理API
  version: 1.0.1
  description: 文档管理API（完整），包含归档/解归档、列表过滤等
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
paths:
  /documents:
    get:
      summary: 获取文档列表
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: visibility
          schema: { type: string }
        - in: query
          name: archived
          schema: { type: boolean }
          description: 是否仅返回已归档文档
      responses:
        '200':
          description: 成功
  /documents/{id}/archive:
    post:
      summary: 文档归档
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '200':
          description: 归档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveActionResponse'
  /documents/{id}/unarchive:
    post:
      summary: 文档解归档
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '200':
          description: 解归档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveActionResponse'
components:
  schemas:
    ArchiveRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    ArchiveActionResponse:
      type: object
      properties:
        document_id: { type: integer }
        archived: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_by: { type: integer, nullable: true }
        unarchived_at: { type: string, format: date-time, nullable: true }
        unarchived_by: { type: integer, nullable: true }

