openapi: 3.0.3
info:
  title: AI项目管理平台 - 文档管理API
  version: 1.0.1
  description: 文档管理API，包括归档/解归档等端点
servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
paths:
  /projects/{project_id}/tasks/{task_id}/documents/{document_id}/archive:
    post:
      summary: 文档归档
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: integer }
        - in: path
          name: task_id
          required: true
          schema: { type: integer }
        - in: path
          name: document_id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '200':
          description: 归档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveActionResponse'
  /projects/{project_id}/tasks/{task_id}/documents/{document_id}/unarchive:
    post:
      summary: 文档解归档
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: integer }
        - in: path
          name: task_id
          required: true
          schema: { type: integer }
        - in: path
          name: document_id
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '200':
          description: 解归档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveActionResponse'
  /documents:
    get:
      summary: 获取文档列表
      parameters:
        - in: query
          name: archived
          required: false
          schema: { type: boolean }
          description: 是否仅返回已归档文档
      responses:
        '200': { description: 成功 }
components:
  schemas:
    ArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: 归档/解归档原因
    ArchiveActionResponse:
      type: object
      properties:
        document_id: { type: integer }
        title: { type: string }
        version: { type: integer }
        archived: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        archived_by: { type: integer, nullable: true }
        unarchived_at: { type: string, format: date-time, nullable: true }
        unarchived_by: { type: integer, nullable: true }

