  /system/enterprises/{enterprise_id}/users/{user_id}:
    delete:
      consumes:
      - application/json
      description: |-
        系统管理员从指定企业中移除用户(软删除),不能移除主要联系人
        此操作会记录审计日志,被移除的用户仍可通过回收站恢复
      parameters:
      - description: 企业ID
        in: path
        name: enterprise_id
        required: true
        type: integer
      - description: 用户ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 移除成功,返回用户信息
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误 - 无效ID/用户不属于企业/不能移除主要联系人
          schema:
            additionalProperties: true
            type: object
        "401":
          description: 未认证 - Token缺失或无效
          schema:
            additionalProperties: true
            type: object
        "403":
          description: 权限不足 - 需要system.enterprise.manage_users权限
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 资源不存在 - 企业或用户不存在
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器错误 - 数据库操作失败
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 从企业移除用户
      tags:
      - System - Enterprise Management
