host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI项目管理后端API服务，提供项目管理、任务管理、文档生成等功能
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AI Project Backend API
  version: "1.0"
paths:
  /admin/tasks/{taskId}/project:
    put:
      consumes:
      - application/json
      description: Change the project that a task belongs to (System administrators
        only)
      parameters:
      - description: Task ID
        in: path
        name: taskId
        required: true
        type: integer
      - description: Update task project request
        in: body
        name: request
        required: true
        schema:
          properties:
            new_project_id:
              type: integer
            reason:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Task project updated successfully
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.APIResponse'
        "403":
          description: Forbidden - System admin only
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Task or project not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.APIResponse'
      security:
      - BearerAuth: []
      summary: Update task project
      tags:
      - system-admin
      - tasks
  /api/tasks/{id}/comments:
    get:
      consumes:
      - application/json
      description: 获取指定任务的评论列表（分页）
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ListTaskCommentsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务评论列表
      tags:
      - TaskComments
    post:
      consumes:
      - application/json
      description: 为指定任务添加评论
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateTaskCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TaskComment'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建任务评论
      tags:
      - TaskComments
  /api/tasks/{id}/comments/{commentId}:
    delete:
      consumes:
      - application/json
      description: 删除指定的评论（仅作者或管理员可删除）
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除评论
      tags:
      - TaskComments
  /api/tasks/{id}/comments/stats:
    get:
      consumes:
      - application/json
      description: 获取任务的评论数量、参与人数等统计信息
      parameters:
      - description: 任务ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TaskCommentStats'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取任务评论统计
      tags:
      - TaskComments
  /api/v1/ai/document-templates:
    get:
      description: 获取所有可用的文档生成模板
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 获取文档模板
      tags:
      - AI
  /api/v1/ai/document-types:
    get:
      description: 获取所有支持的文档类型及其说明
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 获取文档类型信息
      tags:
      - AI
  /api/v1/ai/generate-document:
    post:
      consumes:
      - application/json
      description: 使用AI为指定任务生成技术文档
      parameters:
      - description: 生成文档请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.GenerateDocumentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GenerateDocumentResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 生成文档
      tags:
      - AI
  /api/v1/ai/save-document:
    post:
      consumes:
      - application/json
      description: 将AI生成的文档保存为任务文档
      parameters:
      - description: 保存文档请求
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: 保存文档到任务
      tags:
      - AI
  /api/v1/api-keys:
    get:
      description: Get a paginated list of API keys with optional filtering
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20, max: 100)'
        in: query
        name: page_size
        type: integer
      - description: Search in name and description
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - description: Filter by creator user ID
        in: query
        name: created_by
        type: integer
      - description: Filter by expiration status
        in: query
        name: has_expired
        type: boolean
      - description: Sort by field (name, created_at, last_used_at, usage_count)
        in: query
        name: sort_by
        type: string
      - description: Sort order (asc, desc)
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APIKeyListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Create a new API key with specified permissions and restrictions
      parameters:
      - description: API key creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.APIKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APIKeyCreateResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create API key
      tags:
      - api-keys
