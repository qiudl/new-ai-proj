<!DOCTYPE html>
<html>
<head>
    <title>测试推荐功能</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 前端推荐功能调试</h1>
    
    <div class="section">
        <h2>测试结果</h2>
        <div id="results">正在测试...</div>
    </div>

    <script>
        async function testRecommendations() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p class="info">开始测试...</p>';
            
            try {
                // 1. 获取token
                resultsDiv.innerHTML += '<p class="info">1. 获取认证token...</p>';
                
                const authResponse = await fetch('http://localhost:8081/api/v1/auth/dev/quick-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({username: 'admin'})
                });
                
                const authData = await authResponse.json();
                if (!authData.success) {
                    throw new Error('获取token失败');
                }
                
                const token = authData.data.access_token;
                resultsDiv.innerHTML += '<p class="success">✅ Token获取成功</p>';
                
                // 2. 测试推荐API
                resultsDiv.innerHTML += '<p class="info">2. 调用推荐API...</p>';
                
                const apiResponse = await fetch('http://localhost:8081/api/v1/daily-focus-tasks/recommendations?limit=5', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const apiData = await apiResponse.json();
                resultsDiv.innerHTML += '<p class="success">✅ API调用成功</p>';
                
                // 3. 分析API响应
                resultsDiv.innerHTML += '<p class="info">3. 分析API响应结构...</p>';
                resultsDiv.innerHTML += `<pre>API原始响应:\n${JSON.stringify(apiData, null, 2)}</pre>`;
                
                // 4. 模拟前端API拦截器处理
                resultsDiv.innerHTML += '<p class="info">4. 模拟前端API拦截器处理...</p>';
                
                let processedData;
                if (apiData && typeof apiData === 'object' && 'success' in apiData && 'data' in apiData) {
                    processedData = apiData.data; // 这是API拦截器的逻辑
                    resultsDiv.innerHTML += '<p class="success">✅ API拦截器解包: 提取data字段</p>';
                } else {
                    processedData = apiData;
                    resultsDiv.innerHTML += '<p class="info">📝 API拦截器: 无需解包</p>';
                }
                
                resultsDiv.innerHTML += `<pre>拦截器处理后:\n${JSON.stringify(processedData, null, 2)}</pre>`;
                
                // 5. 模拟前端服务处理
                resultsDiv.innerHTML += '<p class="info">5. 模拟前端服务 getRecommendations() 处理...</p>';
                
                let tasks = [];
                if (processedData && processedData.suggestions && Array.isArray(processedData.suggestions)) {
                    tasks = processedData.suggestions.map(suggestion => suggestion.task).filter(Boolean);
                    resultsDiv.innerHTML += `<p class="success">✅ 前端服务提取到 ${tasks.length} 个任务</p>`;
                } else {
                    resultsDiv.innerHTML += '<p class="error">❌ 前端服务无法提取任务</p>';
                }
                
                if (tasks.length > 0) {
                    resultsDiv.innerHTML += '<p class="info">📋 提取的任务列表:</p>';
                    tasks.forEach((task, index) => {
                        resultsDiv.innerHTML += `<p>  ${index + 1}. #${task.id} ${task.title}</p>`;
                    });
                } else {
                    resultsDiv.innerHTML += '<p class="error">❌ 没有有效的任务数据</p>';
                }
                
                // 6. 结论
                resultsDiv.innerHTML += '<hr><h3>🎯 结论</h3>';
                if (tasks.length > 0) {
                    resultsDiv.innerHTML += '<p class="success">✅ 推荐功能应该正常工作，前端应该能显示推荐任务</p>';
                    resultsDiv.innerHTML += '<p class="info">如果前端UI没有显示推荐任务，问题可能在于:</p>';
                    resultsDiv.innerHTML += '<ul>';
                    resultsDiv.innerHTML += '<li>React组件没有正确使用recommendations数据</li>';
                    resultsDiv.innerHTML += '<li>组件的条件渲染逻辑有问题</li>';
                    resultsDiv.innerHTML += '<li>CSS样式问题导致不可见</li>';
                    resultsDiv.innerHTML += '<li>Hook中的loadRecommendations没有被正确调用</li>';
                    resultsDiv.innerHTML += '</ul>';
                } else {
                    resultsDiv.innerHTML += '<p class="error">❌ 推荐功能存在数据处理问题</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML += `<p class="error">❌ 测试失败: ${error.message}</p>`;
                console.error('Test error:', error);
            }
        }
        
        // 页面加载后自动运行测试
        window.onload = testRecommendations;
    </script>
</body>
</html>
