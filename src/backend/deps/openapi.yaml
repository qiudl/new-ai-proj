openapi: 3.0.3
info:
  title: Task Dependencies API
  version: 0.1.0
servers:
  - url: /api
paths:
  /tasks/{taskId}/dependencies:
    get:
      summary: List dependencies related to a task (outbound/inbound/both)
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: query
          name: direction
          schema: { type: string, enum: [outbound, inbound, both], default: both }
        - in: query
          name: relationType
          schema: { type: string, enum: [FS, SS, FF, SF] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Dependency' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Create dependency from taskId -> to_task_id
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyCreate'
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{taskId}/dependencies/{depId}:
    patch:
      summary: Update dependency attributes
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: path
          name: depId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyUpdate' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete dependency
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: integer }
        - in: path
          name: depId
          required: true
          schema: { type: integer }
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
  /dependencies:batch:
    post:
      summary: Batch create/delete dependencies
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DependencyBatch' }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  schemas:
    Dependency:
      type: object
      properties:
        id: { type: integer }
        from_task_id: { type: integer }
        to_task_id: { type: integer }
        relation_type: { type: string, enum: [FS, SS, FF, SF] }
        lag_minutes: { type: integer, minimum: 0 }
        is_blocking: { type: boolean }
        note: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DependencyCreate:
      type: object
      required: [to_task_id, relation_type]
      properties:
        to_task_id: { type: integer }
        relation_type: { type: string, enum: [FS, SS, FF, SF] }
        lag_minutes: { type: integer, minimum: 0, default: 0 }
        is_blocking: { type: boolean, default: true }
        note: { type: string }
    DependencyUpdate:
      type: object
      properties:
        relation_type: { type: string, enum: [FS, SS, FF, SF] }
        lag_minutes: { type: integer, minimum: 0 }
        is_blocking: { type: boolean }
        note: { type: string }
    DependencyBatch:
      type: object
      properties:
        create:
          type: array
          items: { $ref: '#/components/schemas/DependencyCreateBatchItem' }
        delete:
          type: array
          items: { type: integer, description: 'Dependency IDs' }
    DependencyCreateBatchItem:
      type: object
      required: [from_task_id, to_task_id, relation_type]
      properties:
        from_task_id: { type: integer }
        to_task_id: { type: integer }
        relation_type: { type: string, enum: [FS, SS, FF, SF] }
        lag_minutes: { type: integer, minimum: 0, default: 0 }
        is_blocking: { type: boolean, default: true }
        note: { type: string }
  responses:
    OK: { description: OK }
    Created: { description: Created }
    BadRequest: { description: Invalid parameters or business rule violation }
    Conflict: { description: Resource conflict (unique constraint / cycle / self-dep) }
    NotFound: { description: Task or dependency not found }

