version: '3.8'

services:
  # PostgreSQL 生产数据库
  postgres-prod:
    image: postgres:16
    container_name: ai_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      # 生产环境配置
      POSTGRES_SHARED_PRELOAD_LIBRARIES: pg_stat_statements
    ports:
      - "127.0.0.1:5432:5432"  # 仅本地访问
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./infrastructure/docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 最多使用2个CPU核心
          memory: 2048M    # 最大内存2GB
        reservations:
          cpus: '1.0'      # 保留1个CPU核心
          memory: 512M     # 保留512MB内存
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai_prod_network
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"    # 单个日志文件最大50MB
        max-file: "5"      # 保留5个日志文件（总计250MB）
        compress: "true"   # 压缩旧日志文件

  # Go 后端服务
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: ai_backend_prod
    depends_on:
      postgres-prod:
        condition: service_healthy
    environment:
      ENV: production
      NODE_ENV: production
      APP_ENV: production
      DB_HOST: ai_postgres_prod  # 使用容器名
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 24h
      GIN_MODE: release
      LOG_LEVEL: info
      CORS_ORIGIN: https://${DOMAIN_NAME}
      # 禁用代理（防止healthcheck失败）
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    ports:
      - "127.0.0.1:8080:8080"  # 仅本地访问
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./config:/app/config
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 最多使用2个CPU核心
          memory: 1024M    # 最大内存1GB
        reservations:
          cpus: '0.5'      # 保留0.5个CPU核心
          memory: 256M     # 保留256MB内存
    healthcheck:
      test: ["CMD-SHELL", "wget --no-proxy -O- -q http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai_prod_network
    # 日志轮转配置（优化）
    logging:
      driver: "json-file"
      options:
        max-size: "100m"   # 单个日志文件最大100MB
        max-file: "5"      # 保留5个日志文件（总计500MB）
        compress: "true"   # 压缩旧日志文件

  # React 前端服务
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ai_frontend_prod
    environment:
      REACT_APP_API_URL: https://${DOMAIN_NAME}/api/v1
      REACT_APP_API_BASE_URL: https://${DOMAIN_NAME}/api/v1
      REACT_APP_ENV: production
      REACT_APP_ENVIRONMENT: production
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:80"  # 仅本地访问
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'      # 最多使用1个CPU核心
          memory: 512M     # 最大内存512MB
        reservations:
          cpus: '0.25'     # 保留0.25个CPU核心
          memory: 128M     # 保留128MB内存
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    networks:
      - ai_prod_network
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"    # 单个日志文件最大50MB
        max-file: "3"      # 保留3个日志文件（总计150MB）
        compress: "true"   # 压缩旧日志文件

  # Redis 缓存
  redis-prod:
    image: redis:7-alpine
    container_name: ai_redis_prod
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    volumes:
      - redis_prod_data:/data
      - ./config/redis/redis-prod.conf:/etc/redis/redis.conf
    command: ["redis-server", "/etc/redis/redis.conf"]
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 最多使用0.5个CPU核心
          memory: 256M     # 最大内存256MB
        reservations:
          cpus: '0.1'      # 保留0.1个CPU核心
          memory: 64M      # 保留64MB内存
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - ai_prod_network
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "20m"    # 单个日志文件最大20MB
        max-file: "3"      # 保留3个日志文件（总计60MB）
        compress: "true"   # 压缩旧日志文件

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: ai_nginx
    depends_on:
      backend-prod:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./static:/var/www/static:ro
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'      # 最多使用1个CPU核心
          memory: 256M     # 最大内存256MB
        reservations:
          cpus: '0.25'     # 保留0.25个CPU核心
          memory: 64M      # 保留64MB内存
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai_prod_network
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"   # 单个日志文件最大100MB
        max-file: "10"     # 保留10个日志文件（总计1GB）
        compress: "true"   # 压缩旧日志文件

  # MCP服务器 (生产环境 - SSE模式)
  mcp-server-prod:
    build:
      context: ./mcp-task-bridge
      dockerfile: Dockerfile.sse
    container_name: ai_mcp_server_prod
    environment:
      # API基础地址（使用容器名）
      API_BASE_URL: http://ai_backend_prod:8080/api/v1
      TASK_API_BASE: http://ai_backend_prod:8080/api/v1
      # SSE服务端口配置
      MCP_PORT: 3000
      PORT: 3000
      NODE_ENV: production
      APP_ENV: production
      # API Key认证
      API_KEY: ${MCP_API_KEY:-mcpsk_prod_fa6daea54c87dae43e37de30d7295d27}
      # MCP权限系统配置
      MCP_ENABLE_PERMISSIONS: "false"
      MCP_STRICT_PERMISSIONS: "false"
      MCP_DEBUG_PERMISSIONS: "false"
    ports:
       - "0.0.0.0:3100:3000"  # 主机3100端口映射到容器3000端口（通过nginx代理访问）
    restart: always
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'      # 最多使用0.5个CPU核心
          memory: 256M     # 最大内存256MB
        reservations:
          cpus: '0.1'      # 保留0.1个CPU核心
          memory: 64M      # 保留64MB内存
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - ai_prod_network
    # 日志轮转配置
    logging:
      driver: "json-file"
      options:
        max-size: "20m"    # 单个日志文件最大20MB
        max-file: "3"      # 保留3个日志文件（总计60MB）
        compress: "true"   # 压缩旧日志文件

networks:
  ai_prod_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local