# 生产环境 Docker Compose 配置
# 统一计时器系统 - 生产部署版本

services:
  # PostgreSQL数据库 - 生产优化
  postgres:
    image: postgres:16-alpine
    container_name: ai_project_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # 生产环境性能优化
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups:rw
      - ./backend/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "5432:5432"
    command: |
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai_project_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Go后端服务 - 生产构建
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        - CGO_ENABLED=0
        - GOOS=linux
        - GOARCH=amd64
    container_name: ai_project_backend_prod
    environment:
      - APP_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSL_MODE=prefer
      - DB_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-25}
      - DB_MIN_CONNECTIONS=${DB_MIN_CONNECTIONS:-5}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-168h}
      - GIN_MODE=release
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - SERVER_HOST=0.0.0.0
      - PORT=8080
      # 统一计时器生产配置
      - TIMER_MAX_CONCURRENT_SESSIONS=${TIMER_MAX_CONCURRENT_SESSIONS:-50}
      - TIMER_AUTO_STOP_TIMEOUT=${TIMER_AUTO_STOP_TIMEOUT:-8h}
      - TIMER_PAUSE_MAX_DURATION=${TIMER_PAUSE_MAX_DURATION:-24h}
      - TIMER_POLLING_INTERVAL=${TIMER_POLLING_INTERVAL:-30s}
      # 性能配置
      - GOMAXPROCS=${GOMAXPROCS:-4}
      - GOMEMLIMIT=${GOMEMLIMIT:-1GiB}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai_project_prod_network
    volumes:
      - ./logs:/app/logs:rw
      - ./backend/docs:/app/docs:rw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React前端服务 - 生产构建
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NODE_ENV=production
        - REACT_APP_API_URL=/api/v1
        - REACT_APP_ENV=production
        - REACT_APP_VERSION=${APP_VERSION:-1.0.0}
        # 统一计时器前端配置
        - REACT_APP_TIMER_POLLING_INTERVAL=${REACT_APP_TIMER_POLLING_INTERVAL:-30000}
        - REACT_APP_TIMER_LOCAL_SYNC_INTERVAL=${REACT_APP_TIMER_LOCAL_SYNC_INTERVAL:-1000}
        - REACT_APP_TIMER_OFFLINE_MODE=${REACT_APP_TIMER_OFFLINE_MODE:-true}
    container_name: ai_project_frontend_prod
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai_project_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Nginx反向代理 - 生产配置
  nginx:
    image: nginx:alpine
    container_name: ai_project_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - backend
      - frontend
    environment:
      - NGINX_WORKER_PROCESSES=${NGINX_WORKER_PROCESSES:-auto}
      - NGINX_WORKER_CONNECTIONS=${NGINX_WORKER_CONNECTIONS:-1024}
      - NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-64m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai_project_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Redis缓存 - 统一计时器缓存
  redis:
    image: redis:7-alpine
    container_name: ai_project_redis_prod
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai_project_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Prometheus 监控 (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_project_prometheus_prod
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - ai_project_prod_network
    profiles:
      - monitoring

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  ai_project_prod_network:
    driver: bridge