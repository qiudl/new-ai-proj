# Docker Compose 生产环境配置
# 用于腾讯云服务器部署

services:
  # PostgreSQL 生产数据库
  postgres:
    image: postgres:16
    container_name: ai_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/01-init-prod.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai_prod_network

  # Go 后端服务
  backend:
    image: your-dockerhub-username/ai-project-app-backend:latest
    container_name: ai_backend_prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 数据库配置
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SOURCE: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      
      # 应用配置
      ENV: production
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      
      # Redis配置
      REDIS_URL: redis://redis:6379
      
      # 其他生产配置
      GIN_MODE: release
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - ./backend/logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    networks:
      - ai_prod_network

  # React 前端服务
  frontend:
    image: your-dockerhub-username/ai-project-app-frontend:latest
    container_name: ai_frontend_prod
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: /api/v1
      REACT_APP_ENV: production
      REACT_APP_ENVIRONMENT: production
    ports:
      - "3000:80"  # Nginx在容器内使用80端口
    restart: unless-stopped
    networks:
      - ai_prod_network

  # MCP服务器
  mcp-server:
    image: your-dockerhub-username/ai-project-app-mcp:latest
    container_name: ai_mcp_prod
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8080/api/v1
      PORT: 3001
    ports:
      - "3100:3001"
    restart: unless-stopped
    networks:
      - ai_prod_network

  # Redis (缓存和会话存储)
  redis:
    image: redis:7-alpine
    container_name: ai_redis_prod
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
      - ./docker/redis/redis-prod.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_prod_network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: ai_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_prod_network

# 网络配置
networks:
  ai_prod_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# 数据卷
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local