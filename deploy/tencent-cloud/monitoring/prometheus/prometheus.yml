# Prometheus 配置文件

global:
  scrape_interval: 15s           # 默认抓取间隔
  evaluation_interval: 15s       # 规则评估间隔
  scrape_timeout: 10s           # 抓取超时时间
  
  # 为所有时间序列和告警添加的外部标签
  external_labels:
    monitor: 'ai-project-monitor'
    environment: 'production'

# 告警规则文件配置
rule_files:
  - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Node Exporter - 系统指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # cAdvisor - 容器指标
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Nginx Exporter
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # 应用程序指标（需要应用集成 Prometheus metrics）
  - job_name: 'ai-project-app'
    static_configs:
      - targets: ['api:8080']
    scrape_interval: 15s
    metrics_path: '/api/v1/metrics'
    scrape_timeout: 10s
    # 健康检查
    params:
      module: [http_2xx]

  # Docker daemon 指标（如果启用了实验性指标）
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # AlertManager 指标
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    scrape_interval: 15s
    metrics_path: '/metrics'

  # Grafana 指标
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: '/metrics'

  # Loki 指标
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    scrape_interval: 15s
    metrics_path: '/metrics'

# AlertManager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      timeout: 10s
      api_version: v2

# 远程写入配置（可选，用于长期存储）
# remote_write:
#   - url: "http://remote-storage:8086/api/v1/prom/write"
#     queue_config:
#       max_samples_per_send: 1000
#       max_shards: 200
#       capacity: 2500

# 存储配置
storage:
  tsdb:
    retention.time: 30d
    retention.size: 10GB
    wal-compression: true