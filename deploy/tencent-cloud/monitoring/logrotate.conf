# 系统监控日志轮转配置
# /etc/logrotate.d/ai-project-monitoring

/var/log/system-monitor.log {
    daily                    # 每日轮转
    missingok               # 如果日志文件不存在，不报错
    rotate 30               # 保留30个备份文件
    compress                # 压缩旧日志文件
    delaycompress           # 延迟压缩，保留最近的日志文件不压缩
    notifempty             # 如果日志文件为空，不轮转
    sharedscripts          # 多个日志文件共享脚本
    copytruncate           # 复制文件内容后截断原文件
    dateext                # 使用日期作为后缀
    dateformat -%Y%m%d     # 日期格式
    maxage 30              # 删除30天以上的日志
    
    postrotate
        # 轮转后重新加载rsyslog服务
        /bin/kill -HUP `cat /var/run/rsyslogd.pid 2> /dev/null` 2> /dev/null || true
    endscript
}

/var/log/ai-project/*.log {
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    create 644 aiproject aiproject
    sharedscripts
    copytruncate
    dateext
    dateformat -%Y%m%d
    maxage 7
    
    postrotate
        # 发送USR1信号给应用进程重新打开日志文件
        if [ -f /opt/ai-project/app.pid ]; then
            kill -USR1 `cat /opt/ai-project/app.pid` || true
        fi
    endscript
}

/var/log/nginx/*.log {
    daily
    missingok
    rotate 52
    compress
    delaycompress
    notifempty
    create 644 www-data www-data
    sharedscripts
    
    postrotate
        if [ -f /var/run/nginx.pid ]; then
            kill -USR1 `cat /var/run/nginx.pid`
        fi
    endscript
}

# Docker容器日志清理
/var/lib/docker/containers/*/*.log {
    daily
    copytruncate
    rotate 3
    missingok
    notifempty
    compress
    maxsize 100M
}