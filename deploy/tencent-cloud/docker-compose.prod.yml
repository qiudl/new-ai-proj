version: '3.8'

networks:
  ai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  app_logs:
    driver: local
  ssl_certs:
    driver: local

services:
  # PostgreSQL 数据库
  postgres-prod:
    image: postgres:15-alpine
    container_name: ai_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_project_prod}
      POSTGRES_USER: ${POSTGRES_USER:-ai_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"  # 只允许本机访问
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_prod_user} -d ${POSTGRES_DB:-ai_project_prod}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Redis 缓存
  redis-prod:
    image: redis:7-alpine
    container_name: ai_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # 只允许本机访问
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Go 后端 API
  backend-prod:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: ai_backend_prod
    restart: always
    environment:
      # 应用配置
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_DEBUG: false
      APP_SECRET: ${APP_SECRET}
      
      # 数据库配置
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ai_project_prod}
      DB_USER: ${POSTGRES_USER:-ai_prod_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Shanghai
      
      # Redis配置
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      
      # JWT配置
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 24h
      
      # 文件上传
      UPLOAD_PATH: /app/uploads
      MAX_UPLOAD_SIZE: 10485760  # 10MB
      
      # 日志配置
      LOG_LEVEL: info
      LOG_FORMAT: json
      
      # CORS配置
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yourdomain.com}
    volumes:
      - ./uploads:/app/uploads
      - app_logs:/app/logs
    ports:
      - "127.0.0.1:8080:8080"  # 只允许本机访问
    networks:
      - ai-network
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # React 前端
  frontend-prod:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-https://yourdomain.com/api/v1}
        REACT_APP_APP_NAME: ${REACT_APP_APP_NAME:-AI项目管理系统}
        REACT_APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: ai_frontend_prod
    restart: always
    ports:
      - "127.0.0.1:3000:80"  # 只允许本机访问
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx 反向代理
  nginx-prod:
    image: nginx:1.24-alpine
    container_name: ai_nginx_prod
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ssl_certs:/etc/ssl/certs
      - nginx_logs:/var/log/nginx
      - ./static:/var/www/static:ro  # 静态文件
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-network
    depends_on:
      - backend-prod
      - frontend-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  # 日志收集器 (可选)
  logrotate:
    image: linkyard/docker-logrotate
    container_name: ai_logrotate
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - app_logs:/logs
    environment:
      LOGROTATE_CONF: |
        /logs/*.log {
          daily
          missingok
          rotate 30
          compress
          delaycompress
          copytruncate
          notifempty
          create 0644 root root
        }
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # 健康检查和监控
  watchtower:
    image: containrrr/watchtower
    container_name: ai_watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_POLL_INTERVAL: 86400  # 24小时检查一次
      WATCHTOWER_INCLUDE_STOPPED: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'