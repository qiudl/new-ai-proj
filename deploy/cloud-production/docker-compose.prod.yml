# AI项目管理平台 - 腾讯云生产环境配置
# 服务器: 152.136.104.251
# 用于生产环境部署

version: '3.8'

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
    container_name: ai-project-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - REACT_APP_ENV=production
      - REACT_APP_ENVIRONMENT=production
      - REACT_APP_API_BASE_URL=https://api.ai-project.com/api/v1
      - GENERATE_SOURCEMAP=false
    volumes:
      # SSL证书挂载点
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ai-project-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
    container_name: ai-project-backend-prod
    environment:
      - GIN_MODE=release
      - LOG_LEVEL=error
      - DATABASE_URL=${PROD_DATABASE_URL}
      - JWT_SECRET=${PROD_JWT_SECRET}
      - CORS_ORIGINS=https://ai-project.com
      - GOOGLE_CLIENT_ID=${PROD_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${PROD_GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=https://api.ai-project.com/auth/google/callback
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - ai-project-network

  db:
    image: postgres:15-alpine
    container_name: ai-project-db-prod
    environment:
      - POSTGRES_DB=${PROD_DB_NAME:-ai_project_prod}
      - POSTGRES_USER=${PROD_DB_USER:-prod_user}
      - POSTGRES_PASSWORD=${PROD_DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ai-project-network
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=1GB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100

  redis:
    image: redis:7-alpine
    container_name: ai-project-redis-prod
    command: redis-server --requirepass ${PROD_REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    restart: unless-stopped
    networks:
      - ai-project-network

  nginx:
    image: nginx:alpine
    container_name: ai-project-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - ai-project-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  ai-project-network:
    driver: bridge