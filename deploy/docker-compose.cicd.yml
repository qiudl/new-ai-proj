# Docker Compose for CI/CD Production Deployment
# 此文件将被部署到服务器: /opt/ai-project-cicd/shared/env/docker-compose.prod.yml

version: '3.8'

services:
  # ================================================
  # Backend Service
  # ================================================
  backend:
    image: ai-backend:latest
    container_name: ai-backend-cicd
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database
      - DB_HOST=${DB_HOST:-postgres-master}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-ai_project_db}

      # Server
      - PORT=8080
      - APP_ENV=production
      - LOG_LEVEL=info

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}

      # Features
      - FEATURE_SUPERADMIN_ENABLE=true
      - SUPER_ADMIN_USERNAMES=${SUPER_ADMIN_USERNAMES:-admin}

      # Redis (optional)
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}

    volumes:
      - /opt/ai-project-cicd/shared/logs/backend:/app/logs
      - /opt/ai-project-cicd/shared/data/backend:/app/data

    networks:
      - ai-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    depends_on:
      - postgres-master

  # ================================================
  # Frontend Service
  # ================================================
  frontend:
    image: ai-frontend:latest
    container_name: ai-frontend-cicd
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=https://proj.joylodging.com/api/v1
      - REACT_APP_ENV=production

    volumes:
      - /opt/ai-project-cicd/shared/logs/frontend:/var/log/nginx

    networks:
      - ai-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ================================================
  # PostgreSQL Master (Primary Database)
  # ================================================
  postgres-master:
    image: postgres:16-alpine
    container_name: postgres-master-cicd
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-ai_project_db}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /opt/ai-project-cicd/shared/logs/postgres:/var/log/postgresql

    networks:
      - ai-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # ================================================
  # Redis Cache (Optional)
  # ================================================
  redis:
    image: redis:7-alpine
    container_name: redis-cicd
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes

    volumes:
      - redis-data:/data
      - /opt/ai-project-cicd/shared/logs/redis:/var/log/redis

    networks:
      - ai-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ================================================
  # Nginx Reverse Proxy (Optional)
  # ================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-cicd
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/ai-project-cicd/shared/env/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/ai-project-cicd/shared/env/ssl:/etc/nginx/ssl:ro
      - /opt/ai-project-cicd/shared/logs/nginx:/var/log/nginx

    networks:
      - ai-network

    depends_on:
      - backend
      - frontend

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ================================================
# Networks
# ================================================
networks:
  ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ================================================
# Volumes
# ================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
