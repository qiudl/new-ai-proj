# version: '3.8'  # Version is now optional in newer Docker Compose

# 开发环境配置 - 用于本地开发
# 使用方式: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: postgres_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-main_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-main_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Go Backend API
  backend:
    image: golang:1.24-alpine
    container_name: go_backend_dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_SOURCE=postgresql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-main_db}?sslmode=disable
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-main_db}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - JWT_EXPIRATION=168h
      - GIN_MODE=${GIN_MODE:-debug}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - GOOGLE_CALENDAR_SCOPES=${GOOGLE_CALENDAR_SCOPES}
      - GOPROXY=https://goproxy.cn,direct
    volumes:
      - ./backend:/app:delegated
      - go_mod_cache_dev:/go/pkg/mod
      - ./backend/docs:/app/docs:rw
    working_dir: /app
    command: sh -c "go mod download && go run main.go"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # React Frontend - 开发环境配置
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      target: development

    container_name: react_frontend_dev
    ports:
      - "${FRONTEND_PORT:-3001}:3000"  # 开发环境使用 3001 端口
    environment:
      - REACT_APP_API_URL=/api/v1
      - REACT_APP_ENV=development
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_LOCAL_DEV=true  # 设置为 true 显示绿色"开发环境"标志
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_HOST=localhost
      - WDS_SOCKET_PORT=3001
      - WDS_SOCKET_PATH=/ws
      - GENERATE_SOURCEMAP=true  # 开发环境启用 sourcemap
      - TSC_COMPILE_ON_ERROR=true
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules_dev:/app/node_modules
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy - 开发环境配置
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy_dev
    ports:
      - "8000:80"  # 开发环境使用 8000 端口，避免与测试环境冲突
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data_dev:
  go_mod_cache_dev:
  frontend_node_modules_dev: