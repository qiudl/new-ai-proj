# Docker Compose 开发环境配置
# 专为本机Docker开发环境设计，支持PostgreSQL主从复制

services:
  # PostgreSQL 主数据库 (Docker内)
  postgres-master:
    image: postgres:16
    container_name: ai_postgres_master
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password_2024
      POSTGRES_DB: ai_project_db
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      # 复制相关环境变量
      POSTGRES_REPLICATION_USER: repl_user
      POSTGRES_REPLICATION_PASSWORD: repl_password_2024
    ports:
      - "5433:5432"  # 使用5433端口避免与本机PostgreSQL冲突
    volumes:
      # 数据持久化
      - postgres_master_data:/var/lib/postgresql/data
      # 初始化脚本
      - ./infrastructure/docker/postgres/init-master.sql:/docker-entrypoint-initdb.d/01-init-master.sql
      - ./infrastructure/docker/postgres/init-migrations.sql:/docker-entrypoint-initdb.d/02-init-migrations.sql
      # PostgreSQL配置文件
      - ./infrastructure/docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./infrastructure/docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d ai_project_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - ai_dev_network

  # Go 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: ai_backend
    depends_on:
      postgres-master:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Docker内部网络配置覆盖
      DB_HOST: postgres-master
      DB_PORT: 5432
      DB_SOURCE: postgresql://dev_user:dev_password_2024@postgres-master:5432/ai_project_db?sslmode=disable
      DATABASE_URL: postgresql://dev_user:dev_password_2024@postgres-master:5432/ai_project_db?sslmode=disable
    ports:
      - "8081:8080"
    volumes:
      # 代码挂载（支持热重载）
      - ./backend:/app:cached
      # Go模块缓存
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
      # 日志和文档
      - ./backend/logs:/app/logs
      - ./backend/docs:/app/docs:rw
      # 挂载项目OpenAPI文档到容器供 /docs 访问
      - ./docs/api:/app/docs/api:ro
    working_dir: /app
    # 使用Dockerfile中定义的CMD (air热重载)
    # command: ["sh", "-c", "go mod download && go run main.go"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    networks:
      - ai_dev_network

  # React 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: ai_frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      # Docker内部网络配置覆盖
      REACT_APP_API_URL: /api/v1
      REACT_APP_API_BASE_URL: /api/v1
      HOST: 0.0.0.0
      GENERATE_SOURCEMAP: false
    ports:
      - "3001:3000"
    volumes:
      # 代码挂载（支持热重载）- 排除node_modules
      - ./frontend:/app:cached
      # 开发工具配置
      - ./frontend/.eslintrc.js:/app/.eslintrc.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - ai_dev_network


  # MCP服务器 (标准MCP协议 - 仅stdio通信)
  mcp-server:
    build:
      context: ./mcp-task-bridge
      dockerfile: Dockerfile
    container_name: ai_mcp_server
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      # Docker内部网络配置覆盖
      API_BASE_URL: http://backend:8080/api/v1
      TASK_API_BASE: http://backend:8080/api/v1
    ports:
       - "3100:3100"
    volumes:
      # 代码挂载（支持热重载）- 排除node_modules  
      - ./mcp-task-bridge:/app:cached
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    networks:
      - ai_dev_network

  # Prisma CLI 工具 (数据库管理)
  prisma:
    image: node:20
    container_name: ai_prisma
    working_dir: /app
    depends_on:
      postgres-master:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Docker内部网络配置覆盖
      DATABASE_URL: postgresql://dev_user:dev_password_2024@postgres-master:5432/ai_project_db?sslmode=disable
    volumes:
      # 挂载 backend 目录以访问 prisma schema
      - ./backend:/app:cached
    command: ["sh", "-lc", "tail -f /dev/null"]
    restart: unless-stopped
    networks:
      - ai_dev_network

  # Redis (缓存和会话存储)
  redis:
    image: redis:7-alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - ai_dev_network

# 网络配置
networks:
  ai_dev_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

# 数据卷
volumes:
  postgres_master_data:
    driver: local
  go_mod_cache:
    driver: local
  go_build_cache:
    driver: local
  redis_data:
    driver: local