<!DOCTYPE html>
<html>
<head>
    <title>API Key Viewer (Development Only)</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .api-key { background: #f5f5f5; padding: 15px; border-radius: 5px; font-family: monospace; word-break: break-all; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; padding: 15px; border-radius: 5px; margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .primary { background: #007bff; color: white; border: none; border-radius: 3px; }
        .success { background: #28a745; color: white; border: none; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 API Key 完整密钥查看器</h1>
        
        <div class="warning">
            <strong>⚠️ 安全说明：</strong>
            此工具用于开发环境查看完整API密钥。生产环境中请谨慎使用。
        </div>

        <div style="background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <h3>🎯 快速操作</h3>
            <label style="display: block; margin-bottom: 10px;">
                API Key ID: <input type="number" id="apiKeyId" value="9" min="1" style="margin-left: 10px; padding: 5px;">
            </label>
            
            <div style="margin-top: 15px;">
                <button class="primary" onclick="regenerateAndView()">
                    🔄 重新生成并查看完整密钥
                </button>
                <button onclick="viewCurrentInfo()">
                    📋 查看基本信息
                </button>
                <button onclick="openDetailPage()" style="background: #17a2b8; color: white; border: none; border-radius: 3px;">
                    🌐 打开详情页
                </button>
            </div>
        </div>

        <div id="result"></div>
    </div>
    
    <script>
        // 获取认证token
        async function getToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                // 尝试快速登录
                try {
                    const response = await fetch('http://localhost:8081/api/v1/auth/dev-quick-login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: 'dev_user_1' })
                    });
                    const data = await response.json();
                    if (data.data && data.data.token) {
                        localStorage.setItem('token', data.data.token);
                        return data.data.token;
                    }
                } catch (error) {
                    console.error('Auto login failed:', error);
                }
                throw new Error('请先登录');
            }
            return token;
        }

        // 查看当前API Key信息
        async function viewCurrentInfo() {
            const apiKeyId = document.getElementById('apiKeyId').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const token = await getToken();
                const response = await fetch(`http://localhost:8081/api/v1/system/api-keys/${apiKeyId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>📋 当前API Key信息</h3>
                    <div class="api-key">
                        <strong>名称:</strong> ${data.name}<br>
                        <strong>前缀:</strong> ${data.key_prefix}<br>
                        <strong>权限:</strong> ${data.permissions.join(', ')}<br>
                        <strong>状态:</strong> ${data.is_active ? '✅ 活跃' : '❌ 禁用'}<br>
                        <strong>使用次数:</strong> ${data.usage_count}<br>
                        <strong>创建时间:</strong> ${new Date(data.created_at).toLocaleString()}
                    </div>
                    <div class="warning">
                        <strong>💡 完整密钥:</strong> 出于安全考虑，完整的API Key只在创建或重新生成时显示。<br>
                        当前只能看到前缀: <code>${data.key_prefix}***</code>
                    </div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div style="color: red;">❌ 错误: ${error.message}</div>`;
            }
        }

        // 重新生成并查看完整密钥
        async function regenerateAndView() {
            const apiKeyId = document.getElementById('apiKeyId').value;
            const resultDiv = document.getElementById('result');
            
            if (!confirm('⚠️ 确定要重新生成API Key吗？\n\n这将使旧的API Key失效！')) {
                return;
            }
            
            try {
                const token = await getToken();
                const response = await fetch(`http://localhost:8081/api/v1/system/api-keys/${apiKeyId}/regenerate`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.data && data.data.plain_key) {
                    resultDiv.innerHTML = `
                        <h3>🔑 新生成的完整API Key</h3>
                        <div class="api-key">
                            <strong>完整密钥:</strong><br>
                            <div style="font-size: 14px; color: #007bff; margin: 10px 0;">
                                ${data.data.plain_key}
                            </div>
                        </div>
                        <button class="success" onclick="copyToClipboard('${data.data.plain_key}')">📋 复制到剪贴板</button>
                        
                        <div class="warning">
                            <strong>🚨 重要提醒:</strong><br>
                            • 请立即复制并保存此密钥<br>
                            • 此密钥只会显示这一次<br>
                            • 旧的API Key已经失效<br>
                            • 请在所有使用的地方更新为新密钥
                        </div>
                        
                        <h4>📊 API Key信息:</h4>
                        <div class="api-key">
                            <strong>名称:</strong> ${data.data.api_key.name}<br>
                            <strong>前缀:</strong> ${data.data.api_key.key_prefix}<br>
                            <strong>权限:</strong> ${data.data.api_key.permissions.join(', ')}<br>
                            <strong>创建时间:</strong> ${new Date(data.data.api_key.created_at).toLocaleString()}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color: red;">❌ 重新生成失败: 响应中没有密钥</div>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<div style="color: red;">❌ 错误: ${error.message}</div>`;
            }
        }

        // 复制到剪贴板
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('✅ API Key已复制到剪贴板！');
            }).catch(err => {
                console.error('复制失败:', err);
                // 备用方案：选择文本
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('✅ API Key已复制到剪贴板！');
            });
        }

        // 打开详情页
        function openDetailPage() {
            const apiKeyId = document.getElementById('apiKeyId').value;
            window.open(`http://localhost:3001/api-keys/${apiKeyId}`, '_blank');
        }

        // 页面加载时检查token
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('result').innerHTML = `
                    <div style="color: green; padding: 10px; background: #d4edda; border-radius: 5px;">
                        ✅ 已检测到认证token，可以使用所有功能
                    </div>
                `;
            } else {
                document.getElementById('result').innerHTML = `
                    <div style="color: orange; padding: 10px; background: #fff3cd; border-radius: 5px;">
                        ⚠️ 未检测到认证token，将尝试自动登录...
                    </div>
                `;
                // 自动尝试登录
                setTimeout(async () => {
                    try {
                        await getToken();
                        document.getElementById('result').innerHTML = `
                            <div style="color: green; padding: 10px; background: #d4edda; border-radius: 5px;">
                                ✅ 自动登录成功，可以使用所有功能
                            </div>
                        `;
                    } catch (error) {
                        document.getElementById('result').innerHTML = `
                            <div style="color: red; padding: 10px; background: #f8d7da; border-radius: 5px;">
                                ❌ 自动登录失败：${error.message}
                            </div>
                        `;
                    }
                }, 1000);
            }
        };
    </script>
</body>
</html>
