openapi: 3.0.3
info:
  title: New AI Project API
  version: 1.0.0
  description: |
    OpenAPI 3.0 specification for New AI Project - Complete Task Management System.
    
    ## Features
    - **JWT Authentication** with Google OAuth2 support
    - **Role-based Access Control (RBAC)** with fine-grained permissions
    - **Project and Task Management** with hierarchical task structures
    - **Real-time Collaboration** and commenting system
    - **Document Management** with version control and collaboration
    - **Advanced Search** with full-text search capabilities
    - **Timer and Progress Tracking** for productivity insights
    - **Analytics and Reporting** with KPI tracking
    - **File Upload/Download** with secure storage
    - **Webhook Integration** for external systems
    
    ## Authentication
    This API uses JWT (JSON Web Tokens) for authentication. Include the JWT token in the Authorization header:
    ```
    Authorization: Bearer {your_jwt_token}
    ```
    
    ## Error Handling
    All endpoints return errors in a consistent format:
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human readable error message",
        "details": {}
      },
      "timestamp": "2023-01-01T00:00:00Z"
    }
    ```
    
  termsOfService: http://example.com/terms/
  contact:
    name: API Support
    url: http://example.com/support  
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local Development

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and authorization
    externalDocs:
      description: Auth Guide
      url: https://docs.example.com/auth
  - name: Projects
    description: Project management operations
  - name: Tasks
    description: Task management and tracking
  - name: Documents
    description: Document management and collaboration
  - name: Timer
    description: Time tracking for tasks
  - name: Search
    description: Global search across projects and tasks
  - name: Users
    description: User profile and management
  - name: Analytics
    description: Analytics and reporting endpoints
  - name: Admin
    description: Administrative operations
  - name: System
    description: System health and monitoring

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: |
        Authenticate user with username/email and password.
        Returns JWT tokens for API access.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              basic_login:
                summary: Basic login example
                value:
                  username: "admin"
                  password: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  description: Valid refresh token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                          expires_in:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/google:
    get:
      tags: [Authentication]
      summary: Initiate Google OAuth
      description: Redirect to Google OAuth consent page
      responses:
        '302':
          description: Redirect to Google OAuth

  /auth/google/callback:
    get:
      tags: [Authentication] 
      summary: Google OAuth callback
      description: Handle Google OAuth callback and complete authentication
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authentication successful
        '400':
          $ref: '#/components/responses/BadRequest'

  # Project Management
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: Get paginated list of projects accessible to the user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Search term for project name or description
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            type: string
            enum: [private, internal, public]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [name, created_at, updated_at]
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Projects retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Projects]
      summary: Create project
      description: Create a new project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Project ID
    get:
      tags: [Projects]
      summary: Get project details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Project details retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [Projects]
      summary: Update project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Project deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Task Management
  /projects/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Project ID
    get:
      tags: [Tasks]
      summary: Get project tasks
      description: Get paginated list of tasks for a specific project
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Search term for task title or description
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, planning, todo, in_progress, testing, completed, cancelled, on_hold, suspended, blocked, archived]
        - name: assignee_id
          in: query
          schema:
            type: integer
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [title, status, priority, created_at, updated_at, due_date]
            default: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Tasks]
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Task ID
    get:
      tags: [Tasks]
      summary: Get task details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Task details retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Tasks]
      summary: Update task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Tasks]
      summary: Delete task
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # System Endpoints
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Check API health status
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: "1.0.0"
                  database:
                    type: object
                    properties:
                      status:
                        type: string
                        example: "connected"

  /version:
    get:
      tags: [System]
      summary: API version
      description: Get API version information
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "1.0.0"
                  build:
                    type: string
                    example: "abc123"
                  built_at:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for API authentication

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    APIResponse:
      type: object
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          description: Indicates if the request was successful
        message:
          type: string
          description: Human-readable message
        data:
          type: object
          description: Response data (varies by endpoint)
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    ErrorResponse:
      type: object
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "Validation failed"
            details:
              type: object
              description: Additional error details
        timestamp:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of items
        total_pages:
          type: integer
          description: Total number of pages
        has_next:
          type: boolean
          description: Whether there is a next page
        has_prev:
          type: boolean
          description: Whether there is a previous page

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or email address
          example: "admin"
        password:
          type: string
          description: User password
          example: "password123"
          minLength: 6

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string  
          description: JWT refresh token
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          description: Token expiration time in seconds
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
        username:
          type: string
          description: Username
        email:
          type: string
          format: email
          description: Email address
        avatar:
          type: string
          format: uri
          description: Avatar image URL
        roles:
          type: array
          items:
            type: string
          description: User roles
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
          description: Project ID
        name:
          type: string
          description: Project name
        description:
          type: string
          description: Project description
        visibility:
          type: string
          enum: [private, internal, public]
          description: Project visibility
        owner_id:
          type: integer
          description: Project owner user ID
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Project name
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Project description
        visibility:
          type: string
          enum: [private, internal, public]
          default: private

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        visibility:
          type: string
          enum: [private, internal, public]

    Task:
      type: object
      properties:
        id:
          type: integer
          description: Task ID
        project_id:
          type: integer
          description: Project ID
        title:
          type: string
          description: Task title
        description:
          type: string
          description: Task description
        status:
          type: string
          enum: [draft, planning, todo, in_progress, testing, completed, cancelled, on_hold, suspended, blocked, archived]
          description: Task status
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority
        assignee_id:
          type: integer
          nullable: true
          description: Assigned user ID
        reporter_id:
          type: integer
          description: Reporter user ID
        due_date:
          type: string
          format: date-time
          nullable: true
          description: Due date
        estimated_hours:
          type: number
          nullable: true
          description: Estimated hours for completion
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            assignee:
              $ref: '#/components/schemas/User'
            reporter:
              $ref: '#/components/schemas/User'
            comments_count:
              type: integer
            time_logs:
              type: array
              items:
                $ref: '#/components/schemas/TimeLog'

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Task title
          minLength: 1
          maxLength: 500
        description:
          type: string
          description: Task description
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        assignee_id:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        estimated_hours:
          type: number
          nullable: true

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        status:
          type: string
          enum: [draft, planning, todo, in_progress, testing, completed, cancelled, on_hold, suspended, blocked, archived]
        priority:
          type: string
          enum: [low, medium, high]
        assignee_id:
          type: integer
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        estimated_hours:
          type: number
          nullable: true

    TimeLog:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        user_id:
          type: integer
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Duration in seconds
        description:
          type: string
