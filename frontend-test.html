<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI项目管理系统 - 前后端连通性测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #1890ff, #52c41a); color: white; padding: 30px; text-align: center; }
        .header h1 { margin-bottom: 10px; font-size: 2em; }
        .header p { opacity: 0.9; font-size: 1.1em; }
        .content { padding: 30px; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .status-card { border: 2px solid #e8e8e8; border-radius: 6px; padding: 20px; text-align: center; transition: all 0.3s ease; }
        .status-card.success { border-color: #52c41a; background-color: #f6ffed; }
        .status-card.error { border-color: #ff4d4f; background-color: #fff2f0; }
        .status-card.loading { border-color: #1890ff; background-color: #f0f8ff; }
        .status-icon { font-size: 2em; margin-bottom: 10px; display: block; }
        .test-section { margin-bottom: 30px; padding: 20px; background: #fafafa; border-radius: 6px; }
        .test-section h3 { margin-bottom: 15px; color: #333; }
        .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: all 0.3s ease; }
        .btn-primary { background: #1890ff; color: white; } .btn-primary:hover { background: #40a9ff; }
        .btn-success { background: #52c41a; color: white; } .btn-success:hover { background: #73d13d; }
        .btn-warning { background: #faad14; color: white; } .btn-warning:hover { background: #ffc53d; }
        .btn-danger { background: #ff4d4f; color: white; } .btn-danger:hover { background: #ff7875; }
        .result-box { background: white; border: 1px solid #d9d9d9; border-radius: 4px; padding: 15px; margin-top: 10px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
        .log-entry { margin-bottom: 8px; }
        .log-success { color: #52c41a; } .log-error { color: #ff4d4f; } .log-info { color: #1890ff; } .log-warning { color: #faad14; }
        .timestamp { color: #666; margin-right: 8px; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #1890ff; border-radius: 50%; border-top-color: transparent; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .env-info { background: #e6f7ff; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .env-info code { background: #fff; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 AI项目管理系统</h1>
            <p>前后端连通性测试 & 服务状态监控</p>
        </div>
        
        <div class="content">
            <!-- 环境信息 -->
            <div class="env-info">
                <h3>🌐 当前环境信息</h3>
                <p><strong>前端地址</strong>: <code id="frontend-url">http://152.136.104.251:3001</code></p>
                <p><strong>后端API</strong>: <code id="backend-url">http://152.136.104.251:8080</code></p>
                <p><strong>测试时间</strong>: <code id="current-time">--</code></p>
            </div>

            <!-- 服务状态概览 -->
            <div class="status-grid">
                <div class="status-card" id="frontend-status">
                    <span class="status-icon">🌐</span>
                    <h4>前端服务</h4>
                    <p>端口 3001</p>
                    <div id="frontend-result">检测中...</div>
                </div>
                <div class="status-card" id="backend-status">
                    <span class="status-icon">⚡</span>
                    <h4>后端API</h4>
                    <p>端口 8080</p>
                    <div id="backend-result">检测中...</div>
                </div>
                <div class="status-card" id="cors-status">
                    <span class="status-icon">🔄</span>
                    <h4>CORS配置</h4>
                    <p>跨域请求</p>
                    <div id="cors-result">检测中...</div>
                </div>
            </div>

            <!-- API测试区域 -->
            <div class="test-section">
                <h3>🔧 API连通性测试</h3>
                <div class="button-group">
                    <button class="btn-primary" onclick="testHealthCheck()">健康检查</button>
                    <button class="btn-primary" onclick="testApiHealth()">API健康检查</button>
                    <button class="btn-success" onclick="testQuickLogin()">快速登录</button>
                    <button class="btn-warning" onclick="testProjects()">获取项目列表</button>
                    <button class="btn-warning" onclick="testTasks()">获取任务列表</button>
                    <button class="btn-danger" onclick="clearLogs()">清空日志</button>
                </div>
                <div class="result-box" id="api-logs"></div>
            </div>

            <!-- CORS测试区域 -->
            <div class="test-section">
                <h3>🌍 CORS跨域测试</h3>
                <div class="button-group">
                    <button class="btn-primary" onclick="testCorsOptions()">OPTIONS预检请求</button>
                    <button class="btn-success" onclick="testCorsWithCredentials()">带凭据请求</button>
                    <button class="btn-warning" onclick="testCorsHeaders()">自定义头测试</button>
                    <button class="btn-danger" onclick="clearCorsLogs()">清空CORS日志</button>
                </div>
                <div class="result-box" id="cors-logs"></div>
            </div>
        </div>
    </div>

    <script>
        // 配置
        const CONFIG = {
            FRONTEND_URL: 'http://152.136.104.251:3001',
            BACKEND_URL: 'http://152.136.104.251:8080',
            API_BASE: 'http://152.136.104.251:8080/api/v1'
        };

        let authToken = '';

        // 日志功能
        function log(message, type = 'info', container = 'api-logs') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span>${message}`;
            
            const logContainer = document.getElementById(container);
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('api-logs').innerHTML = '';
        }

        function clearCorsLogs() {
            document.getElementById('cors-logs').innerHTML = '';
        }

        // 状态更新
        function updateStatus(elementId, status, message) {
            const element = document.getElementById(elementId);
            element.className = `status-card ${status}`;
            element.querySelector('div').innerHTML = message;
        }

        // API测试函数
        async function testHealthCheck() {
            log('🔍 测试基础健康检查...', 'info');
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/health`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.text();
                    log(`✅ 健康检查成功: ${data}`, 'success');
                    updateStatus('backend-status', 'success', '服务正常');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ 健康检查失败: ${error.message}`, 'error');
                updateStatus('backend-status', 'error', '连接失败');
                return false;
            }
        }

        async function testApiHealth() {
            log('🔍 测试API健康检查...', 'info');
            try {
                const response = await fetch(`${CONFIG.API_BASE}/health`, {
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ API健康检查成功: ${JSON.stringify(data)}`, 'success');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                log(`❌ API健康检查失败: ${error.message}`, 'error');
                return false;
            }
        }

        async function testQuickLogin() {
            log('🔐 测试快速登录...', 'info');
            try {
                const response = await fetch(`${CONFIG.API_BASE}/auth/dev/quick-login`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: 'admin' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    authToken = data.token || data.access_token || data.data?.token;
                    log(`✅ 登录成功! Token: ${authToken ? '已获取' : '未获取到'}`, 'success');
                    
                    if (authToken) {
                        localStorage.setItem('authToken', authToken);
                        log(`📦 Token已保存到localStorage`, 'info');
                    }
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                log(`❌ 登录失败: ${error.message}`, 'error');
                return false;
            }
        }

        async function testProjects() {
            log('📋 测试获取项目列表...', 'info');
            
            if (!authToken) {
                log('⚠️ 需要先登录获取Token', 'warning');
                return false;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE}/projects?page=1&page_size=10`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ 项目列表获取成功! 找到 ${data.data?.projects?.length || 0} 个项目`, 'success');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                log(`❌ 获取项目列表失败: ${error.message}`, 'error');
                return false;
            }
        }

        async function testTasks() {
            log('📝 测试获取任务列表...', 'info');
            
            if (!authToken) {
                log('⚠️ 需要先登录获取Token', 'warning');
                return false;
            }

            try {
                const response = await fetch(`${CONFIG.API_BASE}/tasks?page=1&page_size=10`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ 任务列表获取成功! 找到 ${data.data?.tasks?.length || 0} 个任务`, 'success');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                log(`❌ 获取任务列表失败: ${error.message}`, 'error');
                return false;
            }
        }

        // CORS测试函数
        async function testCorsOptions() {
            log('🔍 测试CORS OPTIONS预检请求...', 'info', 'cors-logs');
            try {
                const response = await fetch(`${CONFIG.API_BASE}/health`, {
                    method: 'OPTIONS',
                    mode: 'cors',
                    headers: {
                        'Origin': window.location.origin,
                        'Access-Control-Request-Method': 'GET',
                        'Access-Control-Request-Headers': 'Content-Type, Authorization'
                    }
                });
                
                const corsHeaders = {
                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers'),
                    'Access-Control-Max-Age': response.headers.get('Access-Control-Max-Age')
                };
                
                log(`✅ OPTIONS请求成功! CORS头信息:`, 'success', 'cors-logs');
                log(`   Allow-Origin: ${corsHeaders['Access-Control-Allow-Origin'] || '未设置'}`, 'info', 'cors-logs');
                log(`   Allow-Methods: ${corsHeaders['Access-Control-Allow-Methods'] || '未设置'}`, 'info', 'cors-logs');
                log(`   Allow-Headers: ${corsHeaders['Access-Control-Allow-Headers'] || '未设置'}`, 'info', 'cors-logs');
                log(`   Max-Age: ${corsHeaders['Access-Control-Max-Age'] || '未设置'}`, 'info', 'cors-logs');
                
                updateStatus('cors-status', 'success', 'CORS正常');
                return true;
            } catch (error) {
                log(`❌ CORS OPTIONS测试失败: ${error.message}`, 'error', 'cors-logs');
                updateStatus('cors-status', 'error', 'CORS异常');
                return false;
            }
        }

        async function testCorsWithCredentials() {
            log('🔐 测试带凭据的CORS请求...', 'info', 'cors-logs');
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/health`, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    log(`✅ 带凭据请求成功!`, 'success', 'cors-logs');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ 带凭据请求失败: ${error.message}`, 'error', 'cors-logs');
                return false;
            }
        }

        async function testCorsHeaders() {
            log('📋 测试自定义头的CORS请求...', 'info', 'cors-logs');
            try {
                const response = await fetch(`${CONFIG.BACKEND_URL}/health`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'X-Custom-Header': 'test-value',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                if (response.ok) {
                    log(`✅ 自定义头请求成功!`, 'success', 'cors-logs');
                    return true;
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                log(`❌ 自定义头请求失败: ${error.message}`, 'error', 'cors-logs');
                return false;
            }
        }

        // 页面初始化
        async function initializePage() {
            document.getElementById('current-time').textContent = new Date().toLocaleString();
            document.getElementById('frontend-url').textContent = window.location.href;
            
            // 尝试从localStorage恢复token
            const savedToken = localStorage.getItem('authToken');
            if (savedToken) {
                authToken = savedToken;
                log(`📦 从localStorage恢复Token: ${authToken ? '成功' : '失败'}`, 'info');
            }
            
            log('🚀 页面初始化完成，开始自动检测...', 'info');
            updateStatus('frontend-status', 'success', '页面已加载');
            
            // 自动运行基础测试
            await testHealthCheck();
            await testApiHealth();
            await testCorsOptions();
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
