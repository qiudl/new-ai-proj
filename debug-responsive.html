<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式布局调试</title>
    <style>
        /* 复制TaskDetail.css中的响应式样式 */
        
        /* XS设备: < 576px (手机竖屏) */
        @media (max-width: 575px) {
          .task-detail-container {
            display: flex !important;
            flex-direction: column !important;
            gap: 16px;
            padding: 12px !important;
            /* 防止浮层遮盖 */
            position: relative !important;
            overflow-x: hidden !important;
            overflow-y: visible !important;
            background: #e8f4f8 !important; /* 调试用背景色 */
          }
          
          .task-detail-container .ant-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 16px;
          }
          
          .task-detail-container .ant-col {
            position: static !important; /* 改为static以防止浮层 */
            float: none !important;
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            flex: none !important;
            margin-bottom: 16px;
            padding-left: 0 !important;
            padding-right: 0 !important;
            /* 确保自然文档流 */
            transform: none !important;
            z-index: auto !important;
            background: #fff3cd !important; /* 调试用背景色 */
            border: 2px solid #856404 !important; /* 调试边框 */
          }
        }

        /* SM设备: 576px - 767px (手机横屏) */
        @media (min-width: 576px) and (max-width: 767px) {
          .task-detail-container {
            display: flex !important;
            flex-direction: column !important;
            gap: 20px;
            padding: 16px !important;
            position: relative !important;
            overflow-x: hidden !important;
            overflow-y: visible !important;
            background: #d1ecf1 !important; /* 调试用背景色 */
          }
          
          .task-detail-container .ant-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 20px;
          }
          
          .task-detail-container .ant-col {
            position: static !important;
            float: none !important;
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            flex: none !important;
            margin-bottom: 20px;
            padding-left: 0 !important;
            padding-right: 0 !important;
            transform: none !important;
            z-index: auto !important;
            background: #d4edda !important; /* 调试用背景色 */
            border: 2px solid #155724 !important; /* 调试边框 */
          }
        }

        /* MD设备: 768px - 991px (平板竖屏) */
        @media (min-width: 768px) and (max-width: 991px) {
          .task-detail-container {
            display: flex !important;
            flex-direction: column !important;
            gap: 24px;
            padding: 20px !important;
            position: relative !important;
            overflow-x: hidden !important;
            overflow-y: visible !important;
            background: #f8d7da !important; /* 调试用背景色 */
          }
          
          .task-detail-container .ant-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 24px;
          }
          
          .task-detail-container .ant-col {
            position: static !important;
            float: none !important;
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            flex: none !important;
            margin-bottom: 24px;
            padding-left: 0 !important;
            padding-right: 0 !important;
            transform: none !important;
            z-index: auto !important;
            background: #f5c6cb !important; /* 调试用背景色 */
            border: 2px solid #721c24 !important; /* 调试边框 */
          }
        }

        /* LG+设备: ≥ 992px (大屏设备) */
        @media (min-width: 992px) {
          .task-detail-container {
            display: block !important;
            padding: 24px !important;
            background: #d4edda !important; /* 调试用背景色 */
          }
          
          .task-detail-container .ant-row {
            display: flex !important;
            flex-wrap: wrap !important;
          }
          
          .task-detail-container .ant-col {
            position: relative !important;
            float: none !important;
            display: block !important;
            margin-bottom: 0 !important;
            background: #c3e6cb !important; /* 调试用背景色 */
            border: 2px solid #155724 !important; /* 调试边框 */
          }
        }

        /* 模拟Ant Design Grid布局 */
        .ant-row {
            display: flex;
            flex-wrap: wrap;
            margin-left: -12px;
            margin-right: -12px;
        }
        
        .ant-col {
            position: relative;
            min-height: 1px;
            padding-left: 12px;
            padding-right: 12px;
        }
        
        .ant-col-xs-24 { width: 100%; }
        .ant-col-sm-24 { width: 100%; }
        .ant-col-md-24 { width: 100%; }
        .ant-col-lg-16 { width: 66.66666667%; }
        .ant-col-lg-8 { width: 33.33333333%; }
        .ant-col-xl-16 { width: 66.66666667%; }
        .ant-col-xl-8 { width: 33.33333333%; }

        @media (min-width: 576px) {
            .ant-col-sm-24 { width: 100%; }
        }
        @media (min-width: 768px) {
            .ant-col-md-24 { width: 100%; }
        }
        @media (min-width: 992px) {
            .ant-col-lg-16 { width: 66.66666667%; }
            .ant-col-lg-8 { width: 33.33333333%; }
        }
        @media (min-width: 1200px) {
            .ant-col-xl-16 { width: 66.66666667%; }
            .ant-col-xl-8 { width: 33.33333333%; }
        }

        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <div>窗口宽度: <span id="width"></span>px</div>
        <div>断点: <span id="breakpoint"></span></div>
    </div>

    <div class="task-detail-container">
        <div class="ant-row">
            <!-- 左侧主要内容 -->
            <div class="ant-col ant-col-xs-24 ant-col-sm-24 ant-col-md-24 ant-col-lg-16 ant-col-xl-16">
                <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 16px;">
                    <h2>主要内容区域</h2>
                    <p>这是任务详情的主要内容区域。</p>
                    <p>在小屏幕设备上，这个区域应该占据100%宽度。</p>
                    <p>在大屏幕设备上，这个区域应该占据约67%宽度。</p>
                </div>
                
                <div style="background: white; padding: 20px; border-radius: 8px;">
                    <h3>任务描述</h3>
                    <p>这里是任务的详细描述内容...</p>
                </div>
            </div>
            
            <!-- 右侧信息面板 -->
            <div class="ant-col ant-col-xs-24 ant-col-sm-24 ant-col-md-24 ant-col-lg-8 ant-col-xl-8">
                <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 16px;">
                    <h3>任务信息</h3>
                    <p>状态: 进行中</p>
                    <p>优先级: 高</p>
                    <p>负责人: 张三</p>
                </div>
                
                <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 16px;">
                    <h3>时间记录</h3>
                    <p>已用时间: 2小时</p>
                    <p>预估时间: 8小时</p>
                </div>
                
                <div style="background: white; padding: 20px; border-radius: 8px;">
                    <h3>相关文档</h3>
                    <p>文档1.pdf</p>
                    <p>文档2.docx</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateDebugInfo() {
            const width = window.innerWidth;
            let breakpoint = 'XL (≥1200px)';
            
            if (width < 576) {
                breakpoint = 'XS (<576px)';
            } else if (width < 768) {
                breakpoint = 'SM (576-767px)';
            } else if (width < 992) {
                breakpoint = 'MD (768-991px)';
            } else if (width < 1200) {
                breakpoint = 'LG (992-1199px)';
            }
            
            document.getElementById('width').textContent = width;
            document.getElementById('breakpoint').textContent = breakpoint;
        }
        
        updateDebugInfo();
        window.addEventListener('resize', updateDebugInfo);
    </script>
</body>
</html>
