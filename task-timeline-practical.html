<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务时间轴 - 实用版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .filter-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        .date-range {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #6b7280;
        }

        .date-input {
            border: 1px solid #d1d5db;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .timeline-container {
            background: white;
            border-radius: 8px;
            padding: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .timeline {
            display: flex;
            min-height: 600px;
        }

        /* 左侧日期轴 */
        .date-axis {
            width: 120px;
            background: #f8fafc;
            border-right: 2px solid #e5e7eb;
            position: relative;
        }

        .date-item {
            position: relative;
            padding: 16px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        .date-item:last-child {
            border-bottom: none;
        }

        .date-day {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 2px;
        }

        .date-number {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 2px;
        }

        .date-month {
            font-size: 11px;
            color: #9ca3af;
        }

        .date-item.today {
            background: #eff6ff;
            border-left: 3px solid #3b82f6;
        }

        .date-item.today .date-number {
            color: #3b82f6;
        }

        /* 右侧任务内容区 */
        .tasks-content {
            flex: 1;
            position: relative;
        }

        .date-section {
            position: relative;
            min-height: 80px;
            border-bottom: 1px solid #e5e7eb;
            padding: 0;
        }

        .date-section:last-child {
            border-bottom: none;
        }

        .task-list {
            padding: 8px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            margin: 4px 16px;
            background: #f8fafc;
            border-radius: 6px;
            border-left: 3px solid #e5e7eb;
            transition: all 0.2s;
            cursor: pointer;
        }

        .task-item:hover {
            background: #f1f5f9;
            transform: translateX(4px);
        }

        .task-item.completed {
            border-left-color: #10b981;
            background: #f0fdf4;
        }

        .task-item.in-progress {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .task-item.todo {
            border-left-color: #6b7280;
            background: #f8fafc;
        }

        .task-status {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        .task-status.completed {
            background: #10b981;
        }

        .task-status.in-progress {
            background: #f59e0b;
        }

        .task-status.todo {
            background: #6b7280;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 14px;
            font-weight: 500;
            color: #1f2937;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
            transition: color 0.2s;
        }

        .task-title:hover {
            color: #3b82f6;
            text-decoration: underline;
        }

        .task-id {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            background: #f1f5f9;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 6px;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #6b7280;
        }

        .task-time {
            color: #3b82f6;
            font-weight: 500;
        }

        .task-duration {
            color: #059669;
        }

        .task-project {
            color: #7c3aed;
        }

        .priority-badge {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #d1fae5;
            color: #059669;
        }

        /* 项目分组样式 */
        .project-group {
            margin-bottom: 8px;
        }

        .project-header {
            display: flex;
            align-items: center;
            padding: 4px 16px 2px;
            font-size: 12px;
            font-weight: 600;
            color: #4f46e5;
            background: #eef2ff;
            border-left: 3px solid #4f46e5;
            margin-bottom: 4px;
        }

        .project-count {
            margin-left: auto;
            color: #6b7280;
            font-weight: normal;
            font-size: 11px;
        }

        .empty-date {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80px;
            color: #9ca3af;
            font-size: 13px;
        }

        .stats-bar {
            background: #f8fafc;
            padding: 12px 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #6b7280;
        }

        .stats-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .stats-number {
            font-weight: 600;
            color: #1f2937;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }

            .date-axis {
                width: 80px;
            }

            .date-item {
                padding: 12px 8px;
            }

            .date-number {
                font-size: 16px;
            }

            .task-item {
                margin: 2px 8px;
                padding: 6px 12px;
            }

            .task-title {
                font-size: 13px;
            }

            .task-meta {
                font-size: 11px;
                gap: 8px;
            }

            .controls {
                flex-direction: column;
                gap: 12px;
            }
        }

        /* 滚动条样式 */
        .tasks-content::-webkit-scrollbar {
            width: 6px;
        }

        .tasks-content::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .tasks-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .tasks-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页头 -->
        <div class="header">
            <h1>任务时间轴</h1>
            <p>按日期查看任务执行情况</p>
        </div>

        <!-- 控制栏 -->
        <div class="controls">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterTasks('all')">全部</button>
                <button class="filter-btn" onclick="filterTasks('completed')">已完成</button>
                <button class="filter-btn" onclick="filterTasks('in-progress')">进行中</button>
                <button class="filter-btn" onclick="filterTasks('todo')">待办</button>
                <button class="filter-btn" onclick="toggleProjectGrouping()" id="groupBtn">按项目分组</button>
            </div>
            <div class="date-range">
                <span>日期范围:</span>
                <input type="date" class="date-input" id="startDate" onchange="updateDateRange()">
                <span>-</span>
                <input type="date" class="date-input" id="endDate" onchange="updateDateRange()">
                <button class="filter-btn" onclick="resetDates()">本周</button>
            </div>
        </div>

        <!-- 时间轴容器 -->
        <div class="timeline-container">
            <div class="timeline">
                <!-- 左侧日期轴 -->
                <div class="date-axis" id="dateAxis">
                    <!-- 日期项目将通过JavaScript生成 -->
                </div>

                <!-- 右侧任务内容区 -->
                <div class="tasks-content" id="tasksContent">
                    <!-- 任务内容将通过JavaScript生成 -->
                </div>
            </div>

            <!-- 底部统计栏 -->
            <div class="stats-bar">
                <div class="stats-item">
                    <span>总任务:</span>
                    <span class="stats-number" id="totalTasks">0</span>
                </div>
                <div class="stats-item">
                    <span>已完成:</span>
                    <span class="stats-number" id="completedTasks">0</span>
                </div>
                <div class="stats-item">
                    <span>总时长:</span>
                    <span class="stats-number" id="totalHours">0.0h</span>
                </div>
                <div class="stats-item">
                    <span>完成率:</span>
                    <span class="stats-number" id="completionRate">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟任务数据
        const taskData = [
            {
                id: 1,
                title: "解决所有弹窗都出现遮罩层的问题",
                status: "completed",
                priority: "low",
                startTime: "2025-09-14 02:36",
                duration: 0.10,
                project: "ai-proj",
                date: "2025-09-14"
            },
            {
                id: 2,
                title: "重新设计任务时间轴页面增强体验",
                status: "in-progress",
                priority: "high",
                startTime: "2025-09-14 12:22",
                duration: 1.5,
                project: "前端优化",
                date: "2025-09-14"
            },
            {
                id: 3,
                title: "实现Daily Focus Tasks完整MCP接口",
                status: "completed",
                priority: "medium",
                startTime: "2025-09-13 16:45",
                duration: 2.3,
                project: "后端API",
                date: "2025-09-13"
            },
            {
                id: 4,
                title: "优化任务搜索算法性能",
                status: "todo",
                priority: "medium",
                startTime: "2025-09-14 15:00",
                duration: 0,
                project: "性能优化",
                date: "2025-09-14"
            },
            {
                id: 5,
                title: "修复OKR关键结果保存失败问题",
                status: "completed",
                priority: "high",
                startTime: "2025-09-12 14:20",
                duration: 1.8,
                project: "Bug修复",
                date: "2025-09-12"
            },
            {
                id: 6,
                title: "数据库性能调优和索引优化",
                status: "completed",
                priority: "medium",
                startTime: "2025-09-11 09:15",
                duration: 4.2,
                project: "数据库",
                date: "2025-09-11"
            },
            {
                id: 7,
                title: "前端组件库升级和兼容性测试",
                status: "completed",
                priority: "low",
                startTime: "2025-09-13 10:30",
                duration: 2.1,
                project: "前端",
                date: "2025-09-13"
            },
            {
                id: 8,
                title: "API文档更新和接口规范化",
                status: "in-progress",
                priority: "medium",
                startTime: "2025-09-12 09:00",
                duration: 1.5,
                project: "文档",
                date: "2025-09-12"
            }
        ];

        let currentFilter = 'all';
        let filteredTasks = [...taskData];
        let isGroupedByProject = false;

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initializeDates();
            renderTimeline();
            updateStats();
        });

        // 初始化日期范围
        function initializeDates() {
            const today = new Date();
            const weekStart = new Date(today);
            weekStart.setDate(today.getDate() - 6);
            
            document.getElementById('startDate').value = weekStart.toISOString().split('T')[0];
            document.getElementById('endDate').value = today.toISOString().split('T')[0];
        }

        // 渲染时间轴
        function renderTimeline() {
            const startDate = new Date(document.getElementById('startDate').value);
            const endDate = new Date(document.getElementById('endDate').value);
            
            // 生成日期范围
            const dates = [];
            const currentDate = new Date(startDate);
            while (currentDate <= endDate) {
                dates.push(new Date(currentDate));
                currentDate.setDate(currentDate.getDate() + 1);
            }

            // 渲染左侧日期轴
            renderDateAxis(dates);
            
            // 渲染右侧任务内容
            renderTasksContent(dates);
        }

        // 渲染左侧日期轴
        function renderDateAxis(dates) {
            const dateAxis = document.getElementById('dateAxis');
            const today = new Date().toISOString().split('T')[0];
            
            dateAxis.innerHTML = dates.map(date => {
                const dateStr = date.toISOString().split('T')[0];
                const isToday = dateStr === today;
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
                
                return `
                    <div class="date-item ${isToday ? 'today' : ''}">
                        <div class="date-day">${dayNames[date.getDay()]}</div>
                        <div class="date-number">${date.getDate()}</div>
                        <div class="date-month">${monthNames[date.getMonth()]}</div>
                    </div>
                `;
            }).join('');
        }

        // 渲染右侧任务内容
        function renderTasksContent(dates) {
            const tasksContent = document.getElementById('tasksContent');
            
            tasksContent.innerHTML = dates.map(date => {
                const dateStr = date.toISOString().split('T')[0];
                const dayTasks = filteredTasks.filter(task => task.date === dateStr);
                
                return `
                    <div class="date-section">
                        <div class="task-list">
                            ${dayTasks.length > 0 ? 
                                (isGroupedByProject ? renderTasksGroupedByProject(dayTasks) : renderTasksFlat(dayTasks)) : 
                                '<div class="empty-date">暂无任务</div>'
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 按项目分组渲染任务
        function renderTasksGroupedByProject(tasks) {
            const projectGroups = tasks.reduce((groups, task) => {
                const project = task.project;
                if (!groups[project]) {
                    groups[project] = [];
                }
                groups[project].push(task);
                return groups;
            }, {});

            return Object.entries(projectGroups).map(([project, projectTasks]) => `
                <div class="project-group">
                    <div class="project-header">
                        ${project}
                        <span class="project-count">${projectTasks.length}个任务</span>
                    </div>
                    ${projectTasks.map(task => renderTaskItem(task)).join('')}
                </div>
            `).join('');
        }

        // 平铺渲染任务
        function renderTasksFlat(tasks) {
            return tasks.map(task => renderTaskItem(task)).join('');
        }

        // 渲染单个任务项
        function renderTaskItem(task) {
            const taskUrl = `/task/${task.id}`;
            return `
                <div class="task-item ${task.status}" onclick="openTaskDetail('${taskUrl}')">
                    <div class="task-status ${task.status}">
                        ${task.status === 'completed' ? '✓' : 
                          task.status === 'in-progress' ? '⚡' : '○'}
                    </div>
                    <div class="task-info">
                        <div class="task-title">
                            <span class="task-id">#${task.id}</span>
                            ${task.title}
                        </div>
                        <div class="task-meta">
                            <span class="task-time">${task.startTime.split(' ')[1]}</span>
                            <span class="task-duration">${task.duration}h</span>
                            ${!isGroupedByProject ? `<span class="task-project">${task.project}</span>` : ''}
                            <span class="priority-badge priority-${task.priority}">
                                ${task.priority === 'high' ? '高' : 
                                  task.priority === 'medium' ? '中' : '低'}
                            </span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 过滤任务
        function filterTasks(filter) {
            currentFilter = filter;
            
            if (filter === 'all') {
                filteredTasks = [...taskData];
            } else {
                filteredTasks = taskData.filter(task => task.status === filter);
            }
            
            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTimeline();
            updateStats();
        }

        // 更新日期范围
        function updateDateRange() {
            renderTimeline();
            updateStats();
        }

        // 重置到本周
        function resetDates() {
            initializeDates();
            renderTimeline();
            updateStats();
        }

        // 更新统计信息
        function updateStats() {
            const total = filteredTasks.length;
            const completed = filteredTasks.filter(task => task.status === 'completed').length;
            const totalHours = filteredTasks.reduce((sum, task) => sum + task.duration, 0);
            const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('totalHours').textContent = totalHours.toFixed(1) + 'h';
            document.getElementById('completionRate').textContent = completionRate + '%';
        }

        // 打开任务详情页面
        function openTaskDetail(taskUrl) {
            // 在新标签页打开任务详情
            window.open(taskUrl, '_blank');
        }

        // 切换项目分组模式
        function toggleProjectGrouping() {
            isGroupedByProject = !isGroupedByProject;
            const groupBtn = document.getElementById('groupBtn');
            groupBtn.textContent = isGroupedByProject ? '取消分组' : '按项目分组';
            groupBtn.classList.toggle('active', isGroupedByProject);
            renderTimeline();
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.altKey) {
                switch(e.key) {
                    case '1':
                        e.preventDefault();
                        document.querySelector('[onclick="filterTasks(\'all\')"]').click();
                        break;
                    case '2':
                        e.preventDefault();
                        document.querySelector('[onclick="filterTasks(\'completed\')"]').click();
                        break;
                    case '3':
                        e.preventDefault();
                        document.querySelector('[onclick="filterTasks(\'in-progress\')"]').click();
                        break;
                    case '4':
                        e.preventDefault();
                        document.querySelector('[onclick="filterTasks(\'todo\')"]').click();
                        break;
                }
            }
        });
    </script>
</body>
</html>
