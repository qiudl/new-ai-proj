name: Deploy to Lightweight Server (Simple)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy-directly:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server and build on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # 设置变量
          PROJECT_DIR="/opt/ai-project"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          
          # 创建项目目录
          sudo mkdir -p $PROJECT_DIR
          sudo chown -R $USER:$USER $PROJECT_DIR
          cd $PROJECT_DIR
          
          # 备份当前部署（如果存在）
          if [ -d "current" ]; then
            echo "备份当前版本..."
            mv current backup-$(date +%Y%m%d_%H%M%S) || true
          fi
          
          # 克隆最新代码
          echo "下载最新代码..."
          git clone $REPO_URL current
          cd current
          
          # 停止现有服务
          echo "停止现有服务..."
          docker-compose -f docker-compose.simple.yml down || true
          
          # 清理旧镜像
          docker image prune -f || true
          
          # 构建并启动服务
          echo "构建并启动服务..."
          docker-compose -f docker-compose.simple.yml up --build -d
          
          # 健康检查
          echo "等待服务启动..."
          sleep 30
          
          # 检查服务状态
          docker-compose -f docker-compose.simple.yml ps
          
          # 简单的健康检查
          if curl -f http://localhost/health >/dev/null 2>&1; then
            echo "✅ 部署成功！应用正常运行"
          else
            echo "⚠️ 应用可能存在问题，请检查日志"
            docker-compose -f docker-compose.simple.yml logs --tail=20
          fi
          
          echo "🎉 部署完成！"
          echo "访问地址: http://${{ secrets.TENCENT_HOST }}"