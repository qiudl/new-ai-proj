name: Deploy to Lightweight Server (Simple)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy-directly:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server and build on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e  # 出错时立即退出
          
          # 设置变量
          PROJECT_DIR="/opt/ai-project"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          
          echo "=== 开始部署流程 ==="
          echo "项目目录: $PROJECT_DIR"
          echo "仓库地址: $REPO_URL"
          
          # 检查并安装必要工具
          echo "=== 检查系统依赖 ==="
          if ! command -v git >/dev/null 2>&1; then
            echo "安装Git..."
            sudo apt update
            sudo apt install -y git curl
          fi
          
          if ! command -v docker >/dev/null 2>&1; then
            echo "安装Docker..."
            # 尝试官方安装脚本
            if curl -fsSL --retry 3 --retry-delay 5 https://get.docker.com -o get-docker.sh 2>/dev/null; then
              sudo sh get-docker.sh
            else
              echo "官方脚本下载失败，使用备用方法安装Docker..."
              # 备用安装方法：使用apt源安装
              sudo apt update
              sudo apt install -y apt-transport-https ca-certificates curl gnupg lsb-release
              
              # 尝试多个Docker GPG key源
              for key_url in \
                "https://download.docker.com/linux/ubuntu/gpg" \
                "https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg" \
                "https://mirrors.tencent.com/docker-ce/linux/ubuntu/gpg"; do
                if curl -fsSL --retry 2 "$key_url" | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg 2>/dev/null; then
                  echo "成功添加Docker GPG key: $key_url"
                  break
                fi
              done
              
              # 添加Docker apt源（优先使用国内镜像）
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://mirrors.aliyun.com/docker-ce/linux/ubuntu $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null || \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt update
              sudo apt install -y docker-ce docker-ce-cli containerd.io
            fi
            sudo usermod -aG docker $USER
          fi
          
          if ! command -v docker-compose >/dev/null 2>&1; then
            echo "安装Docker Compose..."
            # 优先使用Ubuntu包管理器安装（最快）
            if sudo apt install -y docker-compose-plugin 2>/dev/null; then
              echo "通过apt安装docker-compose-plugin成功"
              # 创建兼容性链接
              sudo ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose 2>/dev/null || true
            else
              echo "apt安装失败，尝试直接下载..."
              # 快速下载最新版本，设置短超时
              if timeout 60 sudo curl -fsSL --connect-timeout 10 --max-time 60 \
                "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose; then
                sudo chmod +x /usr/local/bin/docker-compose
                echo "直接下载安装成功"
              else
                echo "使用pip快速安装..."
                sudo apt install -y python3-pip
                timeout 120 sudo pip3 install docker-compose --break-system-packages 2>/dev/null || \
                timeout 120 sudo pip3 install docker-compose
              fi
            fi
          fi
          
          # 启动Docker服务
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # 创建项目目录
          echo "=== 准备项目目录 ==="
          sudo mkdir -p $PROJECT_DIR
          sudo chown -R $USER:$USER $PROJECT_DIR
          cd $PROJECT_DIR
          
          # 备份当前部署（如果存在）
          if [ -d "current" ]; then
            echo "备份当前版本..."
            mv current backup-$(date +%Y%m%d_%H%M%S) || true
          fi
          
          # 克隆最新代码
          echo "=== 下载最新代码 ==="
          echo "正在克隆仓库: $REPO_URL"
          timeout 300 git clone --depth 1 $REPO_URL current || {
            echo "Git克隆失败，尝试使用wget下载..."
            wget -O main.zip "https://github.com/${{ github.repository }}/archive/refs/heads/main.zip"
            unzip main.zip
            mv *-main current
            rm main.zip
          }
          cd current
          
          echo "=== 检查配置文件 ==="
          if [ ! -f "docker-compose.simple.yml" ]; then
            echo "❌ 找不到docker-compose.simple.yml文件"
            ls -la
            exit 1
          fi
          
          # 创建环境配置文件
          if [ ! -f ".env" ]; then
            echo "创建环境配置文件..."
            cp .env.simple .env 2>/dev/null || {
              echo "DB_USER=ai_user" > .env
              echo "DB_PASSWORD=ai_password_2024" >> .env
              echo "DB_NAME=ai_project_db" >> .env
              echo "JWT_SECRET=dev_jwt_secret_2024" >> .env
            }
          fi
          
          # 停止现有服务
          echo "=== 停止现有服务 ==="
          docker-compose -f docker-compose.simple.yml down || true
          
          # 清理旧镜像和容器
          echo "=== 清理旧资源 ==="
          docker container prune -f || true
          docker image prune -f || true
          
          # 构建并启动服务
          echo "=== 构建并启动服务 ==="
          echo "开始构建Docker镜像..."
          docker-compose -f docker-compose.simple.yml build || {
            echo "❌ Docker构建失败，查看详细信息："
            docker-compose -f docker-compose.simple.yml logs
            exit 1
          }
          
          echo "启动服务..."
          docker-compose -f docker-compose.simple.yml up -d || {
            echo "❌ 服务启动失败，查看详细信息："
            docker-compose -f docker-compose.simple.yml logs
            exit 1
          }
          
          # 健康检查
          echo "=== 健康检查 ==="
          echo "等待服务启动..."
          sleep 30
          
          # 检查服务状态
          echo "检查容器状态："
          docker-compose -f docker-compose.simple.yml ps
          
          # 检查Docker状态
          echo "检查Docker系统状态："
          docker system df
          
          # 简单的健康检查
          echo "执行应用健康检查..."
          if curl -f http://localhost/health >/dev/null 2>&1; then
            echo "✅ 部署成功！应用正常运行"
          elif curl -f http://localhost:80/health >/dev/null 2>&1; then
            echo "✅ 部署成功！应用正常运行（端口80）"
          else
            echo "⚠️ 应用健康检查失败，查看服务日志："
            docker-compose -f docker-compose.simple.yml logs --tail=50
            
            echo "检查端口占用情况："
            netstat -tlnp | grep :80 || true
            netstat -tlnp | grep :8080 || true
          fi
          
          echo "=== 部署完成 ==="
          echo "🎉 部署流程完成！"
          echo "🌐 访问地址: http://${{ secrets.TENCENT_HOST }}"
          echo "📊 API地址: http://${{ secrets.TENCENT_HOST }}/api/v1"
          echo "🏥 健康检查: http://${{ secrets.TENCENT_HOST }}/health"