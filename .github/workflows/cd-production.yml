name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave empty for latest)'
        required: false
        default: ''

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/new-ai-proj-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/new-ai-proj-backend

jobs:
  # 构建和推送 Docker 镜像
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=$(date +%Y%m%d)-$(git rev-parse --short HEAD)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.dev
        target: production
        push: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.FRONTEND_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          REACT_APP_API_URL=${{ secrets.PROD_API_URL }}
          REACT_APP_ENV=production

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.BACKEND_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 部署到服务器
  deploy:
    name: Deploy to proj-joylodging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://proj-joylodging.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp docker-compose.prod.yml deploy-package/docker-compose.yml
        cp -r nginx deploy-package/
        cp init.sql deploy-package/
        
        # 创建环境变量文件
        cat > deploy-package/.env.production << EOF
        # Database
        DB_HOST=postgres
        DB_PORT=5432
        DB_NAME=${{ secrets.PROD_DB_NAME }}
        DB_USER=${{ secrets.PROD_DB_USER }}
        DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
        
        # Backend
        JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
        GIN_MODE=release
        LOG_LEVEL=info
        
        # Docker Images
        FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.version }}
        BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.version }}
        
        # Version Info
        DEPLOY_VERSION=${{ needs.build-and-push.outputs.version }}
        DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        EOF

    - name: Copy files to server
      run: |
        scp -i ~/.ssh/deploy_key -r deploy-package/* \
          ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/new-ai-proj/

    - name: Deploy services
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          cd /home/${{ secrets.SERVER_USER }}/new-ai-proj
          
          # 备份当前版本
          if [ -f .env.production ]; then
            cp .env.production .env.production.backup-$(date +%Y%m%d-%H%M%S)
          fi
          
          # 拉取最新镜像
          docker compose -f docker-compose.yml pull
          
          # 停止旧容器（保留数据卷）
          docker compose -f docker-compose.yml down
          
          # 启动新容器
          docker compose -f docker-compose.yml up -d
          
          # 等待服务启动
          sleep 30
          
          # 健康检查
          for service in postgres backend frontend nginx; do
            if ! docker compose -f docker-compose.yml ps $service | grep -q "healthy"; then
              echo "Service $service is not healthy"
              docker compose -f docker-compose.yml logs $service
              exit 1
            fi
          done
          
          # 清理旧镜像
          docker image prune -f
          
          echo "Deployment completed successfully!"
        ENDSSH

    - name: Verify deployment
      run: |
        # 等待服务完全启动
        sleep 10
        
        # 检查健康端点
        response=$(curl -s -o /dev/null -w "%{http_code}" https://proj-joylodging.com/health)
        if [ $response -eq 200 ]; then
          echo "Health check passed"
        else
          echo "Health check failed with status code: $response"
          exit 1
        fi

    - name: Send notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Production Deployment ${{ job.status }}
          Version: ${{ needs.build-and-push.outputs.version }}
          Deployed by: ${{ github.actor }}
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # 回滚机制
  rollback:
    name: Rollback if needed
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: failure()
    
    steps:
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Rollback to previous version
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
          cd /home/${{ secrets.SERVER_USER }}/new-ai-proj
          
          # 恢复备份的环境变量
          if [ -f .env.production.backup-* ]; then
            latest_backup=$(ls -t .env.production.backup-* | head -1)
            cp $latest_backup .env.production
            
            # 重新部署上一个版本
            docker compose -f docker-compose.yml down
            docker compose -f docker-compose.yml up -d
            
            echo "Rollback completed"
          else
            echo "No backup found for rollback"
            exit 1
          fi
        ENDSSH
