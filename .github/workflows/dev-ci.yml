name: Development CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [feature/*, develop]

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.23'

jobs:
  frontend-checks:
    name: Frontend Code Quality & Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check code formatting
        run: npm run format -- --check || (echo "Code formatting issues found. Run 'npm run format' to fix." && exit 1)
      
      - name: TypeScript type checking
        run: npm run type-check
      
      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
      
      - name: Build application
        run: npm run build
        env:
          GENERATE_SOURCEMAP: false
          REACT_APP_API_URL: /api/v1
          NODE_ENV: production
      
      - name: Check build size
        run: |
          cd build
          BUNDLE_SIZE=$(du -sh . | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          # Check if build size is reasonable (adjust threshold as needed)
          SIZE_KB=$(du -sk . | cut -f1)
          if [ $SIZE_KB -gt 10240 ]; then
            echo "Warning: Bundle size ($BUNDLE_SIZE) is larger than 10MB"
          fi

  backend-checks:
    name: Backend Code Quality & Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: './backend/go.sum'
      
      - name: Download dependencies
        run: go mod download
      
      - name: Verify dependencies
        run: go mod verify
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code formatting issues found:"
            gofmt -s -l .
            echo "Run 'gofmt -s -w .' to fix formatting issues."
            exit 1
          fi
      
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run staticcheck
        run: staticcheck ./...
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          DB_SOURCE: postgresql://test_user:test_password@localhost:5432/test_db?sslmode=disable
          JWT_SECRET: test_jwt_secret_for_ci
          GIN_MODE: test
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
      
      - name: Build application
        run: go build -v -o main .
      
      - name: Check binary size
        run: |
          BINARY_SIZE=$(du -sh main | cut -f1)
          echo "Binary size: $BINARY_SIZE"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build test environment
        run: |
          cp .env.example .env 2>/dev/null || echo "No .env.example found, creating minimal .env"
          cat > .env << EOF
          ENV=test
          NODE_ENV=test
          DB_HOST=postgres-master
          DB_PORT=5432
          DB_USER=dev_user
          DB_PASSWORD=dev_password_2024
          DB_NAME=ai_project_db
          JWT_SECRET=test_jwt_secret_for_integration
          GIN_MODE=test
          EOF
      
      - name: Start services
        run: |
          docker-compose -f docker-compose.dev.yml up -d postgres-master
          sleep 30  # Wait for database to be ready
      
      - name: Run integration tests
        run: |
          # Run backend integration tests
          cd backend
          go test -v -tags=integration ./tests/...
        env:
          DB_SOURCE: postgresql://dev_user:dev_password_2024@localhost:5433/ai_project_db?sslmode=disable
      
      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.dev.yml down -v

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Test frontend Docker build
        run: |
          cd frontend
          docker build --target development -t ai-project-frontend:dev .
          docker build --target production -t ai-project-frontend:prod .
      
      - name: Test backend Docker build
        run: |
          cd backend
          docker build --target development -t ai-project-backend:dev .
          docker build --target production -t ai-project-backend:prod .
      
      - name: Test docker-compose build
        run: |
          cp .env.example .env 2>/dev/null || echo "ENV=test" > .env
          docker-compose -f docker-compose.dev.yml config
          echo "Docker Compose configuration is valid"