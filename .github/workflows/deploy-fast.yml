name: Fast Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/deploy-fast.yml'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ai-project

jobs:
  # ================================================
  # Job 1: Detect Changes (智能检测)
  # ================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed files
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      - name: Show change detection results
        run: |
          echo "Backend changed: ${{ steps.filter.outputs.backend }}"
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"

  # ================================================
  # Job 2: Build and Push Backend (条件执行)
  # ================================================
  build-backend:
    name: Build Backend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event.inputs.force_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-backend:buildcache,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  # ================================================
  # Job 3: Build and Push Frontend (条件执行)
  # ================================================
  build-frontend:
    name: Build Frontend Image
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event.inputs.force_rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-frontend:buildcache,mode=max
          build-args: |
            REACT_APP_API_URL=https://proj.joylodging.com/api/v1
            REACT_APP_ENV=production
            GENERATE_SOURCEMAP=false
            TSC_COMPILE_ON_ERROR=true

  # ================================================
  # Job 4: Deploy to Production (快速部署)
  # ================================================
  deploy:
    name: Deploy to Server
    needs: [detect-changes, build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Verify deployment directory exists
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "
            ls -la /opt/ai-project-cicd || echo 'Directory does not exist!'
          "

      - name: Prepare deployment script
        run: |
          # 创建部署脚本
          cat > deploy-fast.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          BACKEND_CHANGED="${{ needs.detect-changes.outputs.backend }}"
          FRONTEND_CHANGED="${{ needs.detect-changes.outputs.frontend }}"
          IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
          COMMIT_SHA="${{ github.sha }}"

          echo "🔐 Logging in to GitHub Container Registry..."
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          cd /opt/ai-project-cicd

          # 只拉取和更新变化的服务
          if [ "$BACKEND_CHANGED" == "true" ]; then
            echo "📥 Pulling backend image..."
            docker pull ${IMAGE_PREFIX}-backend:${COMMIT_SHA}

            echo "🔄 Stopping old backend container..."
            docker stop ai_backend_prod || true
            docker rm ai_backend_prod || true

            echo "🚀 Starting new backend container..."
            # 读取现有配置
            source .env.prod 2>/dev/null || true

            docker run -d \
              --name ai_backend_prod \
              --network ai_prod_network \
              -p 127.0.0.1:8080:8080 \
              -e ENV=production \
              -e DB_HOST=ai_postgres_prod \
              -e DB_PORT=5432 \
              -e DB_USER=${DB_USER} \
              -e DB_PASSWORD=${DB_PASSWORD} \
              -e DB_NAME=${DB_NAME} \
              -e JWT_SECRET=${JWT_SECRET} \
              -e GIN_MODE=release \
              -e LOG_LEVEL=info \
              -v /opt/ai-project-cicd/logs:/app/logs \
              --restart=always \
              ${IMAGE_PREFIX}-backend:${COMMIT_SHA}
          else
            echo "⏭️  Backend unchanged, skipping update"
          fi

          if [ "$FRONTEND_CHANGED" == "true" ]; then
            echo "📥 Pulling frontend image..."
            docker pull ${IMAGE_PREFIX}-frontend:${COMMIT_SHA}

            echo "🔄 Stopping old frontend container..."
            docker stop ai_frontend_prod || true
            docker rm ai_frontend_prod || true

            echo "🚀 Starting new frontend container..."
            docker run -d \
              --name ai_frontend_prod \
              --network ai_prod_network \
              -p 127.0.0.1:3000:80 \
              -e NODE_ENV=production \
              --restart=always \
              ${IMAGE_PREFIX}-frontend:${COMMIT_SHA}
          else
            echo "⏭️  Frontend unchanged, skipping update"
          fi

          echo "✅ Deployment complete!"
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          DEPLOY_SCRIPT

          chmod +x deploy-fast.sh

      - name: Upload and run deployment script
        timeout-minutes: 10
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          # 上传部署脚本
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            deploy-fast.sh $SSH_USER@$SSH_HOST:/opt/ai-project-cicd/

          # 执行部署
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd /opt/ai-project-cicd
            chmod +x deploy-fast.sh
            ./deploy-fast.sh
          "

      - name: Health check
        timeout-minutes: 3
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "
            echo 'Waiting for services to be healthy...'
            sleep 10

            # Check backend only if it was updated
            if [ '$BACKEND_CHANGED' == 'true' ]; then
              if curl -f http://localhost:8080/health; then
                echo '✅ Backend is healthy'
              else
                echo '❌ Backend health check failed'
                exit 1
              fi
            else
              echo '⏭️  Backend not updated, skipping health check'
            fi

            # Check frontend only if it was updated
            if [ '$FRONTEND_CHANGED' == 'true' ]; then
              if curl -f http://localhost:3000; then
                echo '✅ Frontend is accessible'
              else
                echo '❌ Frontend check failed'
                exit 1
              fi
            else
              echo '⏭️  Frontend not updated, skipping health check'
            fi

            echo '✅ All health checks passed!'
          "

      - name: Deployment summary
        if: always()
        env:
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
        run: |
          echo "=========================================="
          echo "Fast Deployment Summary"
          echo "=========================================="
          echo "Backend Changed: $BACKEND_CHANGED"
          echo "Frontend Changed: $FRONTEND_CHANGED"
          if [ "$BACKEND_CHANGED" == "true" ]; then
            echo "Backend Image: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}"
          fi
          if [ "$FRONTEND_CHANGED" == "true" ]; then
            echo "Frontend Image: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}"
          fi
          echo "Status: ${{ job.status }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

  # ================================================
  # Job 5: Notify (可选)
  # ================================================
  notify:
    name: Notify Result
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment result
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Fast deployment successful!"
            echo "⏱️ Estimated time saved: 15-18 minutes"
          else
            echo "❌ Deployment failed!"
          fi
