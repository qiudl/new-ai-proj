name: Deploy to Tencent Cloud

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 构建并推送镜像
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      frontend-image: ${{ steps.frontend-meta.outputs.tags }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建后端镜像
      - name: Extract Backend Metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建前端镜像
      - name: Extract Frontend Metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 部署到腾讯云
  deploy-tencent-cloud:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          PROJECT_DIR: /opt/new-ai-proj
          DB_USER: ${{ secrets.PRODUCTION_DB_USER }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          DOMAIN: ${{ secrets.PRODUCTION_HOST }}
          API_URL: ${{ secrets.PRODUCTION_API_URL }}
          FRONTEND_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            set -e
            
            echo "🚀 开始部署到腾讯云服务器..."
            
            # 切换到项目目录
            cd ${{ env.PROJECT_DIR }}
            
            # 创建备份
            echo "📦 创建数据库备份..."
            mkdir -p backups
            if docker-compose ps | grep -q postgres_prod; then
              docker-compose exec -T db pg_dump -U ${{ env.DB_USER }} ${{ env.DB_NAME }} > backups/backup_$(date +%Y%m%d_%H%M%S).sql
            fi
            
            # 拉取最新镜像
            echo "📥 拉取最新Docker镜像..."
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GHCR_TOKEN }}
            docker pull ${{ needs.build-and-push.outputs.backend-image }}
            docker pull ${{ needs.build-and-push.outputs.frontend-image }}
            
            # 更新环境变量
            echo "⚙️ 更新环境配置..."
            cat > .env.prod << EOL
          DB_USER=${{ env.DB_USER }}
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          DB_NAME=${{ env.DB_NAME }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          DOMAIN=${{ env.DOMAIN }}
          REACT_APP_API_URL=${{ env.API_URL }}
          REACT_APP_API_BASE_URL=/api/v1
          BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}
          FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend-image }}
          EOL
            
            # 更新docker-compose文件中的镜像标签
            sed -i "s|ghcr.io/.*/backend:.*|${{ needs.build-and-push.outputs.backend-image }}|g" docker-compose.prod.yml
            sed -i "s|ghcr.io/.*/frontend:.*|${{ needs.build-and-push.outputs.frontend-image }}|g" docker-compose.prod.yml
            
            # 重启服务
            echo "🔄 重启服务..."
            docker-compose -f docker-compose.prod.yml --env-file .env.prod down
            docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 60
            
            # 清理未使用的镜像
            docker image prune -f
            
            echo "✅ 部署完成！"
          EOF

      - name: Health Check
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            echo "🔍 执行健康检查..."
            
            # 检查容器状态
            docker-compose -f /opt/new-ai-proj/docker-compose.prod.yml ps
            
            # 检查服务健康状态
            sleep 30
            
            # 检查后端API
            if curl -f http://localhost/health > /dev/null 2>&1; then
              echo "✅ 后端API健康检查通过"
            else
              echo "❌ 后端API健康检查失败"
              exit 1
            fi
            
            # 检查前端
            if curl -f http://localhost/ > /dev/null 2>&1; then
              echo "✅ 前端健康检查通过"
            else
              echo "❌ 前端健康检查失败"
              exit 1
            fi
            
            # 检查数据库
            if docker-compose -f /opt/new-ai-proj/docker-compose.prod.yml exec -T db pg_isready -U ${{ secrets.PRODUCTION_DB_USER }} > /dev/null 2>&1; then
              echo "✅ 数据库健康检查通过"
            else
              echo "❌ 数据库健康检查失败"
              exit 1
            fi
            
            echo "🎉 所有健康检查通过，部署成功！"
          EOF

      - name: Update DNS (Optional)
        if: github.ref == 'refs/heads/main'
        env:
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
        run: |
          echo "🌐 DNS记录更新（如果需要的话）"
          # 这里可以添加腾讯云DNS API调用来更新DNS记录

      - name: Notify Success via DingTalk/企业微信
        if: success()
        run: |
          # 发送成功通知到钉钉或企业微信
          curl -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "🎉 项目部署成功！\n环境: ${{ github.event.inputs.environment || '\''production'\'' }}\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n时间: '"$(date)"'"
              }
            }' || true

      - name: Notify Failure via DingTalk/企业微信
        if: failure()
        run: |
          # 发送失败通知到钉钉或企业微信
          curl -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "❌ 项目部署失败！\n环境: ${{ github.event.inputs.environment || '\''production'\'' }}\n分支: ${{ github.ref_name }}\n提交: ${{ github.sha }}\n时间: '"$(date)"'\n请检查GitHub Actions日志"
              }
            }' || true

  # 回滚功能
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure()
    needs: [build-and-push, deploy-tencent-cloud]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Rollback to Previous Version
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            echo "🔄 开始回滚部署..."
            
            cd /opt/new-ai-proj
            
            # 停止当前服务
            docker-compose -f docker-compose.prod.yml down
            
            # 恢复到previous标签的镜像
            docker tag ghcr.io/${{ github.repository }}/backend:previous ghcr.io/${{ github.repository }}/backend:latest
            docker tag ghcr.io/${{ github.repository }}/frontend:previous ghcr.io/${{ github.repository }}/frontend:latest
            
            # 重启服务
            docker-compose -f docker-compose.prod.yml up -d
            
            # 等待服务启动
            sleep 30
            
            # 验证回滚成功
            if curl -f http://localhost/health > /dev/null 2>&1; then
              echo "✅ 回滚成功"
            else
              echo "❌ 回滚失败"
              exit 1
            fi
          EOF

      - name: Notify Rollback
        run: |
          curl -X POST "${{ secrets.DINGTALK_WEBHOOK }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "msgtype": "text",
              "text": {
                "content": "⚠️ 部署失败，已自动回滚到上一个版本\n环境: ${{ github.event.inputs.environment || '\''production'\'' }}\n时间: '"$(date)"'"
              }
            }' || true