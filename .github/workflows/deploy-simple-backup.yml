name: Deploy to Lightweight Server (Backup Method)

on:
  workflow_dispatch:  # 只允许手动触发

jobs:
  deploy-via-archive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment archive
      run: |
        # 创建部署包，排除不必要的文件
        tar --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='backend/main' \
            --exclude='backend/ai-project-backend' \
            --exclude='backend/test_build' \
            --exclude='backend/temp_build' \
            -czf deployment.tar.gz .
        
        echo "部署包大小: $(du -h deployment.tar.gz)"

    - name: Upload and deploy via archive
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          
          # 设置变量
          PROJECT_DIR="/opt/ai-project"
          
          echo "=== 开始备用部署流程 ==="
          
          # 检查并安装必要工具
          echo "=== 检查系统依赖 ==="
          if ! command -v docker >/dev/null 2>&1; then
            echo "安装Docker..."
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker $USER
            sudo systemctl start docker
            sudo systemctl enable docker
          fi
          
          if ! command -v docker-compose >/dev/null 2>&1; then
            echo "安装Docker Compose..."
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          
          # 创建项目目录
          echo "=== 准备项目目录 ==="
          sudo mkdir -p $PROJECT_DIR
          sudo chown -R $USER:$USER $PROJECT_DIR
          cd $PROJECT_DIR
          
          # 备份当前部署
          if [ -d "current" ]; then
            echo "备份当前版本..."
            mv current backup-$(date +%Y%m%d_%H%M%S) || true
          fi
          
          echo "=== 等待部署包上传 ==="
          echo "准备接收部署包..."

    - name: Upload deployment package
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        source: "deployment.tar.gz"
        target: "/opt/ai-project/"

    - name: Extract and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          set -e
          
          PROJECT_DIR="/opt/ai-project"
          cd $PROJECT_DIR
          
          echo "=== 解压部署包 ==="
          if [ -f "deployment.tar.gz" ]; then
            mkdir -p current
            tar -xzf deployment.tar.gz -C current
            rm deployment.tar.gz
            echo "✅ 部署包解压完成"
          else
            echo "❌ 找不到部署包"
            exit 1
          fi
          
          cd current
          
          echo "=== 检查配置文件 ==="
          ls -la
          
          if [ ! -f "docker-compose.simple.yml" ]; then
            echo "❌ 找不到docker-compose.simple.yml文件"
            exit 1
          fi
          
          # 创建环境配置文件
          if [ ! -f ".env" ]; then
            echo "创建环境配置文件..."
            if [ -f ".env.simple" ]; then
              cp .env.simple .env
            else
              cat > .env << EOF
          DB_USER=ai_user
          DB_PASSWORD=ai_password_2024
          DB_NAME=ai_project_db
          JWT_SECRET=dev_jwt_secret_2024
          EOF
            fi
          fi
          
          echo "=== 停止现有服务 ==="
          docker-compose -f docker-compose.simple.yml down || true
          
          echo "=== 清理旧资源 ==="
          docker container prune -f || true
          docker image prune -f || true
          
          echo "=== 构建并启动服务 ==="
          docker-compose -f docker-compose.simple.yml up --build -d
          
          echo "=== 等待服务启动 ==="
          sleep 45
          
          echo "=== 检查服务状态 ==="
          docker-compose -f docker-compose.simple.yml ps
          
          echo "=== 健康检查 ==="
          if curl -f http://localhost/health >/dev/null 2>&1; then
            echo "✅ 部署成功！应用正常运行"
          else
            echo "⚠️ 健康检查失败，查看日志："
            docker-compose -f docker-compose.simple.yml logs --tail=30
          fi
          
          echo "=== 部署完成 ==="
          echo "🎉 备用部署方式完成！"
          echo "🌐 访问地址: http://${{ secrets.TENCENT_HOST }}"