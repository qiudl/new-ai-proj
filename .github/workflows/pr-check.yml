name: Pull Request CI Checks

on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # ================================================
  # 代码质量检查
  # ================================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go fmt check
        working-directory: ./backend
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "以下文件需要格式化:"
            gofmt -s -l .
            exit 1
          fi

      - name: Go vet check
        working-directory: ./backend
        run: go vet ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint check
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

  # ================================================
  # 后端构建和测试
  # ================================================
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run tests
        working-directory: ./backend
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build backend
        working-directory: ./backend
        run: |
          GOOS=linux GOARCH=amd64 go build -o ai-project-backend main.go
          ls -lh ai-project-backend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  # ================================================
  # 前端构建和测试
  # ================================================
  frontend-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --coverage --watchAll=false

      - name: Type check
        working-directory: ./frontend
        run: npm run type-check

      - name: Build frontend
        working-directory: ./frontend
        env:
          REACT_APP_API_URL: https://proj.joylodging.com/api/v1
          REACT_APP_ENV: production
          GENERATE_SOURCEMAP: false
        run: npm run build

  # ================================================
  # PR信息汇总
  # ================================================
  pr-summary:
    name: PR Summary
    needs: [code-quality, backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "=========================================="
          echo "PR检查汇总"
          echo "=========================================="
          echo "代码质量: ${{ needs.code-quality.result }}"
          echo "后端测试: ${{ needs.backend-test.result }}"
          echo "前端测试: ${{ needs.frontend-test.result }}"
          echo "=========================================="

          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-test.result }}" != "success" ]; then
            echo "❌ PR检查失败，请修复问题后重新提交"
            exit 1
          fi

          echo "✅ 所有检查通过！"
