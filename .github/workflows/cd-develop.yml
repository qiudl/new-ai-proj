name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/new-ai-proj-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/new-ai-proj-backend

jobs:
  # 快速构建和部署
  deploy-dev:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.proj-joylodging.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        VERSION=dev-$(date +%Y%m%d)-$(git rev-parse --short HEAD)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying development version: $VERSION"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.dev
        target: development
        push: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.FRONTEND_IMAGE }}:dev-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          REACT_APP_API_URL=${{ secrets.DEV_API_URL }}
          REACT_APP_ENV=development

    - name: Build and push backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          ${{ env.BACKEND_IMAGE }}:dev-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to development server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DEV_SERVER_HOST }}
        username: ${{ secrets.DEV_SERVER_USER }}
        key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        script: |
          cd /home/${{ secrets.DEV_SERVER_USER }}/new-ai-proj-dev
          
          # 更新镜像版本
          export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
          export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
          
          # 拉取最新镜像
          docker compose -f docker-compose.dev.yml pull
          
          # 重启服务
          docker compose -f docker-compose.dev.yml up -d
          
          # 清理旧镜像
          docker image prune -f

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          Development Deployment ${{ job.status }}
          Version: ${{ steps.version.outputs.version }}
          Branch: develop
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
