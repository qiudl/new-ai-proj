name: Deploy to Tencent Cloud Production

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [ closed ]  # 只在PR合并后触发
  workflow_dispatch:  # 允许手动触发
  release:
    types: [ published ]  # 发布新版本时触发

env:
  REGISTRY: docker.io  # 使用Docker Hub
  NAMESPACE: your-dockerhub-username  # 替换为您的Docker Hub用户名
  IMAGE_NAME: ai-project-app
  REGION: ap-beijing  # 根据您的腾讯云地域调整

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-backend:latest,${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile.prod
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-frontend:latest,${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push MCP Server Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ai-proj-mcp
        file: ./ai-proj-mcp/Dockerfile.prod
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-mcp:latest,${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-mcp:${{ github.sha }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install psql client
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends postgresql-client

    # - name: Run DB migrations (Required)
    #   env:
    #     AI_TASKS_DB_URL: ${{ secrets.AI_TASKS_DB_URL }}
    #   run: |
    #     test -n "$AI_TASKS_DB_URL" || (echo "AI_TASKS_DB_URL secret is required for production migrations" && exit 1)
    #     psql "$AI_TASKS_DB_URL" -f db/migrations/V20250821_1500__create_dictionaries.sql
    #     psql "$AI_TASKS_DB_URL" -f db/migrations/V20250821_1501__seed_dictionaries.sql
    #     psql "$AI_TASKS_DB_URL" -f db/migrations/V20250821_1502__create_task_dependencies.sql
    #     psql "$AI_TASKS_DB_URL" -f db/migrations/V20250821_1503__extend_task_dependencies.sql
    # Note: Migration files removed as they don't exist in the repository.
    # Database migrations are auto-executed by the backend application on startup.

    - name: Deploy to Tencent Cloud Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.TENCENT_HOST }}
        username: ${{ secrets.TENCENT_USERNAME }}
        key: ${{ secrets.TENCENT_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # 设置变量
          export REGISTRY="${{ env.REGISTRY }}"
          export NAMESPACE="${{ env.NAMESPACE }}"
          export IMAGE_NAME="${{ env.IMAGE_NAME }}"
          export COMMIT_SHA="${{ github.sha }}"
          
          # 创建部署目录
          mkdir -p /opt/ai-project
          cd /opt/ai-project
          
          # 登录Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # 下载最新的配置文件
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o docker-compose.prod.yml \
               "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.prod.yml"
          
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o .env.production \
               "https://api.github.com/repos/${{ github.repository }}/contents/.env.production"
          
          # 拉取最新镜像
          docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-backend:latest
          docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-frontend:latest
          docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-mcp:latest
          
          # 备份当前运行的容器（如果存在）
          if docker-compose -f docker-compose.prod.yml ps -q | grep -q .; then
            echo "Creating backup of current deployment..."
            docker-compose -f docker-compose.prod.yml down
          fi
          
          # 启动新的部署
          docker-compose -f docker-compose.prod.yml up -d
          
          # 清理旧镜像
          docker image prune -f
          
          # 健康检查
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # 检查服务状态
          docker-compose -f docker-compose.prod.yml ps
          
          # 检查应用是否正常响应
          if curl -f http://localhost/health; then
            echo "✅ Deployment successful! Application is responding."
          else
            echo "❌ Deployment may have issues. Attempting rollback..."
            docker-compose -f docker-compose.prod.yml logs --tail=50 || true
            # Rollback strategy: if PREV_SHA provided, switch tags; else restart with :latest as fallback
            if [ -n "${PREV_SHA}" ]; then
              docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-backend:${PREV_SHA} || true
              docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-frontend:${PREV_SHA} || true
              docker pull ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}-mcp:${PREV_SHA} || true
            fi
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml up -d || true
            sleep 20
            if curl -f http://localhost/health; then
              echo "🟡 Rolled back or restarted; service responding now."
            else
              echo "🔴 Rollback attempt failed. Please check logs and compose file."
              docker-compose -f docker-compose.prod.yml logs --tail=100 || true
              exit 1
            fi
          fi

    - name: Notify deployment status
      if: ${{ always() && secrets.SLACK_WEBHOOK_URL != '' }}
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          🚀 Production deployment ${{ job.status }}!

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          Backend Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          Frontend Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          MCP Image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-mcp:${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}