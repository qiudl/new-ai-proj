# 过滤器配置
filters:
  # 日期过滤
  date_range: "today"  # today, yesterday, this_week, last_week, this_month
  
  # 任务状态过滤
  status_filter: ["todo", "in_progress", "planning"]
  
  # 优先级过滤  
  priority_filter: ["high", "medium"]
  
  # 排除已有文档的任务
  exclude_with_docs: true
  
  # 任务类型过滤 (基于标题关键词)
  task_types:
    - "bug"
    - "feature" 
    - "enhancement"
    - "项目"
    - "阶段"
  
  # 最小描述长度 (字符数)
  min_description_length: 10
  
  # 项目ID过滤
  project_ids: [1]

# 输出配置
output:
  # 日志级别: error, warn, info, debug
  log_level: "info"
  
  # 显示进度条
  progress_bar: true
  
  # 生成总结报告
  summary_report: true
  
  # 导出格式
  export_formats: ["json", "csv"]
  
  # 输出目录
  output_dir: "./batch-docs-output"
  
  # 报告文件名模板
  report_filename: "batch-docs-report-{{timestamp}}.{{format}}"

# 高级选项
advanced:
  # 智能模板选择
  smart_template_selection: true
  
  # 模板匹配权重
  template_weights:
    title: 0.6
    description: 0.3
    tags: 0.1
  
  # 并发处理
  concurrent_requests: 3
  
  # 失败重试策略
  retry_strategy:
    max_attempts: 3
    backoff_multiplier: 2
    initial_delay: 1
  
  # 缓存设置
  cache:
    enabled: true
    duration: 300  # 5分钟
  
  # 变量替换
  global_variables:
    company_name: "AI项目管理系统"
    version: "1.0"
    author: "Claude Code Assistant"

# 通知配置 (可选)
notifications:
  # 邮件通知
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    username: "noreply@example.com"
    password: ""
    recipients: []
  
  # Webhook通知
  webhook:
    enabled: false
    url: ""
    method: "POST"
    headers: {}

# 调试配置
debug:
  # 启用调试模式
  enabled: false
  
  # 保存请求响应日志
  save_http_logs: false
  
  # 模拟模式 (不实际创建文档)
  dry_run: false
  
  # 详细输出
  verbose: false