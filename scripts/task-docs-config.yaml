      ## 📝 备注
      {{notes}}
      
      ---
      *自动生成时间*: {{generation_time}}
      *生成工具*: Claude Code 配置化脚本
    variables:
      estimated_hours: 2
      notes: "请根据实际情况补充技术细节"
    conditions:
      - field: "title"
        operator: "contains"
        value: ["bug", "修复", "fix", "错误"]

