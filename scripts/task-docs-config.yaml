# 配置驱动的批量文档生成配置文件
# Version: 1.0

# API配置
api:
  base_url: "http://localhost:8081/api/v1"
  auth:
    method: "jwt"
    username: "admin"
    password: "admin123"
  batch_size: 10
  retry_count: 3
  timeout: 30
  rate_limit: 0.5  # 请求间隔秒数

# 文档模板配置
