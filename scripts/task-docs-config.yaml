  # API文档模板
  api_documentation:
    title_template: "{{task_title}} - API接口文档"
    content_template: |
      # {{task_title}} - API接口文档
      
      ## 📋 接口概述
      **任务ID**: {{task_id}}
      **创建时间**: {{created_at}}
      **状态**: {{status}}
      **版本**: v1.0
      
      {{task_description}}
      
      ## 🔌 接口清单
      
      ### 核心接口
      | 方法 | 路径 | 描述 | 状态 |
      |------|------|------|------|
      | GET | `/api/v1/resource` | 获取资源列表 | ✅ 已实现 |
      | POST | `/api/v1/resource` | 创建资源 | 🔄 开发中 |
      | GET | `/api/v1/resource/:id` | 获取单个资源 | 🔄 开发中 |
      | PUT | `/api/v1/resource/:id` | 更新资源 | ⏳ 计划中 |
      | DELETE | `/api/v1/resource/:id` | 删除资源 | ⏳ 计划中 |
      
      ## 📖 接口详情
      
      ### 1. 获取资源列表
      
      ```http
      GET /api/v1/resource
      ```
      
      **请求参数**:
      ```json
      {
        "page": 1,
        "page_size": 20,
        "search": "搜索关键词",
        "status": "active"
      }
      ```
      
      **响应示例**:
      ```json
      {
        "success": true,
        "data": {
          "items": [
            {
              "id": 1,
              "name": "资源名称",
              "status": "active",
              "created_at": "2025-01-01T00:00:00Z"
            }
          ],
          "pagination": {
            "page": 1,
            "page_size": 20,
            "total": 100,
            "has_next": true
          }
        }
      }
      ```
      
      ### 2. 创建资源
      
      ```http
      POST /api/v1/resource
      ```
      
      **请求体**:
      ```json
      {
        "name": "资源名称",
        "description": "资源描述",
        "status": "active"
      }
      ```
      
      **响应示例**:
      ```json
      {
        "success": true,
        "data": {
          "id": 1,
          "name": "资源名称",
          "description": "资源描述",
          "status": "active",
          "created_at": "2025-01-01T00:00:00Z"
        }
      }
      ```
      
      ## 🔒 认证授权
      
      ### JWT Token认证
      ```http
      Authorization: Bearer <jwt_token>
      ```
      
      ### 权限要求
      - **读取权限**: 普通用户
      - **创建权限**: 认证用户  
      - **修改权限**: 资源所有者或管理员
      - **删除权限**: 资源所有者或管理员
      
      ## 📝 状态码说明
      
      | 状态码 | 说明 | 处理方式 |
      |--------|------|----------|
      | 200 | 请求成功 | 正常处理响应数据 |
      | 201 | 资源创建成功 | 返回新创建的资源 |
      | 400 | 请求参数错误 | 检查请求参数格式 |
      | 401 | 未授权访问 | 检查认证token |
      | 403 | 权限不足 | 检查用户权限 |
      | 404 | 资源不存在 | 检查资源ID |
      | 500 | 服务器错误 | 联系技术支持 |
      
      ## 🧪 测试用例
      
      ### Postman集合
      ```json
      {
        "info": {
          "name": "{{task_title}} API Tests",
          "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
        },
        "item": [
          {
            "name": "获取资源列表",
            "request": {
              "method": "GET",
              "header": [
                {
                  "key": "Authorization",
                  "value": "Bearer {{jwt_token}}"
                }
              ],
              "url": {
                "raw": "{{base_url}}/api/v1/resource",
                "host": ["{{base_url}}"],
                "path": ["api", "v1", "resource"]
              }
            }
          }
        ]
      }
      ```
      
      ## ⏱️ 开发进度
      **预估工时**: {{estimated_hours}}小时
      **当前进度**: {{progress}}%
      
      ---
      *自动生成时间*: {{generation_time}}
      *生成工具*: Claude Code 配置化脚本
    variables:
      estimated_hours: 4
      progress: 30
    conditions:
      - field: "title"
        operator: "contains"
        value: ["API", "接口", "interface"]

